<style>
  /* Auth/login gate shell — no marketing chrome, full viewport. */
  html, body { height: 100%; margin: 0; }
  html:has(body.fa-auth-shell),
  body.fa-auth-shell,
  body.fa-auth-shell::before {
    background:
      radial-gradient(circle at 78% 18%,rgba(255,255,255,.98),transparent 22%),
      radial-gradient(circle at 12% 82%,rgba(255,255,255,.85),transparent 30%),
      linear-gradient(135deg,#f8f8f6 0%,#e8e8e3 52%,#f5f5f2 100%) !important;
  }
  body.fa-auth-shell {
    padding-top: 0 !important;
    overflow: hidden;
  }
  body.fa-auth-shell #lg-nav,
  body.fa-auth-shell .mobile-tabbar { display: none !important; }

  /* Kill the 64/76px public-nav offset used by full Index — it leaked as a white footer. */
  body.fa-auth-shell #ops,
  body.fa-auth-shell #ops.active,
  body.fa-auth-shell.login-mode-signin #ops.active:has(#ops-login-panel.active),
  body.fa-auth-shell.login-mode-signup #ops.active:has(#ops-login-panel.active) {
    display: flex !important;
    flex-direction: column;
    margin-top: 0 !important;
    height: 100dvh !important;
    min-height: 100dvh !important;
    max-height: 100dvh !important;
    overflow: hidden !important;
    background: transparent !important;
  }

  /*
   * Drive visibility from #ops.ops-shell-open (set by toggleOperationShell).
   * Use 100dvh — height:100% collapses to 0 when parent % chain breaks (blank page).
   */
  body.fa-auth-shell #ops:not(.ops-shell-open) > .ops-sidebar,
  body.fa-auth-shell #ops:not(.ops-shell-open) > .ops-main {
    display: none !important;
  }
  body.fa-auth-shell #ops:not(.ops-shell-open) #ops-access-gate {
    display: flex !important;
    flex: 1 1 auto;
    width: 100%;
    min-height: 100dvh !important;
    height: 100dvh !important;
    padding: 0 !important;
    align-items: stretch;
    justify-content: stretch;
  }
  body.fa-auth-shell #ops:not(.ops-shell-open) #ops-access-gate .ops-access-wrap,
  body.fa-auth-shell #ops:not(.ops-shell-open) #ops-login-panel.active,
  body.fa-auth-shell #ops:not(.ops-shell-open) .lg-login {
    flex: 1 1 auto;
    width: 100%;
    min-height: 100dvh !important;
    height: auto !important;
  }

  /* Internal dashboard after login */
  body.fa-auth-shell #ops.ops-shell-open {
    flex-direction: row !important;
  }
  body.fa-auth-shell #ops.ops-shell-open #ops-access-gate:not(.is-client-shell) {
    display: none !important;
  }
  body.fa-auth-shell #ops.ops-shell-open > .ops-sidebar,
  body.fa-auth-shell #ops.ops-shell-open > .ops-main {
    display: flex !important;
  }
  body.fa-auth-shell #ops.ops-shell-open > .ops-main {
    flex: 1 1 auto;
    min-width: 0;
    height: 100dvh !important;
    min-height: 0 !important;
  }

  /*
   * Cards use glass-enter / chart-enter with opacity:0 + fill-mode:both.
   * While login gate is up, .ops-main is display:none so the animation never
   * runs — after login the cards stay invisible (blank white dashboard).
   */
  body.fa-auth-shell #ops.ops-shell-open .glass-enter,
  body.fa-auth-shell #ops.ops-shell-open .chart-enter,
  body.fa-auth-shell #ops.ops-shell-open .pd-enter,
  body.fa-auth-shell #ops-client-access-panel.active .glass-enter,
  body.fa-auth-shell #ops-client-access-panel.active .chart-enter {
    opacity: 1 !important;
    transform: none !important;
  }

  /* Client portal stays inside the gate (is-client-shell), shell stays closed. */
  body.fa-auth-shell #ops:not(.ops-shell-open) #ops-access-gate.is-client-shell {
    display: flex !important;
  }
</style>

function loadLoginRecaptcha_() {
  if (window.__faRecaptchaRequested) return;

  var s = document.createElement('script');
  s.src = 'https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit';
  s.async = true;
  s.defer = true;
  document.head.appendChild(s);

<script>
(function bootAuthShell_() {
  function go() {
    var page = window.__FA_INITIAL_PAGE__ || 'ops';
    if (page === 'reset-password' && typeof setPage === 'function') {
      setPage('reset-password');
      return;
    }
    if (typeof setPage === 'function') setPage('ops');
    else if (typeof initOperationSystemAccess === 'function') {
      var ops = document.getElementById('ops');
      if (ops) {
        ops.style.display = 'flex';
        ops.classList.add('active');
      }
      initOperationSystemAccess();
    }
  }
  go();
})();
</script>
