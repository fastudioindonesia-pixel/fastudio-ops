(function applyLgOfficialLogos() {
  function setFavicon(src) {
    // Sumbernya PNG 512x512 persegi. Jangan deklarasikan sizes selain ukuran
    // aslinya — browser akan meregangkan gambar ke ukuran yang diklaim.
    var variants = [
      { key: "icon", rel: "icon", sizes: "512x512" },
      { key: "apple", rel: "apple-touch-icon", sizes: "180x180" }
    ];
    variants.forEach(function(v) {
      var el = document.querySelector("link[data-fa-favicon=\"" + v.key + "\"]");
      if (!el) {
        el = document.createElement("link");
        el.rel = v.rel;
        el.type = "image/png";
        el.setAttribute("sizes", v.sizes);
        el.setAttribute("data-fa-favicon", v.key);
        document.head.appendChild(el);
      }
      el.href = src;
    });
  }
  function fill() {
    var black = window.LG_LOGO_BLACK || "";
    var white = window.LG_LOGO_WHITE || "";
    var icon = window.LG_LOGO_ICON || "";
    var favicon = window.LG_APP_ICON || icon;
    document.querySelectorAll("[data-lg-logo=\"black\"]").forEach(function(img) {
      if (black && img.getAttribute("src") !== black) img.src = black;
    });
    document.querySelectorAll("[data-lg-logo=\"white\"]").forEach(function(img) {
      if (white && img.getAttribute("src") !== white) img.src = white;
    });
    document.querySelectorAll("[data-lg-logo=\"icon\"]").forEach(function(img) {
      if (icon && img.getAttribute("src") !== icon) img.src = icon;
    });
    var heroStage = window.LG_HERO_STAGE_PHOTO || "";
    document.querySelectorAll("[data-lg-hero-stage]").forEach(function(img) {
      if (heroStage && img.getAttribute("src") !== heroStage) img.src = heroStage;
    });
    if (favicon) setFavicon(favicon);
  }
  fill();
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", fill);
  }
})();

</script>
