<div id="reset-password" class="page">
  <div class="reset-password-shell">
    <div class="reset-password-panel lg-login-card">
      <div class="lg-login-card-brand">
        <button type="button" class="lg-login-brand-btn" onclick="setPage('ops')" aria-label="FA Studio">
          <img class="auth-logo auth-logo-light lg-login-logo" data-lg-logo="black" alt="FA Studio" width="112" height="24" decoding="async"/>
        </button>
      </div>
      <div class="auth-head">
        <h3 class="auth-form-title">Reset Password</h3>
        <p class="auth-form-sub">Masukkan email terdaftar, verifikasi OTP, lalu buat password baru.</p>
      </div>

      <div id="ops-reset-form">
        <div class="fg auth-fg auth-field--stack auth-field--otp">
          <label class="auth-label" for="ops-reset-email">Email</label>
          <div class="email-otp-row">
            <input type="email" class="fc auth-fc" id="ops-reset-email" placeholder="email@kamu.com" oninput="resetPasswordOtpState()" autocomplete="email"/>
            <button type="button" class="btn-otp btn-otp-send" id="btn-send-reset-otp" onclick="sendPasswordResetOtp()">Kirim OTP</button>
          </div>
          <div class="email-otp-verify">
            <input type="text" class="fc otp-input auth-fc" id="ops-reset-otp" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,6)"/>
            <button type="button" class="btn-otp btn-otp-verify" id="btn-verify-reset-otp" onclick="verifyPasswordResetOtp()">Verifikasi</button>
          </div>
          <div class="otp-status warn" id="reset-otp-status">Email belum diverifikasi.</div>
        </div>
        <div class="fg auth-fg auth-field--stack">
          <label class="auth-label" for="ops-reset-password">Password baru</label>
          <div class="auth-pass-wrap">
            <input type="password" class="fc auth-fc" id="ops-reset-password" placeholder="Huruf, angka, dan simbol" autocomplete="new-password"/>
            <button type="button" class="auth-pass-toggle" onclick="toggleAuthPassword('ops-reset-password', this)" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <div class="fg auth-fg auth-field--stack">
          <label class="auth-label" for="ops-reset-password-confirm">Konfirmasi password</label>
          <div class="auth-pass-wrap">
            <input type="password" class="fc auth-fc" id="ops-reset-password-confirm" placeholder="Ulangi password baru" autocomplete="new-password" onkeydown="if(event.key==='Enter'){submitPasswordReset();}"/>
            <button type="button" class="auth-pass-toggle" onclick="toggleAuthPassword('ops-reset-password-confirm', this)" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <button type="button" class="btn-signin" onclick="submitPasswordReset()">Simpan Password Baru</button>
        <p class="auth-switch auth-switch--footer"><button type="button" class="auth-link" onclick="setPage('ops')">Kembali ke Sign In</button></p>
      </div>
    </div>
  </div>
</div>
