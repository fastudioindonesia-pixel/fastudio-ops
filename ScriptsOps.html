function daysSinceDateClient(value) {
  if (!value) return null;
  var d = new Date(value);
  if (isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

function daysUntilDateClient(value) {
  if (!value) return null;
  var d = new Date(value);
  if (isNaN(d.getTime())) return null;
  return Math.ceil((d.getTime() - Date.now()) / 86400000);
}

function getLeadOverallProgressClient(lead) {
  if (typeof getLeadProductionOpsItems !== 'function' || typeof getProductionOpsSummaryClient !== 'function') return 0;
  var items = getLeadProductionOpsItems(normalizeLeadRow(lead));
  return Number((getProductionOpsSummaryClient(items) || {}).overallPercent || 0);
}

function buildAnalyticsUnblockData() {
  var total = LEADS.length;
  var statusCounts = {};
  ALL_STATUSES.forEach(function(status) { statusCounts[status] = 0; });
  var pipelineValue = 0;
  var outstanding = 0;
  var actions = [];
  var risks = [];

  LEADS.forEach(function(rawLead) {
    var lead = normalizeLeadRow(rawLead);
    var status = lead.status || 'New Lead';
    statusCounts[status] = (statusCounts[status] || 0) + 1;
    var projectId = lead.id;
    var client = lead.client || 'Client';
    var timestamp = lead.timestamp;
    var ageDays = daysSinceDateClient(timestamp);
    var prodAge = daysSinceDateClient(lead.productionUpdatedAt || timestamp);
    var productionStage = lead.productionStage || 'On Discuss';
    var stageNorm = typeof normalizeProductionStageClient === 'function'
      ? normalizeProductionStageClient(productionStage)
      : productionStage;

    if (status === 'Deal' || status === 'In-Production') {
      pipelineValue += Number(lead.projectTotal || 0) || 0;
    }

    var payment = getPaymentClientByProjectId(projectId) || {};
    var payStatus = normalizePaymentStatus(payment.paymentStatus || 'UNPAID');
    var projectTotal = Number(payment.projectTotal || lead.projectTotal || 0) || 0;
    var totalPaid = Number(payment.totalPaid || payment.amount || 0) || 0;
    var remaining = payment.remainingAmount !== '' && payment.remainingAmount !== undefined && payment.remainingAmount !== null
      ? Number(payment.remainingAmount || 0)
      : (projectTotal ? Math.max(projectTotal - totalPaid, 0) : 0);

    if ((status === 'Deal' || status === 'In-Production') && remaining > 0) {
      outstanding += remaining;
    }

    if ((status === 'New Lead' || status === 'In Progress') && ageDays != null && ageDays >= 3) {
      actions.push({
        priority: 80 + ageDays,
        title: 'Lead mengendap ' + ageDays + ' hari',
        description: client + ' · ' + status + ' — perlu follow-up Officer',
        tag: 'SLA Lead',
        tagClass: 'rejected',
        projectId: projectId,
        view: 'internal-db',
        ageLabel: ageDays + ' hari'
      });
    }

    if (status === 'Deal') {
      var noProgress = !lead.productionUpdatedAt || stageNorm === 'On Discuss';
      if (noProgress && ageDays != null && ageDays >= 5) {
        actions.push({
          priority: 75 + ageDays,
          title: 'Deal belum jalan produksi',
          description: client + ' · Deal ' + ageDays + ' hari · stage ' + stageNorm,
          tag: 'Produksi',
          tagClass: 'pending',
          projectId: projectId,
          view: 'internal-db',
          ageLabel: ageDays + ' hari'
        });
      }
    }

    if ((status === 'Deal' || status === 'In-Production') && prodAge != null && prodAge >= 7) {
      actions.push({
        priority: 40 + prodAge,
        title: 'Progress produksi diam ' + prodAge + ' hari',
        description: client + ' · ' + (productionStage || 'belum ada stage'),
        tag: 'Stale',
        tagClass: 'info',
        projectId: projectId,
        view: 'internal-db',
        ageLabel: prodAge + ' hari'
      });
    }

    var shootIn = daysUntilDateClient(lead.shootingStartDate);
    var progress = getLeadOverallProgressClient(lead);
    if ((status === 'Deal' || status === 'In-Production') && shootIn != null && shootIn >= 0 && shootIn <= 14) {
      var shootLabel = lead.shootingDateLabel || lead.shootingStartDate || 'shooting';
      var item = {
        priority: shootIn <= 7 ? (90 - shootIn) : (70 - shootIn),
        title: 'Shooting ' + (shootIn === 0 ? 'hari ini' : ('H-' + shootIn)),
        description: client + ' · progress ' + progress + '% · ' + shootLabel,
        tag: shootIn <= 7 ? 'Urgent' : 'Timeline',
        tagClass: shootIn <= 7 ? 'rejected' : 'risk',
        projectId: projectId,
        view: 'production-ops',
        ageLabel: 'H-' + shootIn
      };
      if (progress < 50 || shootIn <= 7) actions.push(item);
      else risks.push(item);
    }

    if ((status === 'Deal' || status === 'In-Production') && projectTotal > 0 && remaining > 0 && totalPaid === 0 && shootIn != null && shootIn <= 30) {
      risks.push({
        priority: 60,
        title: 'Revenue at risk',
        description: client + ' · piutang ' + formatRupiahCompact(remaining) + ' · shooting ' + (shootIn >= 0 ? ('H-' + shootIn) : 'lewat'),
        tag: 'Piutang',
        tagClass: 'risk',
        projectId: projectId,
        view: 'doc-gen'
      });
    }

    var opsDone = progress >= 100;
    var paidFull = payStatus === 'LUNAS';
    if ((status === 'Deal' || status === 'In-Production') && ((opsDone && !paidFull) || (paidFull && !opsDone))) {
      risks.push({
        priority: 65,
        title: 'Delivery blocked',
        description: client + ' · ' + (opsDone ? 'produksi selesai, payment belum lunas' : 'sudah lunas, produksi belum 100%'),
        tag: 'Gate Drive',
        tagClass: 'pending',
        projectId: projectId,
        view: opsDone ? 'doc-gen' : 'production-ops'
      });
    }
  });

  if (isDirectorUser()) {
    (PENDING_APPROVALS || []).forEach(function(item) {
      var age = daysSinceDateClient(item.submittedAt) || 0;
      if (item.type === 'DEPT') {
        var deptLabel = item.departmentLabel || item.departmentId || 'Departemen';
        var prog = Number(item.progress || 0);
        actions.push({
          priority: 100 + age,
          title: prog >= 100 ? ('Validasi selesai ' + deptLabel) : ('Validasi ' + deptLabel + ' · ' + prog + '%'),
          description: (item.clientName || item.projectId) + ' · menunggu keputusan Direktur',
          tag: 'Dept',
          tagClass: 'pending',
          approvalId: item.approvalId,
          projectId: item.projectId,
          view: 'production-ops',
          ageLabel: age ? (age + ' hari') : 'Baru'
        });
        return;
      }
      actions.push({
        priority: 95 + age,
        title: 'Review pembayaran · ' + formatRupiahCompact(Number(item.amount || 0)),
        description: (item.clientName || item.projectId) + ' · bukti bayar menunggu approve',
        tag: 'Payment',
        tagClass: 'pending',
        approvalId: item.approvalId,
        projectId: item.projectId,
        view: 'doc-gen',
        ageLabel: age ? (age + ' hari') : 'Baru'
      });
    });
  }

  actions.sort(function(a, b) { return (b.priority || 0) - (a.priority || 0); });
  risks.sort(function(a, b) { return (b.priority || 0) - (a.priority || 0); });

  var paymentCounts = {};
  PAY_STATUSES.forEach(function(status) { paymentCounts[status] = 0; });
  var revenue = 0;
  PAYMENT_CLIENTS.forEach(function(client) {
    var status = normalizePaymentStatus(client.paymentStatus);
    paymentCounts[status] = (paymentCounts[status] || 0) + 1;
    revenue += Number(client.totalPaid || client.amount || 0) || 0;
  });

  var deal = statusCounts['Deal'] || 0;
  var inProd = statusCounts['In-Production'] || 0;
  var done = statusCounts['Done'] || 0;
  var hold = statusCounts['On Hold'] || 0;
  var newLead = statusCounts['New Lead'] || 0;
  var active = deal + inProd;
  var converted = deal + inProd + done;
  var conversion = total ? Math.round((converted / total) * 100) : 0;

  var chipCounts = {
    dept: (PENDING_APPROVALS || []).filter(function(a) { return a.type === 'DEPT'; }).length,
    payment: (PENDING_APPROVALS || []).filter(function(a) { return a.type !== 'DEPT'; }).length,
    stuckLead: actions.filter(function(a) { return a.title.indexOf('Lead mengendap') === 0; }).length,
    dealStuck: actions.filter(function(a) { return a.title.indexOf('Deal belum') === 0; }).length,
    shooting: actions.filter(function(a) { return a.title.indexOf('Shooting') === 0; }).length
  };

  return {
    total: total,
    statusCounts: statusCounts,
    paymentCounts: paymentCounts,
    pipelineValue: pipelineValue,
    revenue: revenue,
    outstanding: outstanding,
    conversion: conversion,
    converted: converted,
    active: active,
    done: done,
    hold: hold,
    newLead: newLead,
    inProd: inProd,
    deal: deal,
    actions: actions.slice(0, 10),
    risks: risks.slice(0, 8),
    chipCounts: chipCounts
  };
}

function handleAnalyticsItemClick(item) {
  if (!item) return;
  if (item.approvalId) {
    openApprovalReview(item.approvalId);
    return;
  }
  var projectId = item.projectId;
  if (!projectId) return;
  if (item.view === 'production-ops' && typeof openProductionOpsForProject === 'function') {
    openProductionOpsForProject(projectId);
    return;
  }
  if (item.view === 'doc-gen' && typeof goToProjectInvoice === 'function') {
    goToProjectInvoice(projectId);
    return;
  }
  if (typeof openProjectDetail === 'function') openProjectDetail(projectId);
}

function renderAnalyticsActionPanel(data) {
  var badge = document.getElementById('an-action-badge');
  var chipsEl = document.getElementById('an-action-chips');
  var listEl = document.getElementById('an-action-list');
  if (!listEl) return;

  window._ANALYTICS_ACTIONS = data.actions || [];
  var count = window._ANALYTICS_ACTIONS.length;
  if (badge) {
    badge.textContent = count + ' item';
    badge.classList.toggle('is-clear', !count);
  }

  if (chipsEl) {
    var chips = data.chipCounts || {};
    var chipDefs = [
      { key: 'dept', label: 'Dept pending' },
      { key: 'payment', label: 'Payment review' },
      { key: 'dealStuck', label: 'Deal stuck' },
      { key: 'stuckLead', label: 'Lead SLA' },
      { key: 'shooting', label: 'Shooting dekat' }
    ];
    chipsEl.innerHTML = chipDefs.map(function(def, idx) {
      var val = Number(chips[def.key] || 0);
      return '<div class="analytics-action-chip chart-enter" style="--enter-delay:' + (0.04 + idx * 0.04).toFixed(2) + 's"><span>' + escapeHtml(def.label) + '</span><i>' + val + '</i></div>';
    }).join('');
  }

  if (!count) {
    listEl.innerHTML = '<div class="analytics-action-empty">Tidak ada blocker prioritas saat ini. Pipeline berjalan normal.</div>';
    return;
  }

  listEl.innerHTML = window._ANALYTICS_ACTIONS.map(function(item, idx) {

function renderAnalyticsDonut(targetId, segments, centerLabel, centerSub) {
  var el = document.getElementById(targetId);
  if (!el) return;
  var all = segments || [];
  var filtered = all.filter(function(seg) { return Number(seg.value) > 0; });
  if (!filtered.length) {
    el.innerHTML = '<div class="analytics-donut-empty">Belum ada data untuk ditampilkan.</div>';
    return;
  }
  var total = filtered.reduce(function(sum, seg) { return sum + Number(seg.value); }, 0);
  var size = 168;
  var outer = 70;
  var inner = 48;
  var r = (outer + inner) / 2;
  var stroke = outer - inner;
  var cx = size / 2;
  var cy = size / 2;
  var circ = 2 * Math.PI * r;
  var padLen = (4 / 360) * circ;
  var acc = 0;
  var motion = opsMotionEnabled();
  var circles = filtered.map(function(seg) {
    var val = Number(seg.value);
    var len = Math.max(0, (val / total) * circ - padLen);
    var gap = circ - len;
    var rot = (acc / circ) * 360 - 90;
    acc += (val / total) * circ;
    var dashInit = motion
      ? ('0 ' + (len + gap).toFixed(2))
      : (len.toFixed(2) + ' ' + gap.toFixed(2));
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + seg.color + '" stroke-width="' + stroke + '" stroke-linecap="butt" class="analytics-donut-seg" data-len="' + len.toFixed(2) + '" data-gap="' + gap.toFixed(2) + '" stroke-dasharray="' + dashInit + '" transform="rotate(' + rot.toFixed(2) + ' ' + cx + ' ' + cy + ')"/>';
  }).join('');
  var legend = all.map(function(seg, idx) {
    return '<div class="analytics-donut-legend-item chart-enter" style="--enter-delay:' + (0.22 + idx * 0.06).toFixed(2) + 's"><span class="dot" style="background:' + seg.color + '"></span><span>' + escapeHtml(seg.label) + '</span><strong>' + Number(seg.value || 0) + '</strong></div>';
  }).join('');
  el.innerHTML = '<div class="analytics-donut-body chart-enter" style="--enter-delay:.08s">'
    + '<div class="analytics-donut-wrap">'
    + '<svg class="analytics-donut-svg" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' + circles + '</svg>'
    + '<div class="analytics-donut-center"' + (motion ? ' style="opacity:0;transform:scale(.9)"' : '') + '><strong>' + escapeHtml(centerLabel || String(total)) + '</strong><span>' + escapeHtml(centerSub || '') + '</span></div>'
    + '</div><div class="analytics-donut-legend">' + legend + '</div></div>';
  if (motion) {
    requestAnimationFrame(function() { animateDonutChart(el); });
  }
}

function downloadExcelFile(filename, html) {
  var blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function getCashflowStatus(projectStatus, paymentStatus, totalPaid, remainingAmount, projectTotal) {
  if (paymentStatus === 'LUNAS' || (projectTotal > 0 && remainingAmount <= 0 && totalPaid > 0)) return 'Lunas';
  if (totalPaid > 0 && remainingAmount > 0) return 'Piutang / Sisa Pembayaran';
  if (totalPaid > 0 && !projectTotal) return 'Pembayaran Tercatat';
  if (projectStatus === 'Rejected') return 'Tidak Dilanjutkan';
  if (projectStatus === 'New Lead') return 'Belum Deal';
  return 'Belum Ada Pembayaran';
}

function buildCashflowReportData() {
  var projects = [];
  var totalRevenue = 0;
  var totalPaidAll = 0;
  var totalRemaining = 0;
  LEADS.forEach(function(lead, index) {
    var normalizedLead = normalizeLeadRow(lead);
    var payment = getPaymentClientByProjectId(normalizedLead.id) || {};
    var projectStatus = normalizedLead.status || 'New Lead';
    var paymentStatus = normalizePaymentStatus(payment.paymentStatus || 'UNPAID');
    var projectTotal = Number(payment.projectTotal || 0) || 0;
    var totalPaid = Number(payment.totalPaid || payment.amount || 0) || 0;
    var remainingAmount = payment.remainingAmount !== '' && payment.remainingAmount !== undefined && payment.remainingAmount !== null
      ? Number(payment.remainingAmount || 0)
      : (projectTotal ? Math.max(projectTotal - totalPaid, 0) : 0);

    totalRevenue += projectTotal;
    totalPaidAll += totalPaid;
    totalRemaining += remainingAmount;

    projects.push({
      no: index + 1,
      projectId: normalizedLead.id,
      client: normalizedLead.client,
      pic: normalizedLead.pic,
      projectStatus: projectStatus,
      paymentStatus: paymentStatus,
      projectTotal: projectTotal,
      totalPaid: totalPaid,
      remainingAmount: remainingAmount,
      cashflowStatus: getCashflowStatus(projectStatus, paymentStatus, totalPaid, remainingAmount, projectTotal)
    });
  });

  return {
    exportDate: new Date().toLocaleString('id-ID'),
    totalProjects: LEADS.length,
    totalRevenue: totalRevenue,
    totalPaid: totalPaidAll,
    totalRemaining: totalRemaining,
    paidPct: totalRevenue ? Math.round((totalPaidAll / totalRevenue) * 100) + '%' : '0%',
    projects: projects
  };
}

function renderAnalyticsRows(targetId, rows, maxValue) {
  var target = document.getElementById(targetId);
  if (!target) return;
  maxValue = Number(maxValue) || Math.max.apply(null, rows.map(function(row){ return Number(row.value) || 0; })) || 1;
  target.innerHTML = rows.map(function(row) {
    var value = Number(row.value) || 0;
    var pct = Math.max(3, Math.min(100, Math.round((value / maxValue) * 100)));
    var barColor = getAnalyticsBarColor(pct);
    return '<div class="analytics-row">'
      +'<div class="analytics-row-label">'+escapeHtml(row.label)+'</div>'
      +'<div class="analytics-bar"><span style="width:'+pct+'%;background:'+barColor+'"></span></div>'
      +'<div class="analytics-row-val">'+escapeHtml(row.money ? formatRupiahCompact(value) : value)+'</div>'
      +'</div>';
  }).join('');
}

function getAnalyticsBarColor(percent) {
  percent = Math.max(0, Math.min(100, Number(percent) || 0));
  if (percent >= 70) return 'linear-gradient(90deg,#22c55e,#86efac)';
  if (percent >= 40) return 'linear-gradient(90deg,#f97316,#facc15)';
  return 'linear-gradient(90deg,#ef4444,#fb7185)';
}

function getAveragePaidRevenue(clients) {
  var paid = clients.filter(function(c){ return Number(c.totalPaid || c.amount || 0) > 0; });
  if (!paid.length) return 0;
  var total = paid.reduce(function(sum, c){ return sum + (Number(c.totalPaid || c.amount || 0) || 0); }, 0);
  return Math.round(total / paid.length);
}

function formatRupiahNumber(value) {

function formatRupiahJt(value) {
  value = Number(value || 0);
  if (value >= 1000000000) return 'Rp ' + (value / 1000000000).toFixed(1).replace('.0','') + ' M';
  if (value >= 1000000) return 'Rp ' + Math.round(value / 1000000) + ' Jt';
  if (value >= 1000) return 'Rp ' + Math.round(value / 1000) + ' Rb';
  return 'Rp ' + value.toLocaleString('id-ID');
}

function formatRupiahCompact(value) {
  value = Number(value || 0);
  if (value >= 1000000000) return 'Rp ' + (value / 1000000000).toFixed(1).replace('.0','') + 'B';
  if (value >= 1000000) return 'Rp ' + (value / 1000000).toFixed(1).replace('.0','') + 'M';
  if (value >= 1000) return 'Rp ' + (value / 1000).toFixed(0) + 'K';
  return 'Rp ' + value.toLocaleString('id-ID');
}

function submitIntake() {
  if (!validateBookingStep(1) || !validateBookingStep(2)) return;
  var payload = getBookingPayload();
  var submitBtn = document.getElementById('booking-submit-btn')
    || document.querySelector('#booking-step-3 .btn-submit');
  setButtonBusy(submitBtn, true, 'Mengirim…');
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        setButtonBusy(submitBtn, false);
        if (typeof markShootingDatesTaken === 'function') markShootingDatesTaken(res.shootingDates);
        resetBookingForm(false);
        showBookingThankYou(res.projectId);
        var loggedInClient = typeof isClientUser === 'function' && isClientUser();
        showToast('Brief Diterima', loggedInClient
          ? 'Project '+res.projectId+' sudah masuk dashboard client kamu.'
          : 'Project ID: '+res.projectId+' sudah tersimpan. Sign In untuk melihatnya di dashboard.');
      } else {
        setButtonBusy(submitBtn, false);
        // Tanggal direbut client lain di sela pengisian — tandai merah supaya langsung terlihat.
        if (res.shootingConflicts && typeof markShootingDatesTaken === 'function') {
          markShootingDatesTaken(res.shootingConflicts);
          if (typeof dropShootingSelectionIfConflict === 'function') dropShootingSelectionIfConflict();
        }
        showToast('Error',res.error,'warning');
      }
    })
    .withFailureHandler(function(err) {
      setButtonBusy(submitBtn, false);
      showToast('Error Submission',err.message,'warning');
    })
    .addClientIntake(payload);
}

        showToast('Gagal Memuat Users', res.error || 'Data user tidak bisa dimuat.', 'warning');
        renderInternalUsers();
      }
    })
    .withFailureHandler(function(err) {
      showToast('Error Users', err.message, 'warning');
      renderInternalUsers();
    })
    .listInternalUsers(getInternalPayKey());
}

var USERS_FILTER = 'internal';
var USERS_EDITING_EMAIL = '';

function isClientAccountRow(user) {
  return String((user && user.role) || '').trim().toUpperCase() === 'CLIENT';
}

function getUserRoleCfg(roleOrLabel) {
  var key = String(roleOrLabel || '').trim();
  var upper = key.toUpperCase();
  var map = {
    'DIRECTOR': { label: 'Direktur', color: '#8b3c9e', bg: 'rgba(139,60,158,0.13)' },
    'DIREKTUR': { label: 'Direktur', color: '#8b3c9e', bg: 'rgba(139,60,158,0.13)' },
    'OFFICER': { label: 'Officer', color: '#28b9d8', bg: 'rgba(40,185,216,0.12)' },
    'INTERNAL': { label: 'Officer', color: '#28b9d8', bg: 'rgba(40,185,216,0.12)' },
    'MARKETING': { label: 'Marketing', color: '#e63756', bg: 'rgba(230,55,86,0.12)' },
    'SOUND_MAN': { label: 'Sound Man', color: '#f59e0b', bg: 'rgba(245,158,11,0.12)' },
    'SOUND MAN': { label: 'Sound Man', color: '#f59e0b', bg: 'rgba(245,158,11,0.12)' },
    'EDITOR': { label: 'Editor', color: '#16a34a', bg: 'rgba(22,163,74,0.12)' },
    'FINAL_VIDEO': { label: 'Editor', color: '#16a34a', bg: 'rgba(22,163,74,0.12)' },
    'DEV': { label: 'Dev', color: '#6366f1', bg: 'rgba(99,102,241,0.12)' },
    'CLIENT': { label: 'Client', color: '#64748b', bg: 'rgba(100,116,139,0.12)' }
  };
  if (map[upper]) return map[upper];
  if (map[key]) return map[key];
  // Match display labels
  var byLabel = {
    'Direktur': map.DIRECTOR,
    'Officer': map.OFFICER,
    'Marketing': map.MARKETING,
    'Sound Man': map.SOUND_MAN,
    'Editor': map.EDITOR,
    'Dev': map.DEV,
    'Client': map.CLIENT
  };
  return byLabel[key] || { label: key || 'Officer', color: '#28b9d8', bg: 'rgba(40,185,216,0.12)' };
}

function getUserInitials(name) {
  var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length >= 2) return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
  return parts[0].slice(0, 2).toUpperCase();
}

function setUsersFilter(key) {
  USERS_FILTER = key === 'client' ? 'client' : 'internal';
  renderInternalUsers();
}

function ensureUsersFilters() {

}

function syncUsersFilterButtons() {

function renderUsersStatsRow() {
  var el = document.getElementById('users-stats-row');
  if (!el) return;
  var total = INTERNAL_USERS.length;
  var internal = INTERNAL_USERS.filter(function(u) { return !isClientAccountRow(u); });
  var aktif = internal.filter(function(u) { return !!u.isActive; }).length;
  var roleSet = {};
  internal.forEach(function(u) {
    var label = getInternalUserDisplayRole(u);
    roleSet[label] = (roleSet[label] || 0) + 1;
  });
  var uniqueRoles = Object.keys(roleSet).length;
  var syncLabel = (typeof formatClientSyncLabel === 'function')
    ? formatClientSyncLabel(OPS_LAST_SYNC_LABEL || '')
    : 'Sinkron —';
  if (!syncLabel || syncLabel === 'Sinkron —') {
    var now = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    syncLabel = 'Sinkron ' + now;
  }

  var kpis = [
    { label: 'Total Users', value: total, color: '#28b9d8', bg: 'rgba(40,185,216,0.13)' },
    { label: 'Tim Aktif', value: aktif, color: '#16a34a', bg: 'rgba(22,163,74,0.13)' },
    { label: 'Role Unik', value: uniqueRoles, color: '#8b3c9e', bg: 'rgba(139,60,158,0.13)' }
  ];

  var kpiHtml = kpis.map(function(k) {
    return '<div class="tu-kpi" style="--tu-color:'+k.color+';--tu-bg:'+k.bg+'">'
      +'<span class="tu-kpi-val">'+k.value+'</span>'
      +'<span class="tu-kpi-label">'+escapeHtml(k.label)+'</span>'
    +'</div>';
  }).join('');

  var pills = Object.keys(roleSet).map(function(label) {
    var cfg = getUserRoleCfg(label);
    return '<span class="tu-role-pill" style="--tu-color:'+cfg.color+';--tu-bg:'+cfg.bg+'">'
      +'<i></i>'+escapeHtml(label)+' · '+roleSet[label]
    +'</span>';
  }).join('');

  el.innerHTML = ''
    + '<div class="tu-kpis">'+kpiHtml+'</div>'
    + '<div class="tu-stats-divider" aria-hidden="true"></div>'
    + '<div class="tu-role-pills">'+pills+'</div>'
    + '<div class="tu-sync-pill"><span class="tu-sync-dot"></span><span>'+escapeHtml(syncLabel)+'</span></div>';

function renderInternalUsers() {
  var body = document.getElementById('users-body');
  var count = document.getElementById('users-count');
  if (!body) return;
  syncUsersFilterButtons();
  renderUsersStatsRow();
  updateUserFormPreview();

  if (!INTERNAL_USERS.length) {
    body.innerHTML = '<div class="tu-empty">Belum ada user. Tambahkan user melalui form di kanan.</div>';
    if (count) count.innerHTML = '<strong>0</strong> user';
    return;
  }

  var rows = INTERNAL_USERS.filter(function(user) {
    if (USERS_FILTER === 'client') return isClientAccountRow(user);
    return !isClientAccountRow(user);
  });

  if (!rows.length) {
    body.innerHTML = '<div class="tu-empty">Tidak ada user pada filter ini. Coba pilih filter lain.</div>';
    if (count) count.innerHTML = '<strong>0</strong> dari ' + INTERNAL_USERS.length + ' user';
    return;
  }

  body.innerHTML = rows.map(function(user, idx) {
    var active = !!user.isActive;
    var jsEmail = escapeJs(user.email);
    var displayRole = getInternalUserDisplayRole(user);
    var cfg = getUserRoleCfg(displayRole);
    var canToggleUser = isDirectorUser();
    var canDeleteUser = isDirectorUser() && isClientAccountRow(user);
    var isEditing = USERS_EDITING_EMAIL
      && String(USERS_EDITING_EMAIL).trim().toLowerCase() === String(user.email || '').trim().toLowerCase();
    var initials = getUserInitials(user.name || user.email);

    var actions = '<button type="button" class="tu-btn tu-btn-edit" onclick="editInternalUser(\''+jsEmail+'\')">Edit</button>';
    if (canToggleUser) {
      actions += '<button type="button" class="tu-btn '+(active?'tu-btn-off':'tu-btn-on')+'" onclick="toggleInternalUser(\''+jsEmail+'\','+(!active)+')">'
        + (active
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a8 8 0 1 1-12.8 0"/></svg>Off'
          : 'On')
        + '</button>';
    }
    if (canDeleteUser) {
      actions += '<button type="button" class="tu-btn tu-btn-del" onclick="deleteClientAccount(\''+jsEmail+'\')">Hapus</button>';
    }

    return '<article class="tu-row'+(isEditing?' is-editing':'')+'" style="--tu-color:'+cfg.color+';--tu-bg:'+cfg.bg+';--enter-delay:'+(0.14 + idx * 0.05).toFixed(2)+'s">'
      +'<div class="tu-row-user">'
        +'<div class="tu-avatar">'+escapeHtml(initials)+'</div>'
        +'<div class="tu-identity">'
          +'<div class="tu-name">'+escapeHtml(user.name || '—')+'</div>'
          +'<div class="tu-email">'+escapeHtml(user.email || '—')+'</div>'
        +'</div>'
      +'</div>'
      +'<div class="tu-row-role"><span class="tu-badge">'+escapeHtml(displayRole)+'</span></div>'
      +'<div class="tu-row-status"><span class="tu-status '+(active?'is-on':'is-off')+'"><i></i>'+(active?'Aktif':'Non-Aktif')+'</span></div>'
      +'<div class="tu-row-aksi">'+actions+'</div>'
    +'</article>';
  }).join('');

  if (count) {
    count.innerHTML = rows.length === INTERNAL_USERS.length
      ? '<strong>'+INTERNAL_USERS.length+'</strong> user'
      : '<strong>'+rows.length+'</strong> dari '+INTERNAL_USERS.length+' user';
  }
  updateUserFormPermissions();
}

function buildClientDeleteResultMessage(email, res) {
  var parts = [];
  if (res.projectCount) {
    parts.push(res.projectCount + ' project dibatalkan');
    if (res.rowsRemoved) parts.push(res.rowsRemoved + ' baris data dihapus');
    if (res.driveTrashed) parts.push(res.driveTrashed + ' folder/file Drive ke Trash');
  }
  var msg = email + ' dihapus. ' + (parts.length ? parts.join(', ') + '.' : 'Sesi login dicabut.');
  var retained = (res.financeRetained || []).length;
  if (retained) {
    msg += ' Data keuangan ' + retained + ' project ditahan untuk pembukuan karena sudah pernah menerima pembayaran.';
  }
  return msg;
}

function deleteClientAccount(email, confirmProjects) {
  if (!isDirectorUser()) {
    showToast('Akses Ditolak', 'Hanya Direktur yang dapat menghapus akun client.', 'warning');
    return;
  }
  if (!confirmProjects && !confirm('Hapus permanen akun client ' + email + '?\n\nAkses login dicabut dan barisnya dihapus dari sheet ClientUsers.')) return;
  showToast('Menghapus…', 'Sedang menghapus akun ' + email + '.');
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        showToast('Akun Client Dihapus', buildClientDeleteResultMessage(email, res));
        loadInternalUsers();
        if (res.projectCount) {
          // Snapshot lama masih memuat project yang baru dibatalkan. Cukup batalkan
          // snapshot-nya; view Operation akan menarik data segar saat dibuka.
          OPS_DATA_READY = false;
          OPS_DATA_SERVER_FRESH = false;
          clearOpsDataCache();
          clearClientPortalCache();
        }
        return;
      }
      // Server menahan eksekusi karena akun masih punya project. Cascade-nya permanen,
      // jadi Direktur harus mengetik ulang konfirmasinya.
      if (res && res.needsProjectConfirm) {
        var ids = (res.projectIds || []).join('\n');
        var warning = 'PERINGATAN: TIDAK BISA DIBATALKAN\n\n'
          + 'Akun ' + email + ' punya ' + res.projectCount + ' project:\n'
          + (ids ? ids + '\n\n' : '\n')
          + 'Semua project di atas akan dinyatakan batal dan datanya dibuang:\n'
          + '- Baris di Leads, ClientIntake, StatusHistory, riwayat produksi\n'
          + '- Semua approval pembayaran & approval divisi yang terkait\n'
          + '- Folder Google Drive project dipindahkan ke Trash\n'
          + '- Tanggal shooting-nya kembali tersedia untuk client lain\n\n'
          + 'Data keuangan hanya ditahan untuk project yang sudah pernah menerima pembayaran.\n\n'
          + 'Ketik HAPUS untuk melanjutkan.';
        var answer = prompt(warning, '');
        if (String(answer || '').trim().toUpperCase() !== 'HAPUS') {
          showToast('Dibatalkan', 'Tidak ada data yang dihapus.');
          return;
        }
        deleteClientAccount(email, true);
        return;
      }
      showToast('Gagal Hapus Akun', (res && res.error) || 'Akun client gagal dihapus.', 'warning');
    })
    .withFailureHandler(function(err) {
      showToast('Error', err.message, 'warning');
    })
    .deleteClientUser(getInternalPayKey(), email, { confirmProjects: confirmProjects === true });
}

function getInternalUserDisplayRole(user) {
  var email = String((user && user.email) || '').trim().toLowerCase();
  var role = String((user && user.role) || '').trim().toUpperCase();
  if (role === 'DIRECTOR' || email === 'fastudioindonesia@gmail.com') return 'Direktur';
  if (role === 'CLIENT') return 'Client';
  if (role === 'MARKETING') return 'Marketing';
  if (role === 'SOUND_MAN') return 'Sound Man';
  if (role === 'EDITOR' || role === 'FINAL_VIDEO') return 'Editor';
  if (role === 'OFFICER' || role === 'INTERNAL') return 'Officer';
  if (email.indexOf('alizidan') >= 0 || email.indexOf('rizky') >= 0) return 'Officer';
  return (user && user.role) || 'INTERNAL';
}

function isDirectorUser() {
  var role = String(_opsInternalRole || '').trim().toUpperCase();
  if (role === 'DIRECTOR') return true;
  return String(_opsInternalEmail || '').trim().toLowerCase() === 'fastudioindonesia@gmail.com';
}

function isDeptPicUser() {
  var role = String(_opsInternalRole || '').trim().toUpperCase();
  return role === 'MARKETING' || role === 'SOUND_MAN' || role === 'EDITOR' || role === 'FINAL_VIDEO';
}

function getDeptPicDepartmentIds() {
  if (!isDeptPicUser()) return null;
  var role = String(_opsInternalRole || '').trim().toUpperCase();
  if (role === 'MARKETING') return ['marketing'];
  if (role === 'SOUND_MAN') return ['sound-man'];
  if (role === 'EDITOR' || role === 'FINAL_VIDEO') return ['final-video'];
  return [];
}

function canEditProductionOpsDepartment(departmentId) {
  var allowed = getDeptPicDepartmentIds();
  if (!allowed) return true;
  return allowed.indexOf(String(departmentId || '').trim()) >= 0;
}

function isClientUser() {
  return String(_opsInternalRole || '').trim().toUpperCase() === 'CLIENT';
}

function isOfficerUser() {
  return !isDirectorUser() && !isDeptPicUser() && !isClientUser();
}

    var el = document.getElementById(id);

function syncUsersEditingHighlight() {
  var body = document.getElementById('users-body');
  if (!body) return;
  var editing = String(USERS_EDITING_EMAIL || '').trim().toLowerCase();
  body.querySelectorAll('.tu-row').forEach(function(row) {
    var emailEl = row.querySelector('.tu-email');

function editInternalUser(email) {
  var user = INTERNAL_USERS.find(function(item) {
    return String(item.email || '').trim().toLowerCase() === String(email || '').trim().toLowerCase();
  }) || {};
  USERS_EDITING_EMAIL = user.email || email || '';
  document.getElementById('user-email').value = user.email || email || '';
  document.getElementById('user-name').value = user.name || '';
  document.getElementById('user-active').value = user.isActive ? 'TRUE' : 'FALSE';
  document.getElementById('user-password').value = '';
  var roleEl = document.getElementById('user-role');
  var role = String(user.role || 'OFFICER').trim().toUpperCase();
  if (role === 'FINAL_VIDEO') role = 'EDITOR';
  if (role === 'INTERNAL') role = 'OFFICER';
  if (roleEl) {
    var hasOption = Array.prototype.some.call(roleEl.options, function(opt) { return opt.value === role; });
    roleEl.value = hasOption ? role : 'OFFICER';
  }
  var title = document.getElementById('user-form-title');
  if (title) title.textContent = 'Update User';
  updateUserFormPermissions();
  updateUserFormPreview();
  syncUsersEditingHighlight();
}

function resetUserForm() {
  USERS_EDITING_EMAIL = '';
  ['user-email','user-name','user-password'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.value = '';
  });
  var active = document.getElementById('user-active');
  if (active) active.value = 'TRUE';
  var roleEl = document.getElementById('user-role');
  if (roleEl) roleEl.value = 'OFFICER';
  var title = document.getElementById('user-form-title');
  if (title) title.textContent = 'Tambah User Baru';
  var subtitle = document.getElementById('user-form-subtitle');
  if (subtitle) subtitle.textContent = 'Isi form untuk menambahkan akun baru.';
  updateUserFormPermissions();
  updateUserFormPreview();
  syncUsersEditingHighlight();
}

function saveUserFromForm() {
  if (!isDirectorUser()) {
    var selectedUser = INTERNAL_USERS.find(function(user) {
      return String(user.email || '').trim().toLowerCase() === String(document.getElementById('user-email').value || '').trim().toLowerCase();
    });
    if (!selectedUser) {
      showToast('Akses Ditolak','Hanya Direktur yang dapat menambahkan user baru.', 'warning');
      return;
    }
  }
  var payload = {
    email: document.getElementById('user-email').value.trim().toLowerCase(),
    name: document.getElementById('user-name').value.trim(),
    password: document.getElementById('user-password').value,
    isActive: document.getElementById('user-active').value === 'TRUE',
    role: document.getElementById('user-role') ? document.getElementById('user-role').value : 'OFFICER'
  };
  if (!payload.email) { showToast('Email Kosong','Isi email user.', 'warning'); return; }
  if (!payload.name) { showToast('Nama Kosong','Isi nama user.', 'warning'); return; }
  if (payload.password) {
    var policy = validatePasswordPolicy(payload.password);
    if (!policy.ok) { showToast('Password Lemah', policy.error, 'warning'); return; }
  }
  var saveBtn = document.querySelector('#view-users .tu-save-btn');
  setButtonBusy(saveBtn, true, 'Menyimpan…');
  google.script.run
    .withSuccessHandler(function(res) {
      setButtonBusy(saveBtn, false);
      if (res.success) {
        showToast('User Tersimpan', payload.email + ' berhasil disimpan.');
        resetUserForm();
        loadInternalUsers();
      } else {
        showToast('Gagal Simpan User', res.error || 'User tidak bisa disimpan.', 'warning');
      }
    })
    .withFailureHandler(function(err) {
      setButtonBusy(saveBtn, false);
      showToast('Error User', err.message, 'warning');
    })
    .saveInternalUser(getInternalPayKey(), payload);
}

function toggleInternalUser(email, nextActive) {

        loadInternalUsers();
      } else {
        showToast('Gagal Update User', res.error || 'Status user tidak bisa diubah.', 'warning');
      }
    })
    .withFailureHandler(function(err) { showToast('Error User', err.message, 'warning'); })
    .setInternalUserActive(getInternalPayKey(), email, nextActive);
}

function unlockInternalPay() {
  var input = document.getElementById('internal-key-input');
  var passwordInput = document.getElementById('internal-password-input');
  var email = input ? input.value.trim().toLowerCase() : "";
  var password = passwordInput ? passwordInput.value : "";
  if (!email) { showToast('Email Kosong','Masukkan email internal terlebih dahulu.','warning'); return; }
  if (!password) { showToast('Password Kosong','Masukkan password internal terlebih dahulu.','warning'); return; }
  var unlockBtn = document.getElementById('internal-pay-unlock-btn')
    || document.querySelector('#invoice-access-gate .btn-p');
  setButtonBusy(unlockBtn, true, 'Memverifikasi…');
  google.script.run
    .withSuccessHandler(function(res) {
      setButtonBusy(unlockBtn, false);
      if (res.success) {
        storeOpsLoginResult(res, email, password);
        _internalPayUnlocked = true;
        renderAdminProfile();
        initInvoicesView();
        showToast('Akses Diberikan','Selamat datang, Tim Internal.');
      } else {
        showToast('Akses Ditolak', res.error, 'warning');
      }
    })
    .withFailureHandler(function(err) {
      setButtonBusy(unlockBtn, false);
      showToast('Error', err.message, 'warning');
    })
    .validateInternalLogin(email, password, getLoginRecaptchaToken());
}

function normalizeLeadRow(l) {
  l = l || {};
  var projectTotal = Number(l.projectTotal || l.projecttotal || l.ProjectTotal || 0);
  return {
    id: normalizeProjectIdClient(String(l.id || l.ID || l.projectId || l.ProjectID || '').trim()),
    client: l.client || l.Client || l.brandName || l.BrandName || '',
    category: l.category || l.Category || l.projectType || l.ProjectType || '',
    status: l.status || l.Status || 'New Lead',
    driveUrl: l.driveUrl || l.driveurl || l.DriveUrl || '',
    timestamp: l.timestamp || l.Timestamp || '',
    pic: l.pic || l.PIC || l.Pic || '-',
    notes: l.notes || l.Notes || '',
    email: l.email || l.Email || '',
    projectTotal: projectTotal || '',
    totalMurid: l.totalMurid || l.totalmurid || l.TotalMurid || '',
    shootingDays: Number(l.shootingDays || l.shootingdays || 0) || 0,
    shootingStartDate: l.shootingStartDate || l.shootingstartdate || '',
    shootingEndDate: l.shootingEndDate || l.shootingenddate || '',
    shootingDateLabel: String(l.shootingDateLabel || l.shootingdatelabel || '').trim(),
    shootingReleasedAt: l.shootingReleasedAt || l.shootingreleasedat || '',
    productionStage: normalizeProductionStageClient(l.productionStage || l.productionstage || l.ProductionStage || 'On Discuss'),
    postProductionProgress: '',
    productionUpdatedAt: l.productionUpdatedAt || l.productionupdatedat || l.ProductionUpdatedAt || '',
    productionUpdatedBy: l.productionUpdatedBy || l.productionupdatedby || l.ProductionUpdatedBy || '',
    productionNotes: l.productionNotes || l.productionnotes || l.ProductionNotes || '',
    productionOpsData: l.productionOpsData || l.productionopsdata || l.ProductionOpsData || '',
    productionOpsUpdatedAt: l.productionOpsUpdatedAt || l.productionopsupdatedat || l.ProductionOpsUpdatedAt || '',
    productionOpsUpdatedBy: l.productionOpsUpdatedBy || l.productionopsupdatedby || l.ProductionOpsUpdatedBy || ''
  };
}

function normalizeLeadList(list) {
  return (list || []).map(normalizeLeadRow).filter(function(l) { return !!l.id; });
}

function lookupPaymentInMap(paymentMap, projectId) {
  paymentMap = paymentMap || {};
  var id = String(projectId || '').trim();
  if (!id) return {};
  var bare = id.replace(/^#/, '');
  return paymentMap[id] || paymentMap['#' + bare] || paymentMap[bare] || {};
}

function buildPaymentClientsFromLeads(leads, paymentMap) {
  paymentMap = paymentMap || {};
  return leads.map(function(raw) {
    var l = normalizeLeadRow(raw);
    if (!l.id) return null;
    var payment = lookupPaymentInMap(paymentMap, l.id);
    var status = normalizePaymentStatus(payment.paymentStatus);
    var approval = getLatestApprovalForProject(l.id);
    var approvalStatus = '';
    var approvalNotes = '';
    var approvalId = '';
    if (approval && approval.status === 'PENDING') {
      status = 'PENDING_REVIEW';
      approvalStatus = 'PENDING';
      approvalId = approval.approvalId;
    } else if (approval && approval.status === 'REJECTED' && status === 'UNPAID') {
      status = 'REJECTED';
      approvalStatus = 'REJECTED';
      approvalNotes = approval.reviewNotes || '';
      approvalId = approval.approvalId;
    } else if (approval && approval.status === 'REJECTED') {
      approvalStatus = 'REJECTED';
      approvalNotes = approval.reviewNotes || '';
      approvalId = approval.approvalId;
    }
    return {
      projectId: l.id,
      clientName: l.client,
      category: l.category,
      clientEmail: l.email,
      pic: l.pic,
      paymentStatus: status,
      paymentId: payment.paymentId || '',
      amount: payment.totalPaid || payment.amount || '',
      totalPaid: payment.totalPaid || payment.amount || '',
      lastAmount: payment.lastAmount || '',
      projectTotal: payment.projectTotal || l.projectTotal || '',
      remainingAmount: payment.remainingAmount !== undefined && payment.remainingAmount !== ''
        ? payment.remainingAmount
        : ((payment.projectTotal || l.projectTotal)
            ? Math.max(toMoneyNumber(payment.projectTotal || l.projectTotal) - toMoneyNumber(payment.totalPaid || payment.amount), 0)
            : ''),
      invoiceCount: payment.invoiceCount || 0,
      paymentMethod: payment.paymentMethod || '',
      paymentDate: payment.paymentDate || '',
      invoiceNumber: payment.invoiceNumber || '',
      invoiceUrl: payment.invoiceUrl || '',
      invoiceSentAt: payment.invoiceSentAt || '',
      approvalStatus: approvalStatus,
      approvalNotes: approvalNotes,
      approvalId: approvalId,
      pendingAmount: approval && approval.status === 'PENDING' ? approval.amount : ''
    };
  }).filter(function(c) { return c !== null; });
}

function normalizePaymentStatus(status) {
  status = String(status || '').trim().toUpperCase();
  if (status === 'PAYMENT AWAL') return 'PAYMENT AWAL';
  if (status === 'PAYMENT SETELAH SHOOTING') return 'PAYMENT SETELAH SHOOTING';
  if (status === 'LUNAS') return 'LUNAS';
  if (status === 'PENDING_REVIEW' || status === 'PENDING') return 'PENDING_REVIEW';
  if (status === 'REJECTED') return 'REJECTED';
  if (status === 'INVOICED') return 'PAYMENT AWAL';
  return 'UNPAID';
}

function sameProjectIdClient(a, b) {
  return String(a || '').replace(/^#/, '').trim().toLowerCase() === String(b || '').replace(/^#/, '').trim().toLowerCase();
}

function getLatestApprovalForProject(projectId) {
  var pending = PENDING_APPROVALS.filter(function(a) { return sameProjectIdClient(a.projectId, projectId); });
  if (pending.length) return pending[0];
  var rejected = REJECTED_APPROVALS.filter(function(a) { return sameProjectIdClient(a.projectId, projectId); });
  if (rejected.length) {
    rejected.sort(function(a, b) { return String(b.submittedAt || '').localeCompare(String(a.submittedAt || '')); });
    return rejected[0];
  }
  return null;
}

function applyApprovalsFromServer(res) {
  PENDING_APPROVALS = (res && res.pendingApprovals) || [];
  REJECTED_APPROVALS = (res && res.rejectedApprovals) || [];
  OPS_NOTIFICATIONS = (res && res.notifications) || [];
  // Jika sync belum punya notifications (versi lama), bangun lokal dari pending/rejected
  if (!OPS_NOTIFICATIONS.length) OPS_NOTIFICATIONS = buildLocalOpsNotifications();
  renderApprovalBell();
}

function rebuildPaymentClientsWithApprovals() {
  var scroller = document.querySelector('.ops-content');
  var prevScroll = scroller ? scroller.scrollTop : 0;
  PAYMENT_CLIENTS = buildPaymentClientsFromLeads(LEADS, LAST_PAYMENT_MAP || {});
  if (document.getElementById('view-doc-gen') && document.getElementById('view-doc-gen').classList.contains('active')) {
    renderPaymentHistory();
  }
  if (scroller) scroller.scrollTop = prevScroll;
}

function applyPendingSubmitLocally(res, projectId, amount, projectTotal, paymentMethod, requestedPaymentStatus) {
  var now = new Date().toLocaleString('id-ID');
  var approval = {
    approvalId: res.approvalId,
    projectId: projectId,
    clientName: (PAYMENT_CLIENTS.find(function(c){ return sameProjectIdClient(c.projectId, projectId); }) || {}).clientName || '',
    amount: amount,
    projectTotal: projectTotal || res.projectTotal || '',
    paymentMethod: paymentMethod || '',
    requestedPaymentStatus: requestedPaymentStatus || res.requestedPaymentStatus || '',
    status: 'PENDING',
    submittedBy: _opsInternalEmail,
    submittedAt: now,
    proofUrl: res.proofUrl || ''
  };
  PENDING_APPROVALS = (PENDING_APPROVALS || []).filter(function(a) {
    return !sameProjectIdClient(a.projectId, projectId);
  });
  PENDING_APPROVALS.unshift(approval);
  REJECTED_APPROVALS = (REJECTED_APPROVALS || []).filter(function(a) {
    return !sameProjectIdClient(a.projectId, projectId);
  });
  OPS_NOTIFICATIONS = buildLocalOpsNotifications();

  var idx = PAYMENT_CLIENTS.findIndex(function(c){ return c.projectId === projectId; });
  if (idx >= 0) {
    PAYMENT_CLIENTS[idx].paymentStatus = 'PENDING_REVIEW';
    PAYMENT_CLIENTS[idx].approvalStatus = 'PENDING';
    PAYMENT_CLIENTS[idx].approvalId = res.approvalId;
    PAYMENT_CLIENTS[idx].pendingAmount = amount;
    PAYMENT_CLIENTS[idx].approvalNotes = '';
    if (projectTotal) PAYMENT_CLIENTS[idx].projectTotal = projectTotal;
  }
  renderPaymentHistory();
  renderApprovalBell();
  persistCurrentOpsDataCache();
}

function applyPaymentHistory(paymentMap, serverClients) {
  if (LEADS && LEADS.length > 0) {
    PAYMENT_CLIENTS = buildPaymentClientsFromLeads(LEADS, paymentMap);
  } else if (serverClients && serverClients.length > 0) {
    PAYMENT_CLIENTS = serverClients;
  } else {
    PAYMENT_CLIENTS = [];
  }
  renderPaymentHistory();
  updateInvoiceSelect();
  var now = new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  var syncEl = document.getElementById('pay-sync-info');
  if (syncEl) syncEl.textContent = 'Sinkron '+now;
}

function formatBiMoney(value) {
  var num = Number(value || 0);
  if (!num && value !== 0 && value !== '0') return '—';
  return 'Rp ' + num.toLocaleString('id-ID');
}

function buildBillingFinanceBanner() {
  var totalPipeline = 0;
  var totalCollected = 0;
  var activeCount = PAYMENT_CLIENTS.length;
  PAYMENT_CLIENTS.forEach(function(c) {
    totalPipeline += Number(c.projectTotal || 0) || 0;
    totalCollected += Number(c.totalPaid || c.amount || 0) || 0;
  });
  var totalOutstanding = Math.max(totalPipeline - totalCollected, 0);
  var collectPct = totalPipeline > 0 ? Math.round((totalCollected / totalPipeline) * 100) : 0;
  var size = 96;
  var stroke = 14;
  var r = 37;
  var cx = size / 2;
  var cy = size / 2;
  var circ = 2 * Math.PI * r;
  var len = (collectPct / 100) * circ;
  var gap = circ - len;
  var motion = (typeof opsMotionEnabled === 'function') ? opsMotionEnabled() : true;
  var dashInit = motion ? ('0 ' + circ.toFixed(2)) : (len.toFixed(2) + ' ' + gap.toFixed(2));

  return ''
    + '<div class="bi-finance-left">'
      + '<div class="bi-mini-donut">'
        + '<svg class="bi-mini-donut-svg" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">'
          + '<circle class="bi-mini-donut-track" cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke-width="' + stroke + '"/>'
          + '<circle class="bi-mini-donut-seg" cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#4ade80" stroke-width="' + stroke + '" stroke-linecap="butt" data-len="' + len.toFixed(2) + '" data-gap="' + gap.toFixed(2) + '" stroke-dasharray="' + dashInit + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>'
        + '</svg>'
        + '<div class="bi-mini-donut-center"><strong>' + collectPct + '%</strong><span>lunas</span></div>'
      + '</div>'
      + '<div class="bi-finance-copy">'
        + '<div class="bi-finance-label">Total Pipeline</div>'
        + '<div class="bi-finance-value">' + formatBiMoney(totalPipeline) + '</div>'
        + '<div class="bi-finance-sub">' + activeCount + ' client aktif</div>'
      + '</div>'
    + '</div>'
    + '<div class="bi-finance-divider" aria-hidden="true"></div>'
    + '<div class="bi-finance-mid">'
      + '<div class="bi-finance-metric">'
        + '<div class="bi-finance-ico is-ok"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></div>'
        + '<div><div class="bi-finance-label">Terkumpul</div><div class="bi-finance-metric-val is-ok">' + formatBiMoney(totalCollected) + '</div></div>'
      + '</div>'
      + '<div class="bi-finance-mid-divider" aria-hidden="true"></div>'
      + '<div class="bi-finance-metric">'
        + '<div class="bi-finance-ico is-warn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg></div>'
        + '<div><div class="bi-finance-label">Outstanding</div><div class="bi-finance-metric-val is-warn">' + formatBiMoney(totalOutstanding) + '</div></div>'
      + '</div>'
    + '</div>'
    + '<div class="bi-finance-divider" aria-hidden="true"></div>'
    + '<div class="bi-finance-right">'
      + '<button type="button" class="bi-export-btn" onclick="exportCashflowCsv()">'
        + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>'
        + 'Export PDF'
      + '</button>'
    + '</div>';
}

function animateBillingFinanceDonut(root) {
  if (!root) return;
  var motion = (typeof opsMotionEnabled === 'function') ? opsMotionEnabled() : true;
  root.querySelectorAll('.bi-mini-donut-seg').forEach(function(c) {
    var len = parseFloat(c.getAttribute('data-len') || '0');
    var gap = parseFloat(c.getAttribute('data-gap') || '0');
    if (!motion) {
      c.style.strokeDasharray = len + ' ' + gap;
      return;
    }
    c.style.strokeDasharray = '0 ' + (len + gap);
    requestAnimationFrame(function() {
      c.style.transition = 'stroke-dasharray .9s cubic-bezier(.22,1,.36,1) .12s';
      c.style.strokeDasharray = len + ' ' + gap;
    });
  });
}

function renderBillingFinanceBanner() {
  var el = document.getElementById('bi-finance-banner');
  if (!el) return;
  el.innerHTML = buildBillingFinanceBanner();
  requestAnimationFrame(function() { animateBillingFinanceDonut(el); });
}

function renderPayStatsBar() {
  var bar = document.getElementById('pay-stats-bar');
  if (!bar) return;
  var counts = {};
  PAY_STATUSES.forEach(function(s) { counts[s] = 0; });
  PAYMENT_CLIENTS.forEach(function(c) {
    var status = normalizePaymentStatus(c.paymentStatus);
    if (counts[status] !== undefined) counts[status]++;
  });
  var filterEl = document.getElementById('pay-filter-status');
  var filter = filterEl ? filterEl.value : 'All';
  var total = PAYMENT_CLIENTS.length;
  var allActive = filter === 'All';

  var html = '<button type="button" class="bi-filter-tab bi-filter-all'+(allActive?' is-active':'')+'" onclick="togglePayFilterStatus(\'All\')">'
    +'<span class="bi-filter-all-badge">'+total+'</span>'
    +'<span class="bi-filter-all-copy">'
      +'<span class="bi-filter-all-label">Semua</span>'
      +'<span class="bi-filter-all-sub">Tampilkan semua</span>'
    +'</span>'
  +'</button>';

  PAY_STATUSES.forEach(function(s) {
    var cfg = getPayStatusCfg(s);
    var isActive = filter === s;
    html += '<button type="button" class="bi-filter-tab'+(isActive?' is-active':'')+'"'

  if (chipLabel) {
    chipLabel.textContent = allActive ? 'Semua' : (getPayStatusCfg(filter).label || filter);

  }).join('');

function changePaymentStage(projectId, selectEl) {
  if (!isDirectorUser()) {
    showToast('Akses ditolak', 'Hanya Direktur yang dapat mengubah status pembayaran langsung.', 'warning');
    renderPaymentHistory();
    return;
  }
  var newStatus = selectEl.value;
  var client = PAYMENT_CLIENTS.find(function(c){ return c.projectId === projectId; });
  var oldStatus = client ? normalizePaymentStatus(client.paymentStatus) : 'PAYMENT AWAL';
  selectEl.disabled = true;
  google.script.run
    .withSuccessHandler(function(res) {
      selectEl.disabled = false;
      if (res.success) {
        patchLastPaymentMapEntry(projectId, { paymentStatus: res.paymentStatus || newStatus });
        PAYMENT_CLIENTS = buildPaymentClientsFromLeads(LEADS, LAST_PAYMENT_MAP);
        delete PROJECT_TIMELINES[projectId];
        if (projectDetailId === projectId) {
          renderProjectDetail(projectId, true);
          if (isActivityLogGateOpen(projectId)) loadProjectTimeline(projectId, true);
        }
        renderOperationDataViews();
        persistCurrentOpsDataCache();
        showToast('Status Diperbarui', projectId+' menjadi '+(getPayStatusCfg(newStatus).label || newStatus)+'.');
      } else {
        selectEl.value = oldStatus;
        showToast('Gagal Update', res.error || 'Status gagal diperbarui.', 'warning');
      }
    })
    .withFailureHandler(function(err) {
      selectEl.disabled = false;
      selectEl.value = oldStatus;
      showToast('Error', err.message, 'warning');
    })
    .updatePaymentStageInternal(getInternalPayKey(), projectId, newStatus);
}

function getSelectedInvoiceClient() {
  var projectId = document.getElementById('inv-project').value;
  return PAYMENT_CLIENTS.find(function(c){
    return sameProjectIdClient(c.projectId, projectId);
  }) || null;
}

function formatPaymentStatusLabel(status) {
  var cfg = getPayStatusCfg(normalizePaymentStatus(status));
  return (cfg && cfg.label) || status || '—';
}

function suggestInvoicePaymentStatus(client, remainingAfter) {
  var current = normalizePaymentStatus(client && client.paymentStatus);
  if (remainingAfter === 0) return 'LUNAS';
  if (current === 'PAYMENT SETELAH SHOOTING') return 'PAYMENT SETELAH SHOOTING';
  if (current === 'PAYMENT AWAL') return 'PAYMENT AWAL';
  if (current === 'LUNAS') return 'LUNAS';
  return 'PAYMENT AWAL';
}

function parseRupiahInput(value) {
  return Number(String(value || '').replace(/[^\d]/g, '')) || 0;
}

/** Angka uang dari number / string bertitik (id-ID) / raw digits. */
function toMoneyNumber(value) {
  if (typeof value === 'number' && isFinite(value)) return Math.max(0, value);
  if (value == null || value === '') return 0;
  return parseRupiahInput(value);
}

function getInvoiceFormPaidTotal(client) {
  client = client || {};
  return toMoneyNumber(client.totalPaid != null && client.totalPaid !== ''
    ? client.totalPaid
    : client.amount);
}

function formatRupiahValue(value) {
  var digits = String(value || '').replace(/[^\d]/g, '');
  return digits ? Number(digits).toLocaleString('id-ID') : '';
}

function formatRupiahField(input) {
  if (!input) return;
  input.value = formatRupiahValue(input.value);
  if (input.id === 'inv-amount' || input.id === 'inv-project-total') {
    updateInvoiceBudgetPreview(input);
  }
}

function syncInvoicePaymentStatusSelect(opts) {
  opts = opts || {};
  var select = document.getElementById('inv-payment-status');
  var hint = document.getElementById('inv-payment-status-hint');
  if (!select) return;

  var client = getSelectedInvoiceClient();
  var totalProject = toMoneyNumber((document.getElementById('inv-project-total') || {}).value);
  var currentAmount = toMoneyNumber((document.getElementById('inv-amount') || {}).value);
  var prevTotal = getInvoiceFormPaidTotal(client);
  var newTotal = prevTotal + currentAmount;
  var remainingAfter = totalProject ? Math.max(totalProject - newTotal, 0) : null;
  var suggested = suggestInvoicePaymentStatus(client, remainingAfter);
  var currentVal = normalizePaymentStatus(select.value);

  // Auto-set saat ganti project / sisa jadi 0; jangan override pilihan manual officer kecuali LUNAS wajib
  if (opts.forceSuggest || remainingAfter === 0 || !currentVal || currentVal === 'UNPAID') {
    select.value = suggested;
    currentVal = suggested;
  } else if (remainingAfter !== 0 && currentVal === 'LUNAS') {
    select.value = suggested === 'LUNAS' ? 'PAYMENT AWAL' : suggested;
    currentVal = select.value;
  }

  Array.prototype.forEach.call(select.options, function(opt) {
    if (opt.value === 'LUNAS') {
      opt.disabled = !!(totalProject && remainingAfter !== 0);
    } else {
      opt.disabled = !!(totalProject && remainingAfter === 0);
    }
  });

  if (hint) {
    if (remainingAfter === 0 && totalProject) {
      hint.textContent = 'Sisa pembayaran 0 — status otomatis Lunas setelah approve.';
    } else if (client) {
      hint.textContent = 'Status saat ini: ' + formatPaymentStatusLabel(client.paymentStatus)
        + '. Pilih tahap journey sesuai pembayaran yang diinput Officer.';
    } else {
      hint.textContent = 'Pilih tahap journey sesuai pembayaran yang sedang diinput. Otomatis menyesuaikan saat sisa = 0.';
    }
  }
}

/** Wave 4: bukti dikompres + diunggah ke Drive sebelum submit (submit hanya kirim fileId). */
var PAYMENT_PROOF_UPLOAD = {
  token: 0,
  status: 'idle',
  projectId: '',
  localName: '',
  payload: null,
  remote: null,
  error: ''
};

function resetPaymentProofUploadState() {
  PAYMENT_PROOF_UPLOAD.token += 1;
  PAYMENT_PROOF_UPLOAD.status = 'idle';
  PAYMENT_PROOF_UPLOAD.projectId = '';
  PAYMENT_PROOF_UPLOAD.localName = '';
  PAYMENT_PROOF_UPLOAD.payload = null;
  PAYMENT_PROOF_UPLOAD.remote = null;
  PAYMENT_PROOF_UPLOAD.error = '';
  var input = document.getElementById('inv-proof-file');
  if (input) input.value = '';
  setPaymentProofStatus('');
}

function setPaymentProofStatus(message, tone) {
  var el = document.getElementById('inv-proof-status');
  if (!el) return;
  el.textContent = message || '';
  el.style.color = tone === 'error' ? '#c2410c' : (tone === 'ok' ? '#15803d' : '');
}

function formatProofBytes(bytes) {
  var n = Number(bytes) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function onPaymentProofFileChange() {
  var input = document.getElementById('inv-proof-file');
  var file = input && input.files && input.files[0] ? input.files[0] : null;
  PAYMENT_PROOF_UPLOAD.token += 1;
  var token = PAYMENT_PROOF_UPLOAD.token;
  PAYMENT_PROOF_UPLOAD.payload = null;
  PAYMENT_PROOF_UPLOAD.remote = null;
  PAYMENT_PROOF_UPLOAD.error = '';
  PAYMENT_PROOF_UPLOAD.localName = file ? file.name : '';
  if (!file) {
    PAYMENT_PROOF_UPLOAD.status = 'idle';
    setPaymentProofStatus('');
    return;
  }
  var check = inspectProofFileClient(file);
  if (!check.ok) {
    PAYMENT_PROOF_UPLOAD.status = 'error';
    PAYMENT_PROOF_UPLOAD.error = check.error;
    setPaymentProofStatus(check.error, 'error');
    return;
  }
  var projectEl = document.getElementById('inv-project');
  var projectId = projectEl ? projectEl.value : '';
  PAYMENT_PROOF_UPLOAD.projectId = projectId || '';
  PAYMENT_PROOF_UPLOAD.status = 'compressing';
  setPaymentProofStatus('Menyiapkan bukti…');
  prepareProofPayload(file, function(payload) {
    if (token !== PAYMENT_PROOF_UPLOAD.token) return;
    PAYMENT_PROOF_UPLOAD.payload = payload;
    if (!projectId) {
      PAYMENT_PROOF_UPLOAD.status = 'prepared';
      setPaymentProofStatus('Bukti siap (' + formatProofBytes(payload.bytes) + '). Pilih project untuk mulai upload.');
      return;
    }
    startPaymentProofUpload(token, projectId, payload);
  }, function(errMsg) {
    if (token !== PAYMENT_PROOF_UPLOAD.token) return;
    PAYMENT_PROOF_UPLOAD.status = 'error';
    PAYMENT_PROOF_UPLOAD.error = errMsg;
    setPaymentProofStatus(errMsg, 'error');
  });
}

function ensurePaymentProofUploadForProject(projectId) {
  if (!projectId) return;
  if (!PAYMENT_PROOF_UPLOAD.payload) return;
  if (PAYMENT_PROOF_UPLOAD.remote && PAYMENT_PROOF_UPLOAD.projectId === projectId && PAYMENT_PROOF_UPLOAD.status === 'ready') return;
  if (PAYMENT_PROOF_UPLOAD.status === 'uploading' && PAYMENT_PROOF_UPLOAD.projectId === projectId) return;
  PAYMENT_PROOF_UPLOAD.token += 1;
  var token = PAYMENT_PROOF_UPLOAD.token;
  PAYMENT_PROOF_UPLOAD.projectId = projectId;
  startPaymentProofUpload(token, projectId, PAYMENT_PROOF_UPLOAD.payload);
}

function startPaymentProofUpload(token, projectId, payload) {
  PAYMENT_PROOF_UPLOAD.status = 'uploading';
  PAYMENT_PROOF_UPLOAD.remote = null;
  setPaymentProofStatus('Mengunggah bukti ke Drive… (' + formatProofBytes(payload.bytes) + ')');
  google.script.run
    .withSuccessHandler(function(res) {
      if (token !== PAYMENT_PROOF_UPLOAD.token) return;
      if (res && res.success && res.proofFileId) {
        PAYMENT_PROOF_UPLOAD.status = 'ready';
        PAYMENT_PROOF_UPLOAD.remote = {
          proofFileId: res.proofFileId,
          proofUrl: res.proofUrl || '',
          proofFileName: res.proofFileName || payload.name || 'bukti-transfer'
        };
        var note = payload.compressed ? ' · dikompres' : '';
        setPaymentProofStatus('Bukti siap diunggah' + note + ' · ' + formatProofBytes(res.bytes || payload.bytes), 'ok');
        return;
      }
      PAYMENT_PROOF_UPLOAD.status = 'prepared';
      PAYMENT_PROOF_UPLOAD.error = (res && res.error) || 'Upload gagal';
      setPaymentProofStatus('Upload tertunda — akan dikirim saat submit. ' + PAYMENT_PROOF_UPLOAD.error, 'error');
    })
    .withFailureHandler(function(err) {
      if (token !== PAYMENT_PROOF_UPLOAD.token) return;
      PAYMENT_PROOF_UPLOAD.status = 'prepared';
      PAYMENT_PROOF_UPLOAD.error = err.message || 'Upload gagal';
      setPaymentProofStatus('Upload tertunda — akan dikirim saat submit. ' + PAYMENT_PROOF_UPLOAD.error, 'error');
    })
    .uploadPaymentProof(getInternalPayKey(), {
      name: payload.name,
      mimeType: payload.mimeType,
      data: payload.data
    }, { projectId: projectId });
}

function waitForPaymentProofReady(timeoutMs, onReady, onError) {
  var started = Date.now();
  function tick() {
    if (PAYMENT_PROOF_UPLOAD.status === 'ready' && PAYMENT_PROOF_UPLOAD.remote) {
      onReady(PAYMENT_PROOF_UPLOAD.remote);
      return;
    }
    if (PAYMENT_PROOF_UPLOAD.status === 'error' && !PAYMENT_PROOF_UPLOAD.payload) {
      onError(PAYMENT_PROOF_UPLOAD.error || 'Bukti transfer tidak valid.');
      return;
    }
    if (PAYMENT_PROOF_UPLOAD.status === 'prepared' && PAYMENT_PROOF_UPLOAD.payload) {
      // Eager upload gagal/tertunda → submit pakai base64 terkompres.
      onReady(null);
      return;
    }
    if (Date.now() - started > timeoutMs) {
      if (PAYMENT_PROOF_UPLOAD.payload) onReady(null);
      else onError('Persiapan bukti transfer terlalu lama. Coba lagi.');
      return;
    }
    setTimeout(tick, 200);
  }
  tick();
}

function generateInvoiceForClient() {
  var projectId = document.getElementById('inv-project').value;
  var amount = parseRupiahInput(document.getElementById('inv-amount').value);
  var projectTotal = parseRupiahInput(document.getElementById('inv-project-total').value);
  var now = new Date(); var validatedDate = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  var paymentDate = document.getElementById('inv-payment-date').value;
  var paymentMethod = document.getElementById('inv-method').value;
  var paymentStatusEl = document.getElementById('inv-payment-status');
  var requestedPaymentStatus = normalizePaymentStatus(paymentStatusEl ? paymentStatusEl.value : 'PAYMENT AWAL');
  var proofInput = document.getElementById('inv-proof-file');
  var proofFile = proofInput && proofInput.files && proofInput.files[0] ? proofInput.files[0] : null;
  var notes = document.getElementById('inv-notes').value.trim();

  if (!projectId) { showToast('Pilih Client','Pilih project terlebih dahulu.','warning'); return; }
  if (!amount || amount <= 0) { showToast('Field Kosong','Jumlah pembayaran harus diisi.','warning'); return; }
  if (!proofFile && !PAYMENT_PROOF_UPLOAD.payload && !PAYMENT_PROOF_UPLOAD.remote) {
    showToast('Lampiran Wajib','Upload bukti transfer terlebih dahulu.','warning');
    return;
  }
  if (proofFile) {
    var proofCheck = inspectProofFileClient(proofFile);
    if (!proofCheck.ok) { showToast('File Tidak Valid', proofCheck.error, 'warning'); return; }
  }
  if (['PAYMENT AWAL','PAYMENT SETELAH SHOOTING','LUNAS'].indexOf(requestedPaymentStatus) < 0) {
    showToast('Status Invalid','Pilih status payment journey yang valid.','warning');
    return;
  }

  var client = PAYMENT_CLIENTS.find(function(c){ return sameProjectIdClient(c.projectId, projectId); });
  var prevTotal = getInvoiceFormPaidTotal(client);
  var newTotal = prevTotal + amount;
  var remainingAmount = projectTotal ? Math.max(projectTotal - newTotal, 0) : '';
  if (projectTotal && newTotal > projectTotal) {
    showToast('Nominal Berlebih','Pembayaran melebihi total harga project. Sisa saat ini Rp '+Math.max(projectTotal - prevTotal, 0).toLocaleString('id-ID')+'.','warning');
    return;
  }
  if (requestedPaymentStatus === 'LUNAS' && projectTotal && remainingAmount > 0) {
    showToast('Belum Lunas','Status Lunas hanya untuk pembayaran yang menutup sisa (sisa = 0).','warning');
    syncInvoicePaymentStatusSelect({ forceSuggest: true });
    return;
  }
  if (projectTotal && remainingAmount === 0) requestedPaymentStatus = 'LUNAS';

  var hasExistingInvoice = client && (client.invoiceUrl || client.paymentId || client.invoiceCount);
  var statusLabel = formatPaymentStatusLabel(requestedPaymentStatus);
  var confirmMsg = isDirectorUser()
    ? (hasExistingInvoice
        ? 'Approve & generate invoice ke-'+(Number(client.invoiceCount||1)+1)+' sebesar Rp '+amount.toLocaleString('id-ID')+' → '+statusLabel+'?'
        : 'Approve & generate invoice Rp '+amount.toLocaleString('id-ID')+' untuk '+projectId+' → '+statusLabel+'?')
    : (hasExistingInvoice
        ? 'Ajukan invoice ke-'+(Number(client.invoiceCount||1)+1)+' sebesar Rp '+amount.toLocaleString('id-ID')+' ('+statusLabel+') ke Direktur?'
        : 'Ajukan pembayaran Rp '+amount.toLocaleString('id-ID')+' ('+statusLabel+') ke Direktur untuk review?');
  if (!confirm(confirmMsg)) return;

  setPayModalSubmitLoading(true);

  function runSubmit(proofFields) {
    google.script.run
      .withSuccessHandler(function(res) {
        setPayModalSubmitLoading(false);
        if (res.success) {
          if (res.pending) {
            showToast('Menunggu Approval', 'Pengajuan '+res.approvalId+' terkirim ('+statusLabel+'). Direktur perlu approve sebelum invoice dikirim ke klien.');
            document.getElementById('inv-amount').value = '';
            document.getElementById('inv-payment-date').value = '';
            document.getElementById('inv-notes').value = '';
            resetPaymentProofUploadState();
            applyPendingSubmitLocally(res, projectId, amount, projectTotal, paymentMethod, requestedPaymentStatus);
            kickPaymentSideEffects();
            var formCard = document.querySelector('#view-doc-gen .ops-card:last-of-type') || document.getElementById('invoice-dashboard');
            if (formCard && formCard.scrollIntoView) {
              formCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            syncInvoicePaymentStatusSelect({ forceSuggest: true });
            updateInvoiceBudgetPreview();
            return;
          }
          showToast(
            res.dispatchPending ? 'Disetujui' : 'Invoice Terkirim',
            (res.invoiceNumber || '')+' · Rp '+Number(res.lastAmount).toLocaleString('id-ID')
              + (res.dispatchPending ? ' · PDF dikirim ke klien di latar belakang' : ' · Total Rp '+Number(res.totalPaid).toLocaleString('id-ID'))
          );
          document.getElementById('inv-amount').value = '';
          document.getElementById('inv-payment-date').value = '';
          document.getElementById('inv-notes').value = '';
          resetPaymentProofUploadState();
          applyValidatedPaymentLocally(res, {
            paymentStatus: requestedPaymentStatus,
            paymentMethod: paymentMethod,
            approvalId: res.approvalId
          });
          syncInvoicePaymentStatusSelect({ forceSuggest: true });
          updateInvoiceBudgetPreview();
          closePaymentModal();
          kickPaymentSideEffects();
        } else {
          showToast('Error', res.error, 'warning');
        }
      })
      .withFailureHandler(function(err) {
        setPayModalSubmitLoading(false);
        showToast('Error', err.message, 'warning');
      })
      .submitPaymentForReview(getInternalPayKey(), {
        projectId: projectId,
        amount: amount,
        projectTotal: projectTotal,
        validatedAt: validatedDate || new Date().toISOString().split('T')[0],
        paymentDate: paymentDate,
        paymentMethod: paymentMethod,
        paymentStatus: requestedPaymentStatus,
        proofFileId: proofFields.proofFileId || '',
        proofUrl: proofFields.proofUrl || '',
        proofFileName: proofFields.proofFileName || '',
        proofFile: proofFields.proofFile || null,
        notes: notes
      });
  }

  function afterProofReady(remote) {
    if (remote && remote.proofFileId) {
      runSubmit({
        proofFileId: remote.proofFileId,
        proofUrl: remote.proofUrl || '',
        proofFileName: remote.proofFileName || ''
      });
      return;
    }
    var payload = PAYMENT_PROOF_UPLOAD.payload;
    if (payload && payload.data) {
      runSubmit({ proofFile: { name: payload.name, mimeType: payload.mimeType, data: payload.data } });
      return;
    }
    if (!proofFile) {
      setPayModalSubmitLoading(false);
      showToast('Lampiran Wajib', 'Upload bukti transfer terlebih dahulu.', 'warning');
      return;
    }
    prepareProofPayload(proofFile, function(fresh) {
      PAYMENT_PROOF_UPLOAD.payload = fresh;
      runSubmit({ proofFile: { name: fresh.name, mimeType: fresh.mimeType, data: fresh.data } });
    }, function(errMsg) {
      setPayModalSubmitLoading(false);
      showToast('Upload Error', errMsg, 'warning');
    });
  }

  ensurePaymentProofUploadForProject(projectId);
  if (PAYMENT_PROOF_UPLOAD.status === 'ready' && PAYMENT_PROOF_UPLOAD.remote) {
    afterProofReady(PAYMENT_PROOF_UPLOAD.remote);
    return;
  }
  if (PAYMENT_PROOF_UPLOAD.status === 'compressing' || PAYMENT_PROOF_UPLOAD.status === 'uploading') {
    waitForPaymentProofReady(45000, afterProofReady, function(errMsg) {
      setPayModalSubmitLoading(false);
      showToast('Upload Error', errMsg, 'warning');
    });
    return;
  }
  if (PAYMENT_PROOF_UPLOAD.payload) {
    afterProofReady(null);
    return;
  }
  prepareProofPayload(proofFile, function(payload) {
    PAYMENT_PROOF_UPLOAD.payload = payload;
    afterProofReady(null);
  }, function(errMsg) {
    setPayModalSubmitLoading(false);
    showToast('Upload Error', errMsg, 'warning');
  });
}

function prepareProofPayload(file, onSuccess, onError) {
  var type = String(file.type || '').toLowerCase();
  var isImage = type.indexOf('image/') === 0 || /\.(png|jpe?g)$/i.test(file.name || '');
  var isPdf = type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
  if (isPdf || !isImage || file.size <= 350 * 1024) {
    readProofFile(file, function(payload) {
      onSuccess({
        name: payload.name,
        mimeType: payload.mimeType,
        data: payload.data,
        bytes: Math.ceil(String(payload.data || '').length * 3 / 4),
        compressed: false
      });
    }, onError);
    return;
  }
  compressProofImage(file, onSuccess, function(errMsg) {
    // Fallback: kirim original jika canvas gagal.
    readProofFile(file, function(payload) {
      onSuccess({
        name: payload.name,
        mimeType: payload.mimeType,
        data: payload.data,
        bytes: Math.ceil(String(payload.data || '').length * 3 / 4),
        compressed: false
      });
    }, function() { onError(errMsg); });
  });
}

function compressProofImage(file, onSuccess, onError) {
  var url = '';
  try { url = URL.createObjectURL(file); } catch (e) {
    onError('Bukti transfer gagal dibaca untuk kompresi.');
    return;
  }
  var img = new Image();
  img.onload = function() {
    try { URL.revokeObjectURL(url); } catch (eRev) {}
    try {
      var maxEdge = 1600;
      var w = img.naturalWidth || img.width || 1;
      var h = img.naturalHeight || img.height || 1;
      var scale = Math.min(1, maxEdge / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      var ctx = canvas.getContext('2d');
      if (!ctx) {
        onError('Browser tidak mendukung kompresi gambar.');
        return;
      }
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      var quality = 0.72;
      var dataUrl = canvas.toDataURL('image/jpeg', quality);
      var base64 = String(dataUrl).split(',')[1] || '';
      var bytes = Math.ceil(base64.length * 3 / 4);
      if (bytes > 1.6 * 1024 * 1024) {
        dataUrl = canvas.toDataURL('image/jpeg', 0.55);
        base64 = String(dataUrl).split(',')[1] || '';
        bytes = Math.ceil(base64.length * 3 / 4);
      }
      if (!base64) {
        onError('Kompresi bukti transfer gagal.');
        return;
      }
      // Jika hasil lebih besar dari original, pakai original.
      if (bytes >= file.size) {
        readProofFile(file, function(payload) {
          onSuccess({
            name: payload.name,
            mimeType: payload.mimeType,
            data: payload.data,
            bytes: Math.ceil(String(payload.data || '').length * 3 / 4),
            compressed: false
          });
        }, onError);
        return;
      }
      var outName = String(file.name || 'bukti-transfer').replace(/\.(png|jpe?g)$/i, '') + '.jpg';
      onSuccess({
        name: outName,
        mimeType: 'image/jpeg',
        data: base64,
        bytes: bytes,
        compressed: true
      });
    } catch (err) {
      onError(err.message || 'Kompresi bukti transfer gagal.');
    }
  };
  img.onerror = function() {
    try { URL.revokeObjectURL(url); } catch (eRev2) {}
    onError('Gambar bukti transfer tidak bisa dibuka.');
  };
  img.src = url;
}

function readProofFile(file, onSuccess, onError) {
  var reader = new FileReader();
  reader.onload = function(e) {
    onSuccess({
      name: file.name,
      mimeType: file.type || 'application/octet-stream',
      data: String(e.target.result).split(',')[1] || ''
    });
  };
  reader.onerror = function() {
    onError('Bukti transfer gagal dibaca. Coba pilih file lain.');
  };
  reader.readAsDataURL(file);
}

var _tt;
function showToast(title, msg, type) {
  clearTimeout(_tt);
  var toast = document.getElementById('toast');
  document.getElementById('t-title').textContent = title;
  document.getElementById('t-msg').textContent   = msg;
  document.getElementById('t-icon').textContent  = '';
  if (toast) {
    toast.classList.toggle('is-error', type === 'warning' || type === 'error');
    toast.classList.add('show');
  }
  _tt = setTimeout(hideToast, 4000);
}
function hideToast()  {
  var toast = document.getElementById('toast');
  if (toast) toast.classList.remove('show');
}
function showLoading(){
  var el = document.getElementById('loading');
  if (el) el.classList.add('show');
}
function hideLoading(){
  var el = document.getElementById('loading');
  if (el) el.classList.remove('show');
}

/** Ref-count overlay untuk fetch ops — supaya request yang di-supersede tidak meninggalkan spinner. */
var OPS_OVERLAY_DEPTH = 0;
var _opsOverlayWatch = null;
function beginOpsOverlay_() {
  OPS_OVERLAY_DEPTH = (OPS_OVERLAY_DEPTH || 0) + 1;
  if (OPS_OVERLAY_DEPTH === 1) showLoading();
  clearTimeout(_opsOverlayWatch);
  _opsOverlayWatch = setTimeout(function() {
    if (OPS_OVERLAY_DEPTH > 0) {
      OPS_OVERLAY_DEPTH = 0;
      hideLoading();
      try { setOperationDataLoading(false, 'all'); } catch (e) {}
    }
  }, 60000);
}
function endOpsOverlay_() {
  if (OPS_OVERLAY_DEPTH > 0) OPS_OVERLAY_DEPTH--;
  if (OPS_OVERLAY_DEPTH <= 0) {
    OPS_OVERLAY_DEPTH = 0;
    clearTimeout(_opsOverlayWatch);
    _opsOverlayWatch = null;
    hideLoading();
  }
}

/** Inline busy untuk aksi sekunder — jangan pakai overlay penuh. */
function setButtonBusy(btn, isBusy, label) {
  if (!btn) return;
  if (isBusy) {
    if (!btn.dataset.defaultHtml) btn.dataset.defaultHtml = btn.innerHTML;
    btn.disabled = true;
    btn.classList.add('is-loading');
    btn.setAttribute('aria-busy', 'true');
    if (label) btn.textContent = label;
    return;
  }
  btn.disabled = false;
  btn.classList.remove('is-loading');
  btn.removeAttribute('aria-busy');
  if (btn.dataset.defaultHtml) btn.innerHTML = btn.dataset.defaultHtml;
}
function fillViewportHeight(){
  var isMobile = window.innerWidth <= 700;
  var el = document.documentElement, body = document.body;
  if (document.body.classList.contains('ops-page')) {
    el.style.minHeight = '';
    body.style.minHeight = '';
    return;
  }
  if (!isMobile){ el.style.minHeight=''; body.style.minHeight=''; return; }
  var h = Math.max(window.innerHeight||0, (window.screen&&window.screen.availHeight)||0, 600);
  el.style.minHeight = h + 'px';
  body.style.minHeight = h + 'px';
  document.querySelectorAll('.page').forEach(function(p) { p.style.minHeight = ''; });
  var activeId = typeof getActivePageId === 'function' ? getActivePageId() : '';
  var active = activeId ? document.getElementById(activeId) : null;
  if (active && active.classList.contains('page')) active.style.minHeight = h + 'px';
}
fillViewportHeight();
window.addEventListener('resize', fillViewportHeight);
window.addEventListener('orientationchange', fillViewportHeight);
setTimeout(fillViewportHeight, 300);
setTimeout(fillViewportHeight, 1200);

initHeroSlider();
restoreOpsSession();
restoreClientPortalSession();
updateAuthNavLabel();
if (typeof applyLandingDeepLink_ === 'function') applyLandingDeepLink_();
if (typeof google !== 'undefined' && google.script && google.script.run) {
  google.script.run.withFailureHandler(function() {}).warmup();
}
