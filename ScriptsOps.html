<script>
function toggleOperationShell(isAllowed) {
  var gate = document.getElementById('ops-access-gate');
  var sidebar = document.querySelector('#ops > .ops-sidebar');
  var main = document.querySelector('#ops > .ops-main');
  var ops = document.getElementById('ops');
  // Class first — IndexAuth CSS keys off .ops-shell-open (beats stale !important rules).
  if (ops) {
    ops.classList.toggle('ops-shell-open', !!isAllowed);
    if (!isAllowed) {
      ops.classList.remove('ops-sidebar-expanded');
      ops.classList.remove('ops-shell-reveal');
      document.body.classList.remove('ops-sidebar-open');
    }
  }
  if (gate) {
    if (isAllowed) {
      gate.style.setProperty('display', 'none', 'important');
    } else {
      gate.style.setProperty('display', 'flex', 'important');
    }
  }
  if (sidebar) {
    sidebar.style.setProperty('display', isAllowed ? 'flex' : 'none', 'important');
  }
  if (main) {
    main.style.setProperty('display', isAllowed ? 'flex' : 'none', 'important');
  }
  if (isAllowed) {
    document.body.classList.remove('login-mode-signin', 'login-mode-signup');
    document.body.classList.add('auth-gated');
    document.body.classList.remove('public-site');
    // Restart enter animations now that .ops-main is visible (were opacity:0 while hidden).
    reviveOpsEnterAnimations_(ops);
  } else if (!document.getElementById('ops-access-gate') ||
             !document.getElementById('ops-access-gate').classList.contains('is-client-shell')) {
    // Login gate again (not client portal). Keep client portal auth-gated via updateAuthNavLabel.
    if (typeof isAuthenticatedSession === 'function' && !isAuthenticatedSession()) {
      document.body.classList.remove('auth-gated');
      document.body.classList.add('public-site');
    }
  }
  updateOpsSidebarToggle();
  renderAdminProfile();
}

/** Re-run glass/chart enter after login — animations skip while parent is display:none. */
function reviveOpsEnterAnimations_(root) {
  root = root || document.getElementById('ops');
  if (!root) return;
  root.classList.remove('ops-shell-reveal');
  var nodes = root.querySelectorAll('.glass-enter, .chart-enter, .pd-enter');
  for (var i = 0; i < nodes.length; i++) {
    var el = nodes[i];
    el.style.opacity = '1';
    el.style.transform = 'none';
    el.style.animation = 'none';
  }
  // Force reflow then optionally replay once.
  void root.offsetWidth;
  for (var j = 0; j < nodes.length; j++) {
    nodes[j].style.animation = '';
  }
  root.classList.add('ops-shell-reveal');
}

function updateOpsSidebarToggle() {
  var ops = document.getElementById('ops');
  if (!ops) return;
  var expanded = ops.classList.contains('ops-sidebar-expanded');
  ['ops-sidebar-toggle', 'ops-header-menu'].forEach(function(id) {
    var btn = document.getElementById(id);
    if (!btn) return;
    btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    btn.setAttribute('title', expanded ? 'Tutup menu' : 'Buka menu');
    btn.setAttribute('aria-label', expanded ? 'Tutup menu' : 'Buka menu');
  });
}

function toggleOpsSidebar(forceExpanded) {
  var ops = document.getElementById('ops');
  if (!ops || !ops.classList.contains('ops-shell-open')) return;
  var expanded = typeof forceExpanded === 'boolean'
    ? forceExpanded
    : !ops.classList.contains('ops-sidebar-expanded');
  ops.classList.toggle('ops-sidebar-expanded', expanded);
  document.body.classList.toggle('ops-sidebar-open', expanded);
  updateOpsSidebarToggle();
}

function closeOpsSidebarIfMobile_() {
  if (window.innerWidth > 700) return;
  toggleOpsSidebar(false);
}

function initOpsMobileNav_() {
  if (window._opsMobileNavBound) return;
  window._opsMobileNavBound = true;
  var ops = document.getElementById('ops');
  if (ops) {
    ops.addEventListener('click', function(e) {
      if (!ops.classList.contains('ops-sidebar-expanded')) return;
      if (window.innerWidth > 700) return;
      var sidebar = ops.querySelector(':scope > .ops-sidebar');
      if (sidebar && sidebar.contains(e.target)) return;
      toggleOpsSidebar(false);
    });
  }
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Escape') return;
    var opsEl = document.getElementById('ops');
    if (opsEl && opsEl.classList.contains('ops-sidebar-expanded')) toggleOpsSidebar(false);
  });
  window.addEventListener('resize', function() {
    if (window.innerWidth > 700) {
      document.body.classList.remove('ops-sidebar-open');
    }
  });
}
initOpsMobileNav_();

function renderAdminProfile() {
  var profile = document.getElementById('admin-profile');
  if (!profile) return;
  var isVisible = _opsUnlocked && !!_opsInternalEmail;
  profile.style.display = isVisible ? 'flex' : 'none';
  applyOpsNavPermissions();
  var bellWrap = document.getElementById('approval-bell-wrap');
  if (bellWrap) {
    bellWrap.style.display = (isVisible && !isDeptPicUser()) ? 'block' : 'none';
  }
  if (!isVisible) return;
  var displayName = _opsInternalName || _opsInternalEmail;
  var role = getInternalUserDisplayRole({ email: _opsInternalEmail, role: _opsInternalRole || 'INTERNAL' });
  var initialSource = _opsInternalName || _opsInternalEmail || 'A';
  document.getElementById('admin-avatar').textContent = initialSource.trim().charAt(0) || 'A';
  document.getElementById('admin-name').textContent = displayName;
  document.getElementById('admin-role').textContent = role;
}

/**
 * Endpoint *Packed mengirim JSON string, bukan objek: serializer objek
 * google.script.run diam-diam menyerah pada payload besar dan success handler
 * menerima undefined. Lihat packPayload_ di Kode.js.
 */
function unpackServerPayload(raw) {
  if (raw === null || raw === undefined || raw === '') return null;
  if (typeof raw === 'object') return raw;
  try {
    return JSON.parse(raw);
  } catch (e) {
    return { success: false, error: 'Respons server rusak (JSON tidak valid).' };
  }
}

function refreshPendingApprovals() {
  if (!_opsUnlocked || !getInternalPayKey()) return;
  google.script.run
    .withSuccessHandler(function(rawRes) {
      var res = unpackServerPayload(rawRes);
      if (!res || !res.success) return;
      PENDING_APPROVALS = res.pendingApprovals || [];
      REJECTED_APPROVALS = res.rejectedApprovals || [];
      OPS_NOTIFICATIONS = res.notifications || res.approvals || [];
      renderApprovalBell();
      rebuildPaymentClientsWithApprovals();
      syncLeadsIfNotifHasMissingProjects();
    })
    .withFailureHandler(function() {})
    .getPendingApprovalsPacked(getInternalPayKey());
}

/** Notifikasi lead baru bisa lebih dulu ter-update daripada kartu Client Status. */
function syncLeadsIfNotifHasMissingProjects() {
  var missing = false;
  (OPS_NOTIFICATIONS || []).forEach(function(n) {
    if (!n || n.dismissed) return;
    if (n.type !== 'NEW_LEAD' || !n.projectId) return;
    if (!LEADS.some(function(l) { return sameProjectIdClient(l.id, n.projectId); })) {
      missing = true;
    }
  });
  if (missing) {
    loadOperationData({ source: 'leads', showLoading: false, force: true });
  }
}

function getInboxFeed() {
  var feed = (OPS_NOTIFICATIONS && OPS_NOTIFICATIONS.length)
    ? OPS_NOTIFICATIONS.slice()
    : buildLocalOpsNotifications();
  return feed;
}

function filterInboxFeed(feed, tab) {
  tab = tab || OPS_INBOX_TAB || 'action';
  return (feed || []).filter(function(n) {
    if (tab === 'action') return n.category === 'action' && !n.dismissed;
    if (tab === 'info') return n.category === 'info' && !n.dismissed;
    if (tab === 'done') return n.category === 'done' || n.dismissed;
    return true;
  });
}

function countActionableUnread(feed) {
  return (feed || []).filter(function(n) {
    return n.actionable && !n.dismissed && !n.read;
  }).length;
}

function setInboxTab(tab, event) {
  if (event) event.stopPropagation();
  OPS_INBOX_TAB = tab || 'action';
  ['action', 'info', 'done'].forEach(function(t) {
    var el = document.getElementById('inbox-tab-' + t);
    if (el) el.classList.toggle('active', t === OPS_INBOX_TAB);
  });
  renderApprovalBell();
}

function groupInboxFeed(feed) {
  var groups = {};
  var order = [];
  (feed || []).forEach(function(item) {
    var key = item.group || 'other';
    if (!groups[key]) {
      groups[key] = {
        key: key,
        label: item.groupLabel || 'Lainnya',
        order: Number(item.groupOrder || 99),
        items: []
      };
      order.push(key);
    }
    groups[key].items.push(item);
  });
  order.sort(function(a, b) {
    return (groups[a].order || 99) - (groups[b].order || 99);
  });
  return order.map(function(k) { return groups[k]; });
}

function renderInboxNotifItem(item) {
  var allowedTagClass = { pending:1, rejected:1, approved:1, info:1, risk:1 };
  var tagClass = allowedTagClass[item.tagClass] ? item.tagClass : 'pending';
  var tag = item.tag || 'Info';
  var nid = escapeAttr(item.id || item.approvalId || '');
  var isUnread = item.actionable && !item.read && !item.dismissed;
  var classes = 'approval-dd-item'
    + (item.read ? ' is-read' : '')
    + (item.dismissed ? ' is-dismissed' : '')
    + (isUnread ? ' is-unread' : '');
  var dismissBtn = item.dismissed
    ? ''
    : '<span class="approval-dd-dismiss" role="button" tabindex="0" title="Sembunyikan" data-dismiss-id="'+nid+'">×</span>';
  var actorLine = item.actorLabel
    ? '<div class="approval-dd-actor">'+escapeHtml(item.actorLabel)+'</div>'
    : (item.submittedBy && item.type && item.type.indexOf('PENDING') >= 0
        ? '<div class="approval-dd-actor">'+escapeHtml(String(item.submittedBy).split('@')[0])+'</div>'
        : '');
  var progressLine = (item.progress != null && item.progress !== '')
    ? '<div class="approval-dd-progress">Progress diajukan: <strong>'+Number(item.progress)+'%</strong></div>'
    : '';
  return '<div class="'+classes+'" role="button" tabindex="0" data-notif-id="'+nid+'">'
    + dismissBtn
    +'<div class="approval-dd-top"><span class="approval-dd-tag '+escapeAttr(tagClass)+'">'+escapeHtml(tag)+'</span>'
    +(item.projectId ? '<span class="approval-dd-project">'+escapeHtml(String(item.projectId))+'</span>' : '')
    +'</div>'
    +'<div class="approval-dd-title">'+escapeHtml(item.title || item.clientName || 'Notifikasi')+'</div>'
    +'<p class="approval-dd-meta">'+escapeHtml(item.description || '')+'</p>'
    +progressLine
    +actorLine
    +(item.amount ? '<div class="approval-dd-amount">Rp '+Number(item.amount || 0).toLocaleString('id-ID')+'</div>' : '')
    +(item.timestamp ? '<div class="approval-dd-time">'+escapeHtml(item.timestamp)+'</div>' : '')
    +'</div>';
}

function renderApprovalBell() {
  var wrap = document.getElementById('approval-bell-wrap');
  var badge = document.getElementById('approval-bell-badge');
  var countEl = document.getElementById('approval-dd-count');
  var list = document.getElementById('approval-dd-list');
  if (!wrap || !badge || !list) return;
  wrap.style.display = (_opsUnlocked && _opsInternalEmail) ? 'block' : 'none';

  var feed = getInboxFeed();
  var actionCount = countActionableUnread(feed);
  var filtered = filterInboxFeed(feed, OPS_INBOX_TAB);

  badge.textContent = String(actionCount);
  badge.classList.toggle('show', actionCount > 0);
  if (countEl) countEl.textContent = actionCount + ' perlu ditindak';

  ['action', 'info', 'done'].forEach(function(t) {
    var el = document.getElementById('inbox-tab-' + t);
    if (el) el.classList.toggle('active', t === OPS_INBOX_TAB);
  });

  if (!filtered.length) {
    var emptyMsg = OPS_INBOX_TAB === 'action'
      ? (isDirectorUser()
          ? 'Tidak ada aksi menunggu. Pengajuan PIC, Officer, dan lead baru akan muncul di sini.'
          : 'Tidak ada aksi untukmu. Reject atau revisi akan muncul di sini.')
      : (OPS_INBOX_TAB === 'info'
          ? 'Tidak ada info monitoring saat ini.'
          : 'Belum ada item selesai / diarsipkan.');
    list.innerHTML = '<div class="approval-dd-empty">' + emptyMsg + '</div>';
    return;
  }

  var grouped = groupInboxFeed(filtered);
  list.innerHTML = grouped.map(function(grp) {
    var header = '<div class="approval-dd-group">'
      +'<div class="approval-dd-group-head">'
      +'<span class="approval-dd-group-label">'+escapeHtml(grp.label)+'</span>'
      +'<span class="approval-dd-group-count">'+grp.items.length+'</span>'
      +'</div>'
      +'<div class="approval-dd-group-items">'
      + grp.items.map(renderInboxNotifItem).join('')
      +'</div></div>';
    return header;
  }).join('');

  // Bind klik di seluruh kartu (bukan nested button)
  Array.prototype.forEach.call(list.querySelectorAll('.approval-dd-item'), function(card) {
    card.addEventListener('click', function(e) {
      var dismiss = e.target.closest('[data-dismiss-id]');
      if (dismiss) {
        e.preventDefault();
        e.stopPropagation();
        dismissOpsNotif(dismiss.getAttribute('data-dismiss-id'));
        return;
      }
      handleOpsNotifClick(card.getAttribute('data-notif-id'));
    });
    card.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleOpsNotifClick(card.getAttribute('data-notif-id'));
      }
    });
  });
}

function buildLocalOpsNotifications() {
  var feed = [];
  if (isDirectorUser()) {
    (PENDING_APPROVALS || []).forEach(function(item) {
      if (item.type === 'DEPT') {
        var prog = Number(item.progress || 0);
        var deptLabel = item.departmentLabel || item.departmentId || 'Departemen';
        var actor = String(item.submittedBy || '').split('@')[0] || 'PIC';
        feed.push({
          id: item.approvalId,
          approvalId: item.approvalId,
          type: 'DEPT_PENDING',
          group: 'production',
          groupLabel: 'Production Ops',
          groupOrder: 1,
          category: 'action',
          actionable: true,
          status: 'PENDING',
          title: prog >= 100
            ? ('Validasi penyelesaian ' + deptLabel)
            : ('Validasi progress ' + deptLabel + ' · ' + prog + '%'),
          description: actor + ' (PIC dept) mengajukan progress ' + prog + '% · ' + (item.clientName || item.projectId),
          projectId: item.projectId,
          clientName: item.clientName,
          departmentId: item.departmentId,
          departmentLabel: item.departmentLabel,
          progress: prog,
          submittedBy: item.submittedBy,
          actorLabel: actor,
          timestamp: item.submittedAt,
          actionLabel: 'Review & putuskan',
          tag: prog >= 100 ? 'Selesai' : ('Progress ' + prog + '%'),
          tagClass: 'pending',
          targetView: 'production-ops',
          targetAction: 'review_dept'
        });
        return;
      }
      var payActor = String(item.submittedBy || '').split('@')[0] || 'Officer';
      feed.push({
        id: item.approvalId,
        approvalId: item.approvalId,
        type: 'PAYMENT_PENDING',
        group: 'billing',
        groupLabel: 'Billing & Invoice',
        groupOrder: 2,
        category: 'action',
        actionable: true,
        status: 'PENDING',
        title: 'Review pembayaran · Rp ' + Number(item.amount || 0).toLocaleString('id-ID'),
        description: payActor + ' (Officer) mengajukan bukti bayar · ' + (item.clientName || item.projectId),
        projectId: item.projectId,
        clientName: item.clientName,
        amount: item.amount,
        submittedBy: item.submittedBy,
        actorLabel: payActor,
        timestamp: item.submittedAt,
        actionLabel: 'Review & putuskan',
        tag: 'Pembayaran',
        tagClass: 'pending',
        targetView: 'doc-gen',
        targetAction: 'review_payment'
      });
    });
  } else {
    (REJECTED_APPROVALS || []).forEach(function(item) {
      if (item.type === 'DEPT') {
        var deptLbl = item.departmentLabel || item.departmentId || 'Departemen';
        feed.push({
          id: item.approvalId,
          approvalId: item.approvalId,
          type: 'DEPT_REJECTED',
          group: 'production',
          groupLabel: 'Production Ops',
          groupOrder: 1,
          category: 'action',
          actionable: true,
          status: 'REJECTED',
          title: 'Progress ' + deptLbl + ' ditolak',
          description: item.reviewNotes ? ('Direktur: ' + item.reviewNotes) : (deptLbl + ' perlu diperbaiki lalu diajukan ulang'),
          projectId: item.projectId,
          departmentId: item.departmentId,
          departmentLabel: item.departmentLabel,
          progress: Number(item.progress || 0),
          timestamp: item.reviewedAt || item.submittedAt,
          actionLabel: 'Perbaiki di Production Ops',
          tag: 'Perlu revisi',
          tagClass: 'rejected',
          targetView: 'production-ops',
          targetAction: 'open_dept'
        });
        return;
      }
      feed.push({
        id: item.approvalId,
        approvalId: item.approvalId,
        type: 'PAYMENT_REJECTED',
        group: 'billing',
        groupLabel: 'Billing & Invoice',
        groupOrder: 2,
        category: 'action',
        actionable: true,
        status: 'REJECTED',
        title: 'Pembayaran ditolak Direktur',
        description: item.reviewNotes ? ('Direktur: ' + item.reviewNotes) : ((item.clientName || item.projectId) + ' perlu diajukan ulang'),
        projectId: item.projectId,
        amount: item.amount,
        timestamp: item.reviewedAt || item.submittedAt,
        actionLabel: 'Ajukan ulang di Billing',
        tag: 'Perlu revisi',
        tagClass: 'rejected',
        targetView: 'doc-gen',
        targetAction: 'resubmit_payment'
      });
    });
    (PENDING_APPROVALS || []).forEach(function(item) {
      if (item.type === 'DEPT') {
        var deptLbl2 = item.departmentLabel || item.departmentId || 'Departemen';
        var progW = Number(item.progress || 0);
        feed.push({
          id: 'WAIT_DEPT_' + item.approvalId,
          approvalId: item.approvalId,
          type: 'DEPT_WAITING',
          group: 'production',
          groupLabel: 'Production Ops',
          groupOrder: 1,
          category: 'info',
          actionable: false,
          informational: true,
          status: 'PENDING',
          title: 'Progress ' + deptLbl2 + ' menunggu Direktur',
          description: 'Pengajuan ' + progW + '% · ' + (item.clientName || item.projectId) + ' — menunggu validasi',
          projectId: item.projectId,
          progress: progW,
          timestamp: item.submittedAt,
          actionLabel: 'Lihat detail',
          tag: 'Menunggu',
          tagClass: 'pending',
          targetView: 'production-ops',
          targetAction: 'review_dept'
        });
        return;
      }
      feed.push({
        id: 'WAIT_' + item.approvalId,
        approvalId: item.approvalId,
        type: 'PAYMENT_WAITING',
        group: 'billing',
        groupLabel: 'Billing & Invoice',
        groupOrder: 2,
        category: 'info',
        actionable: false,
        informational: true,
        status: 'PENDING',
        title: 'Pengajuan pembayaran menunggu Direktur',
        description: (item.clientName || item.projectId) + ' · Rp ' + Number(item.amount || 0).toLocaleString('id-ID') + ' dalam antrean review',
        projectId: item.projectId,
        amount: item.amount,
        timestamp: item.submittedAt,
        actionLabel: 'Lihat detail',
        tag: 'Menunggu',
        tagClass: 'pending',
        targetView: 'doc-gen',
        targetAction: 'review_payment'
      });
    });
  }

  // Local fallback lead signals from LEADS cache
  (LEADS || []).forEach(function(lead) {
    var projectId = normalizeProjectIdClient(lead.id || lead.projectId || lead.projectid);
    if (!projectId) return;
    var status = String(lead.status || '').trim();
    var client = String(lead.client || lead.clientName || lead.brandName || 'Client').trim();
    if (status === 'New Lead') {
      feed.push({
        id: 'LEAD_NEW_' + projectId,
        type: 'NEW_LEAD',
        group: 'lead',
        groupLabel: 'Lead & Client',
        groupOrder: 3,
        category: 'action',
        actionable: true,
        title: 'Lead baru masuk',
        description: client + ' perlu follow-up & dealing oleh Officer',
        projectId: projectId,
        clientName: client,
        timestamp: lead.timestamp || '',
        actionLabel: 'Buka Client Status',
        tag: 'Lead',
        tagClass: 'pending',
        targetView: 'internal-db',
        targetAction: 'open_project'
      });
    }
  });
  return feed;
}

function normalizeProjectIdClient(id) {
  id = String(id || '').trim();
  if (!id) return '';
  return id.charAt(0) === '#' ? id : '#' + id.replace(/^#/, '');
}

function findOpsNotifById(notificationId) {
  notificationId = String(notificationId || '');
  var feed = getInboxFeed();
  for (var i = 0; i < feed.length; i++) {
    if (String(feed[i].id || '') === notificationId || String(feed[i].approvalId || '') === notificationId) {
      return feed[i];
    }
  }
  return null;
}

function markOpsNotifLocal(notificationId, action) {
  (OPS_NOTIFICATIONS || []).forEach(function(n) {
    if (String(n.id || '') !== String(notificationId) && String(n.approvalId || '') !== String(notificationId)) return;
    if (action === 'read') n.read = true;
    if (action === 'dismiss') {
      n.dismissed = true;
      n.category = 'done';
    }
  });
  renderApprovalBell();
}

function persistOpsNotifState(notificationId, action) {
  if (!getInternalPayKey() || !notificationId) return;
  markOpsNotifLocal(notificationId, action);
  google.script.run
    .withSuccessHandler(function() {})
    .withFailureHandler(function() {})
    .markOpsNotificationState(getInternalPayKey(), notificationId, action);
}

function dismissOpsNotif(notificationId) {
  persistOpsNotifState(notificationId, 'dismiss');
}

function handleOpsNotifClick(notificationId) {
  var item = findOpsNotifById(notificationId);
  closeApprovalDropdown();
  if (!item) {
    // payment-only fallback
    if (notificationId) openApprovalReview(notificationId);
    return;
  }

  persistOpsNotifState(item.id || notificationId, 'read');

  var action = item.targetAction || '';
  var projectId = item.projectId || '';

  if (action === 'review_payment' || action === 'resubmit_payment') {
    if (item.approvalId) {
      openApprovalReview(item.approvalId);
      return;
    }
  }

  if (action === 'review_dept' || action === 'open_dept') {
    if (item.approvalId && action === 'review_dept') {
      openApprovalReview(item.approvalId);
      return;
    }
    if (item.projectId) {
      openProductionOpsForProject(item.projectId);
      return;
    }
    setView('production-ops');
    return;
  }

  if (action === 'open_billing' || item.targetView === 'doc-gen') {
    if (projectId) {
      goToProjectInvoice(projectId);
    } else {
      setView('doc-gen');
    }
    return;
  }

  if (action === 'open_project' || item.targetView === 'internal-db') {
    if (projectId) {
      openProjectDetailFromBilling(projectId);
    } else {
      setView('internal-db');
    }
    return;
  }

  if (item.approvalId) openApprovalReview(item.approvalId);
}

function toggleApprovalDropdown(event) {
  if (event) event.stopPropagation();
  var dd = document.getElementById('approval-dropdown');
  var btn = document.getElementById('approval-bell-btn');
  if (!dd) return;
  var open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  if (btn) btn.classList.toggle('open', open);
  if (open) {
    OPS_INBOX_TAB = OPS_INBOX_TAB || 'action';
    refreshPendingApprovals();
    renderApprovalBell();
  }
}

function closeApprovalDropdown() {
  var dd = document.getElementById('approval-dropdown');
  var btn = document.getElementById('approval-bell-btn');
  if (dd) dd.classList.remove('open');
  if (btn) btn.classList.remove('open');
}

function findApprovalById(approvalId) {
  var all = (PENDING_APPROVALS || []).concat(REJECTED_APPROVALS || []);
  // Juga cari dari feed notifikasi approved
  (OPS_NOTIFICATIONS || []).forEach(function(n) {
    if (n && n.approvalId && !all.some(function(a){ return a.approvalId === n.approvalId; })) {
      all.push(n);
    }
  });
  for (var i = 0; i < all.length; i++) {
    if (all[i].approvalId === approvalId) return all[i];
  }
  return null;
}

function openApprovalReview(approvalId) {
  closeApprovalDropdown();
  var item = findApprovalById(approvalId);
  if (!item) {
    showToast('Tidak Ditemukan', 'Pengajuan tidak ada di cache. Refresh data dulu.', 'warning');
    refreshPendingApprovals();
    return;
  }
  ACTIVE_APPROVAL_ID = approvalId;
  ACTIVE_APPROVAL_TYPE = (
    item.type === 'DEPT'
    || String(item.type || '').indexOf('DEPT_') === 0
    || item.targetAction === 'review_dept'
    || item.targetAction === 'open_dept'
    || !!item.departmentId
  ) ? 'DEPT' : 'PAYMENT';

  // Bukti transfer tidak ikut sync massal — ambil detail saat Direktur buka review.
  if (ACTIVE_APPROVAL_TYPE === 'PAYMENT' && isDirectorUser() && !item.proofUrl && (item.hasProof || item.status === 'PENDING')) {
    renderApprovalReviewModal(item);
    var proofWrap = document.getElementById('am-proof-wrap');
    if (proofWrap) {
      proofWrap.style.display = 'block';
      proofWrap.innerHTML = '<div class="lead-ts">Memuat bukti transfer…</div>';
    }
    setApprovalModalBusy(true, 'Memuat bukti…');
    google.script.run
      .withSuccessHandler(function(res) {
        setApprovalModalBusy(false);
        if (res && res.success && res.approval) {
          mergeApprovalDetailIntoCaches(res.approval);
          renderApprovalReviewModal(findApprovalById(approvalId) || res.approval);
        } else {
          showToast('Detail Gagal', (res && res.error) || 'Bukti transfer tidak bisa dimuat.', 'warning');
          renderApprovalReviewModal(item);
        }
      })
      .withFailureHandler(function(err) {
        setApprovalModalBusy(false);
        showToast('Detail Gagal', err.message || 'Gagal memuat bukti.', 'warning');
        renderApprovalReviewModal(item);
      })
      .getPaymentApprovalDetail(getInternalPayKey(), approvalId);
    return;
  }
  renderApprovalReviewModal(item);
}

function mergeApprovalDetailIntoCaches(approval) {
  if (!approval || !approval.approvalId) return;
  function patchList(list) {
    return (list || []).map(function(a) {
      if (a.approvalId !== approval.approvalId) return a;
      return Object.assign({}, a, approval);
    });
  }
  PENDING_APPROVALS = patchList(PENDING_APPROVALS);
  REJECTED_APPROVALS = patchList(REJECTED_APPROVALS);
  OPS_NOTIFICATIONS = (OPS_NOTIFICATIONS || []).map(function(n) {
    if (n.approvalId !== approval.approvalId) return n;
    return Object.assign({}, n, {
      proofUrl: approval.proofUrl || n.proofUrl,
      hasProof: approval.hasProof
    });
  });
}

    ['Catatan officer', item.notes || '—'],

  if (isRejected || isApproved) {
    detailRows.splice(6, 0, ['Direview oleh', item.reviewedBy || '—']);
  }

function applyDeptApprovalLocally(res) {
  if (!res || !res.projectId) return;
  var projectId = res.projectId;
  var approvalId = res.approvalId || '';
  var status = String(res.status || '').toUpperCase();
  var lead = LEADS.find(function(item) { return sameProjectIdClient(item.id, projectId); });
  if (lead) {
    if (res.opsData) lead.productionOpsData = JSON.stringify(res.opsData);
    if (res.opsUpdatedAt) lead.productionOpsUpdatedAt = res.opsUpdatedAt;
    if (res.production) {
      lead.productionStage = res.production.stage || lead.productionStage;
      lead.productionUpdatedAt = res.production.updatedAt || lead.productionUpdatedAt;
      lead.productionUpdatedBy = res.production.updatedBy || lead.productionUpdatedBy;
    }
  }
  var prior = findApprovalById(approvalId) || {
    approvalId: approvalId,
    projectId: projectId,
    departmentId: res.departmentId,
    departmentLabel: res.departmentLabel,
    type: 'DEPT',
    progress: res.progress
  };
  PENDING_APPROVALS = (PENDING_APPROVALS || []).filter(function(a) {
    if (approvalId && a.approvalId === approvalId) return false;
    return !(a.type === 'DEPT' && sameProjectIdClient(a.projectId, projectId) && a.departmentId === res.departmentId);
  });
  if (status === 'REJECTED') {
    REJECTED_APPROVALS = (REJECTED_APPROVALS || []).filter(function(a) {
      return !(approvalId && a.approvalId === approvalId);
    });
    REJECTED_APPROVALS.unshift(Object.assign({}, prior, {
      status: 'REJECTED',
      reviewNotes: res.reviewNotes || '',
      type: 'DEPT'
    }));
  } else {
    REJECTED_APPROVALS = (REJECTED_APPROVALS || []).filter(function(a) {
      return !(approvalId && a.approvalId === approvalId);
    });
  }
  OPS_NOTIFICATIONS = buildLocalOpsNotifications();
  delete PROJECT_TIMELINES[projectId];
  delete PROJECT_TIMELINES[String(projectId).replace(/^#/, '')];
  delete PROJECT_TIMELINES['#' + String(projectId).replace(/^#/, '')];
  if (document.getElementById('view-production-ops') && document.getElementById('view-production-ops').classList.contains('active')) {
    renderProductionOpsView();
  }
  if (projectDetailId && sameProjectIdClient(projectDetailId, projectId)) {
    renderProjectDetail(projectDetailId, true);
  }
  renderApprovalBell();
  persistCurrentOpsDataCache();
}

var APPROVAL_MODAL_BUSY = false;

function setApprovalModalBusy(isBusy, label) {
  APPROVAL_MODAL_BUSY = !!isBusy;
  var backdrop = document.getElementById('approval-modal');
  if (backdrop) backdrop.classList.toggle('is-busy', APPROVAL_MODAL_BUSY);
  var modal = backdrop ? backdrop.querySelector('.approval-modal') : null;
  if (modal) modal.classList.toggle('is-busy', APPROVAL_MODAL_BUSY);
  var actions = document.getElementById('am-actions');
  if (!actions) return;
  var buttons = actions.querySelectorAll('button');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].disabled = APPROVAL_MODAL_BUSY;
    if (APPROVAL_MODAL_BUSY && label && i === 0) {
      if (!buttons[i].dataset.defaultLabel) buttons[i].dataset.defaultLabel = buttons[i].textContent;
      buttons[i].textContent = label;
    }
  }
}

function kickPaymentSideEffects() {
  if (typeof getInternalPayKey !== 'function') return;
  var key = getInternalPayKey();
  if (!key) return;
  google.script.run
    .withSuccessHandler(function(res) { applyPaymentDispatchResults(res); })
    .withFailureHandler(function() {})
    .dispatchPaymentSideEffects(key);
}

function applyPaymentDispatchResults(res) {
  if (!res || !res.results || !res.results.length) return;
  var patched = false;
  (res.results || []).forEach(function(item) {
    if (!item || !item.success || !item.invoiceUrl) return;
    if (item.projectId) {
      patchLastPaymentMapEntry(item.projectId, {
        invoiceUrl: item.invoiceUrl,
        invoiceNumber: item.invoiceNumber || undefined
      });
      patched = true;
      return;
    }
    if (!item.invoiceNumber) return;
    Object.keys(LAST_PAYMENT_MAP || {}).forEach(function(key) {
      var row = LAST_PAYMENT_MAP[key];
      if (row && row.invoiceNumber === item.invoiceNumber) {
        LAST_PAYMENT_MAP[key] = Object.assign({}, row, { invoiceUrl: item.invoiceUrl });
        patched = true;
      }
    });
  });
  if (!patched) return;
  PAYMENT_CLIENTS = buildPaymentClientsFromLeads(LEADS, LAST_PAYMENT_MAP);
  renderOperationDataViews();
  persistCurrentOpsDataCache();
}

}

function applyRejectedPaymentLocally(res) {

function openOperationSystem() {
  if (typeof isClientUser === 'function' && isClientUser()) {
    openClientPortalFromSession();
    return;
  }
  try {
    _opsUnlocked = true;
    _internalPayUnlocked = true;
    // Gate CSS + nav before paint of shell, so login card cannot linger over dashboard.
    if (typeof applyPublicNavGate === 'function') applyPublicNavGate();
    toggleOperationShell(true);
    applyOpsNavPermissions();
    initPaymentAuth();
    if (typeof syncAuthBrandLogos === 'function') syncAuthBrandLogos();
    var hadCache = false;
    try { hadCache = hydrateOpsDataFromCache(); } catch (eHydra) { hadCache = false; }
    // skipLoad: jangan biarkan setView memulai fetch+overlay (race dengan login).
    setView(isDeptPicUser() ? 'production-ops' : 'analytics', true);
    renderApprovalBell();
    if (typeof updateAuthNavLabel === 'function') updateAuthNavLabel();
    if (OPS_DATA_SERVER_FRESH) {
      if (typeof renderOperationDataViews === 'function') renderOperationDataViews();
      return;
    }
    // Satu fetch tanpa overlay — overlay login sudah selesai.
    if (isDeptPicUser()) loadProductionOpsData({ showLoading: false });
    else loadOperationData({ source: 'all', showLoading: false });
    if (!hadCache && typeof renderOperationDataViews === 'function') {
      // Skeleton/zero state tetap terlihat sambil data datang.
      try { renderOperationDataViews(); } catch (eRender) {}
    }
  } catch (err) {
    try { console.error('[openOperationSystem]', err); } catch (eLog) {}
    try {
      _opsUnlocked = true;
      toggleOperationShell(true);
      showToast('Dashboard', (err && err.message) || 'Sebagian UI gagal dimuat. Coba Refresh.', 'warning');
    } catch (e2) {}
  }
}

  var opsPayload = res.opsData;
  if (typeof opsPayload === 'string' && typeof unpackServerPayload === 'function') {
    opsPayload = unpackServerPayload(opsPayload);
  }
  if (opsPayload && opsPayload.success) {
    applyOperationDataPayload(opsPayload);
    persistOpsDataCache(opsPayload);
    OPS_DATA_SERVER_FRESH = true;
  }
  if (typeof updateAuthNavLabel === 'function') updateAuthNavLabel();
  if (isClientUser()) {
    _opsUnlocked = false;
    _internalPayUnlocked = false;
    if (getActivePageId() !== 'ops') setPage('ops');
    if (res.portal && res.portal.success) {

function isElementVisible_(el) {
  if (!el || el.hidden) return false;
  if (el.style.display === 'none') return false;
  try {
    var cs = window.getComputedStyle(el);
    return cs.display !== 'none' && cs.visibility !== 'hidden';
  } catch (e) {
    return true;
  }
}

function loginRecaptchaHasLiveWidget_() {
  var wrap = document.getElementById('login-recaptcha');
  if (!wrap || wrap.hidden || !isElementVisible_(wrap)) return false;
  var iframe = wrap.querySelector('iframe');
  if (!iframe) return false;
  if (!iframe.src || iframe.src === 'about:blank') return false;
  var rect = iframe.getBoundingClientRect();
  if (rect.width < 250 || rect.height < 20) return false;
  if (rect.height > 96) return false;
  return true;
}

function refreshLoginRecaptchaOnPageShow_() {
  if (!getRecaptchaSiteKeyClient()) return;
  requestAnimationFrame(function() {
    if (loginRecaptchaHasLiveWidget_()) {
      clearRecaptchaInlineError_();
      return;
    }
    renderLoginRecaptcha(true);
    setTimeout(function() {
      if (!loginRecaptchaHasLiveWidget_()) renderLoginRecaptcha(true);
    }, 320);
  });
}

function ensureLoginRecaptchaVisible_() {

function isLoginRecaptchaMountReady_() {

  var wrap = document.getElementById('login-recaptcha');
  var signin = document.getElementById('ops-signin-form');
  if (!wrap || !ops || !gate) return false;
  if (!ops.classList.contains('active')) return false;
  if (ops.style.display === 'none') return false;
  if (!isElementVisible_(gate)) return false;
  if (signin && signin.style.display === 'none') return false;
  return true;
}

function scheduleLoginRecaptchaRender_(force) {

  window._loginRecaptchaRenderTimer = setTimeout(function() {
    window._loginRecaptchaRenderTimer = null;
    renderLoginRecaptcha(!!force);
  }, force ? 60 : 180);
}

function getRecaptchaHostHint_() {
  var hosts = ['script.google.com', 'googleusercontent.com'];
  try {
    var current = window.location.hostname || '';
    if (current && hosts.indexOf(current) < 0) hosts.unshift(current);
  } catch (e) {}
  try {
    document.querySelectorAll('iframe[src*="googleusercontent.com"]').forEach(function(frame) {
      var u = new URL(frame.src);
      if (u.hostname && hosts.indexOf(u.hostname) < 0) hosts.unshift(u.hostname);
    });
  } catch (e2) {}
  return hosts.slice(0, 4).join(', ');
}

function setRecaptchaInlineError_(message) {
  var wrap = document.getElementById('login-recaptcha');
  if (!wrap) return;
  var el = document.getElementById('login-recaptcha-error');
  if (!el) {
    el = document.createElement('p');
    el.id = 'login-recaptcha-error';
    el.className = 'auth-recaptcha-error';
    var row = wrap.closest('.auth-recaptcha-row');
    (row || wrap).insertAdjacentElement('afterend', el);
  }
  el.hidden = !message;
  el.textContent = message || '';
}

function clearRecaptchaInlineError_() {
  setRecaptchaInlineError_('');
}

function handleLoginRecaptchaError_(err) {
  var wrap = document.getElementById('login-recaptcha');
  var msg = String(err && err.message || err || '');
  if (/already been rendered/i.test(msg)) {
    var host = remountLoginRecaptchaHost_();
    if (host && typeof grecaptcha !== 'undefined' && typeof grecaptcha.render === 'function') {
      try {
        LOGIN_RECAPTCHA_WIDGET_ID = grecaptcha.render(host, {
          sitekey: getRecaptchaSiteKeyClient(),
          theme: getLoginRecaptchaTheme(),
          size: 'normal'
        });
        clearRecaptchaInlineError_();
        return;
      } catch (e2) {}
    }
  }
  LOGIN_RECAPTCHA_WIDGET_ID = null;
  if (wrap) wrap.hidden = false;
  var hostHint = getRecaptchaHostHint_();
  setRecaptchaInlineError_(
    'reCAPTCHA gagal dimuat. Di reCAPTCHA Admin → Domains, tambahkan: '
    + hostHint + '. Lalu deploy ulang & refresh.'
  );
}

  if (!email) { showToast('Email Kosong','Isi email terlebih dahulu.','warning'); return; }
  if (!SIGNUP_STATE.emailOtpVerified || SIGNUP_STATE.verifiedEmail !== email) {
    showToast('Email Belum Terverifikasi','Kirim dan verifikasi OTP email terlebih dahulu.','warning');
    return;
  }
  var policy = validatePasswordPolicy(password);
  if (!policy.ok) { showToast('Password Lemah', policy.error, 'warning'); return; }
  if (!hasSignupPdpConsent()) {
    showToast('Persetujuan Wajib','Centang persetujuan Syarat & Ketentuan serta Kebijakan Privasi sebelum membuat akun.','warning');
    return;
  }
  showLoading();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res || !res.success) {
        showToast('Sign Up Gagal', (res && res.error) || 'Akun tidak bisa dibuat.', 'warning');
        return;
      }
      SIGNUP_STATE.emailOtpVerified = false;
      SIGNUP_STATE.verifiedEmail = '';
      if (passwordEl) passwordEl.value = '';
      var pdpEl = document.getElementById('ops-signup-pdp');
      if (pdpEl) pdpEl.checked = false;
      if (!storeOpsLoginResult(res, email)) return;
      showToast('Sign Up Berhasil','Akun berhasil dibuat.');
      showClientPortalDashboardNow({
        email: res.email || email,
        name: res.name || name,
        projects: []
      });
    })
    .withFailureHandler(function(err) { hideLoading(); showToast('Error', err.message, 'warning'); })
    .signUpClientAccount(name, email, password, {
      pdpConsent: true,
      pdpPolicyVersion: PDP_POLICY_VERSION
    });

var LOGIN_RECAPTCHA_WIDGET_ID = null;

function getLoginRecaptchaTheme() {
  return 'light';
}

function remountLoginRecaptchaHost_() {
  var wrap = document.getElementById('login-recaptcha');
  if (!wrap || !wrap.parentNode) return wrap;
  try {
    if (typeof grecaptcha !== 'undefined' && LOGIN_RECAPTCHA_WIDGET_ID !== null) {
      grecaptcha.reset(LOGIN_RECAPTCHA_WIDGET_ID);
    }
  } catch (e) {}
  var next = wrap.cloneNode(false);
  next.removeAttribute('data-recaptcha-size');
  next.hidden = false;
  wrap.parentNode.replaceChild(next, wrap);
  LOGIN_RECAPTCHA_WIDGET_ID = null;
  return next;
}

function destroyLoginRecaptcha() {
  remountLoginRecaptchaHost_();
  clearRecaptchaInlineError_();
}

function getRecaptchaSiteKeyClient() {
  if (typeof RECAPTCHA_SITE_KEY === 'string' && RECAPTCHA_SITE_KEY) return RECAPTCHA_SITE_KEY;
  var wrap = document.getElementById('login-recaptcha');
  return wrap ? String(wrap.getAttribute('data-sitekey') || '').trim() : '';
}

function renderLoginRecaptcha(force) {
  var wrap = document.getElementById('login-recaptcha');
  var siteKey = getRecaptchaSiteKeyClient();
  if (!wrap) return;
  if (!siteKey) {
    wrap.hidden = true;
    clearRecaptchaInlineError_();
    return;
  }
  if (!isLoginRecaptchaMountReady_()) return;
  wrap.hidden = false;
  if (typeof grecaptcha === 'undefined' || typeof grecaptcha.render !== 'function') return;
  if (!force && loginRecaptchaHasLiveWidget_()) {
    if (LOGIN_RECAPTCHA_WIDGET_ID === null) LOGIN_RECAPTCHA_WIDGET_ID = 0;
    clearRecaptchaInlineError_();
    return;
  }
  var theme = getLoginRecaptchaTheme();
  var renderOpts = {
    sitekey: siteKey,
    theme: theme,
    size: 'normal',
    callback: clearRecaptchaInlineError_,
    'error-callback': function() {
      handleLoginRecaptchaError_({ message: 'recaptcha-error-callback' });
    },
    'expired-callback': function() {
      resetLoginRecaptcha();
    }
  };
  var doRender = function() {
    if (!isLoginRecaptchaMountReady_()) return;
    var host = remountLoginRecaptchaHost_() || document.getElementById('login-recaptcha');
    if (!host) return;
    host.hidden = false;
    host.setAttribute('data-theme', theme);
    try {
      LOGIN_RECAPTCHA_WIDGET_ID = grecaptcha.render(host, renderOpts);
      host.setAttribute('data-recaptcha-size', 'normal');
      clearRecaptchaInlineError_();
    } catch (err) {
      handleLoginRecaptchaError_(err);
    }
  };
  if (typeof grecaptcha.ready === 'function') grecaptcha.ready(doRender);
  else doRender();
}

function onRecaptchaApiReady_() {
  window._recaptchaApiReady = true;
  if (typeof getActivePageId === 'function' && getActivePageId() === 'ops') {
    refreshLoginRecaptchaOnPageShow_();
    return;
  }
  if (isLoginRecaptchaMountReady_()) scheduleLoginRecaptchaRender_();
}

function getLoginRecaptchaToken() {
  if (!getRecaptchaSiteKeyClient()) return '';
  if (typeof grecaptcha === 'undefined' || LOGIN_RECAPTCHA_WIDGET_ID === null) return '';
  try {
    return String(grecaptcha.getResponse(LOGIN_RECAPTCHA_WIDGET_ID) || '').trim();
  } catch (e) {
    return '';
  }
}

function resetLoginRecaptcha() {
  if (typeof grecaptcha === 'undefined' || LOGIN_RECAPTCHA_WIDGET_ID === null) return;
  try { grecaptcha.reset(LOGIN_RECAPTCHA_WIDGET_ID); } catch (e) {}
}

function setLoginPasswordError(message) {
  var el = document.getElementById('ops-login-password-error');
  var input = document.getElementById('ops-internal-password-input');
  var text = String(message || '').trim();
  if (el) {
    el.hidden = !text;
    el.textContent = text;
  }
  if (input) input.classList.toggle('is-error', !!text);
}

function clearLoginPasswordError() {
  setLoginPasswordError('');
}

function unlockOperationSystem() {
  var emailInput = document.getElementById('ops-internal-email-input');
  var passwordInput = document.getElementById('ops-internal-password-input');
  var email = emailInput ? emailInput.value.trim().toLowerCase() : "";
  var password = passwordInput ? passwordInput.value : "";
  clearLoginPasswordError();
  if (!email) { showToast('Email Kosong','Masukkan email akun terlebih dahulu.','warning'); return; }
  if (!password) {
    setLoginPasswordError('Masukkan password akun terlebih dahulu.');
    showToast('Password Kosong','Masukkan password akun terlebih dahulu.','warning');
    return;
  }
  var recaptchaToken = getLoginRecaptchaToken();
  if (getRecaptchaSiteKeyClient() && !recaptchaToken) {
    showToast('reCAPTCHA','Centang "I\'m not a robot" terlebih dahulu.','warning');
    return;
  }
  showLoading();
  var loginStartedAt = Date.now();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      resetLoginRecaptcha();
      var roundTripMs = Date.now() - loginStartedAt;
      try {
        console.log('[login] round-trip ' + roundTripMs + 'ms', res && res._timings ? res._timings : '(no server timings)');
      } catch (e) {}
      if (!res || typeof res !== 'object') {
        var badMsg = 'Respons login tidak valid. Coba lagi.';
        setLoginPasswordError(badMsg);
        showToast('Sign In Gagal', badMsg, 'warning');
        return;
      }
      if (!res.success) {
        var failMsg = res.error || 'Email atau password tidak sesuai.';
        setLoginPasswordError(failMsg);
        showToast('Sign In Gagal', failMsg, 'warning');
        return;
      }
      clearLoginPasswordError();
      if (!storeOpsLoginResult(res, email)) return;
      showToast('Sign In Berhasil','Berhasil masuk.');
      var role = String(res.role || '').toUpperCase();
      if (role === 'CLIENT') {
        try {
          if (res.portal && res.portal.success) showClientPortalDashboardNow(res.portal);
          else openClientPortalFromSession();
        } catch (portalErr) {
          try { openClientPortalFromSession(); } catch (e2) {}
        }
        return;
      }
      // opsData opsional — jangan biarkan payload rusak memblokir buka dashboard.
      try {
        var opsPayload = res.opsData;
        if (typeof opsPayload === 'string' && typeof unpackServerPayload === 'function') {
          opsPayload = unpackServerPayload(opsPayload);
        }
        if (opsPayload && opsPayload.success) {
          applyOperationDataPayload(opsPayload);
          persistOpsDataCache(opsPayload);
          OPS_DATA_SERVER_FRESH = true;
        }
      } catch (opsErr) {
        OPS_DATA_SERVER_FRESH = false;
        try { console.warn('[login] opsData skip', opsErr); } catch (e3) {}
      }
      openOperationSystem();
    })
    .withFailureHandler(function(err) {
      hideLoading();
      resetLoginRecaptcha();
      var failMsg = (err && err.message) || 'Sign In gagal.';
      setLoginPasswordError(failMsg);
      showToast('Error', failMsg, 'warning');
    })
    .validateInternalLogin(email, password, recaptchaToken);
}

// true = state portal berasal dari server pada sesi ini, jadi tidak perlu fetch ulang.

var CLIENT_PORTAL_FETCHED_AT = 0;
var CLIENT_PORTAL_STALE_MS = 60000;

function refreshClientPortalSilently() {

// Snapshot bertahan lintas tab/restart supaya login berikutnya langsung tergambar.
var CLIENT_PORTAL_CACHE_MAX_AGE_MS = 604800000;
var _clientPortalStore = undefined;

function getClientPortalStore_() {
  if (_clientPortalStore !== undefined) return _clientPortalStore;
  _clientPortalStore = null;
  try {
    window.localStorage.setItem('fa_probe', '1');
    window.localStorage.removeItem('fa_probe');
    _clientPortalStore = window.localStorage;
  } catch (e) {
    try { _clientPortalStore = window.sessionStorage; } catch (e2) {}
  }
  return _clientPortalStore;
}

function persistClientPortalCache(res) {
  var store = getClientPortalStore_();
  if (!store) return;
  try {
    store.setItem(CLIENT_PORTAL_CACHE_KEY, JSON.stringify({
      email: (res && res.email) || _opsInternalEmail || '',
      savedAt: Date.now(),
      payload: {
        success: true,
        email: (res && res.email) || _opsInternalEmail || '',
        name: (res && res.name) || _opsInternalName || '',
        projects: (res && res.projects) || [],
        project: (res && res.project) || null
      }
    }));
  } catch (e) {}
}

function clearClientPortalCache() {
  try { sessionStorage.removeItem(CLIENT_PORTAL_CACHE_KEY); } catch (e) {}
  try { localStorage.removeItem(CLIENT_PORTAL_CACHE_KEY); } catch (e) {}
}

function hydrateClientPortalFromCache() {
  var store = getClientPortalStore_();
  if (!store) return false;
  try {
    var raw = store.getItem(CLIENT_PORTAL_CACHE_KEY);
    if (!raw) return false;
    var parsed = JSON.parse(raw);
    if (!parsed || !parsed.payload) return false;
    if (parsed.email && _opsInternalEmail && parsed.email !== _opsInternalEmail) {
      clearClientPortalCache();
      return false;
    }
    if (parsed.savedAt && Date.now() - parsed.savedAt > CLIENT_PORTAL_CACHE_MAX_AGE_MS) {
      clearClientPortalCache();
      return false;
    }
    showClientPortalDashboardNow(parsed.payload, true);
    return true;
  } catch (e) {
    return false;
  }
}

function openClientPortalFromSession() {
  if (!_opsInternalCredential) {
    toggleOperationShell(false);
    selectOperationAccess('login');
    return;
  }
  // Data sudah datang dari server di sesi ini (bundel login / restore) → cukup render.
  if (CLIENT_PORTAL_SERVER_FRESH && CLIENT_PORTAL_STATE.email) {
    CLIENT_PORTAL_STATE.loading = false;
    toggleOperationShell(false);
    selectOperationAccess('client');
    if (typeof updateAuthNavLabel === 'function') updateAuthNavLabel();
    if (Date.now() - CLIENT_PORTAL_FETCHED_AT > CLIENT_PORTAL_STALE_MS) refreshClientPortalSilently();
    return;
  }
  // Snapshot terakhir tampil dulu, server dipanggil untuk menyegarkan.
  var hadCache = hydrateClientPortalFromCache();
  if (!hadCache) {
    // Tanpa snapshot, shell tetap dibuka seketika dengan skeleton — jauh lebih
    // cepat terasa dibanding menahan layar login di balik overlay penuh.
    CLIENT_PORTAL_STATE.loading = true;
    toggleOperationShell(false);
    selectOperationAccess('client');
    if (typeof updateAuthNavLabel === 'function') updateAuthNavLabel();
  }
  var portalStartedAt = Date.now();
  google.script.run
    .withSuccessHandler(function(res) {
      CLIENT_PORTAL_STATE.loading = false;
      try { console.log('[portal] fetch ' + (Date.now() - portalStartedAt) + 'ms'); } catch (e) {}
      if (!res || !res.success) {
        if (hadCache) return;
        showToast('Portal Gagal', (res && res.error) || 'Dashboard client tidak bisa dimuat.', 'warning');
        // Jangan tendang balik ke Sign In kalau kredensial sudah valid —
        // tampilkan shell portal kosong supaya terasa login berhasil.
        if (_opsInternalCredential) {
          showClientPortalDashboardNow({
            success: true,
            email: _opsInternalEmail || '',
            name: _opsInternalName || '',
            projects: [],
            project: null
          });
          return;
        }
        selectOperationAccess('login');
        return;
      }
      showClientPortalDashboardNow(res);
    })
    .withFailureHandler(function(err) {
      CLIENT_PORTAL_STATE.loading = false;
      if (hadCache) return;
      showToast('Error', err.message, 'warning');
      if (typeof renderClientPortalHome === 'function') renderClientPortalHome();
    })
    .getClientPortalForSession(_opsInternalCredential);
}

  CLIENT_PORTAL_STATE.project = res.project || CLIENT_PORTAL_STATE.projects[0] || null;
  if (!fromCache) {
    persistClientPortalCache(res);

function setOperationDataLoading(isLoading, source) {
  var analyticsBtn = document.getElementById('analytics-refresh-btn');
  var analyticsTextBtn = document.querySelector('.ops-refresh-cta--text');

  var syncBtn = document.getElementById('sync-btn');
  var payBtn = document.getElementById('pay-sync-btn');
  if (analyticsBtn) {
    analyticsBtn.disabled = isLoading;
    analyticsBtn.setAttribute('aria-busy', isLoading ? 'true' : 'false');
  }
  if (analyticsTextBtn) {
    analyticsTextBtn.disabled = isLoading;
    if (!analyticsTextBtn.dataset.defaultLabel) {
      analyticsTextBtn.dataset.defaultLabel = analyticsTextBtn.textContent.trim() || 'Refresh';
    }
    analyticsTextBtn.textContent = (isLoading && (source === 'analytics' || source === 'all'))
      ? 'Refreshing...'
      : analyticsTextBtn.dataset.defaultLabel;
  }
  if (exportBtn) {
    exportBtn.disabled = isLoading;
    exportBtn.textContent = isLoading ? 'Menyiapkan...' : 'Download';
  }
  if (syncBtn) {
    syncBtn.disabled = isLoading;
    var syncLabel = (isLoading && source === 'leads') ? 'Syncing...' : 'Sync';
    syncBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15.5-6.4"/><path d="M3 4v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.4"/><path d="M21 20v-5h-5"/></svg><span>'+syncLabel+'</span>';
  }
  if (payBtn) {
    payBtn.disabled = isLoading;
    var payLabel = (isLoading && source === 'payments') ? 'Syncing...' : 'Sync';
    payBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15.5-6.4"/><path d="M3 4v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.4"/><path d="M21 20v-5h-5"/></svg><span>'+payLabel+'</span>';
  }
}

function formatClientSyncLabel(message) {
  var raw = String(message || '').trim();
  if (!raw) return 'Sinkron —';
  var timeMatch = raw.match(/(\d{1,2}[.:]\d{2})(?::\d{2})?/);
  if (/sinkron|sync/i.test(raw) && timeMatch) return 'Sinkron ' + timeMatch[1].replace(':', '.');
  if (/menyegarkan|refresh/i.test(raw)) return 'Menyegarkan…';
  if (/gagal|error|timeout/i.test(raw)) return 'Sync gagal';
  return raw.length > 28 ? raw.slice(0, 28) + '…' : raw;
}

function updateOperationSyncInfo(message) {
  OPS_LAST_SYNC_LABEL = message || OPS_LAST_SYNC_LABEL;
  if (document.getElementById('sync-info')) document.getElementById('sync-info').textContent = formatClientSyncLabel(OPS_LAST_SYNC_LABEL);
  if (document.getElementById('pay-sync-info')) document.getElementById('pay-sync-info').textContent = formatClientSyncLabel(OPS_LAST_SYNC_LABEL);
  if (document.getElementById('analytics-sync-info')) {
    document.getElementById('analytics-sync-info').textContent = OPS_LAST_SYNC_LABEL + ' · ' + LEADS.length + ' leads · ' + PAYMENT_CLIENTS.length + ' payment rows';
  }

function loadProductionOpsData(options, onDone) {
  options = options || {};
  var loadId = ++OPS_DATA_LOAD_ID;
  var usedOverlay = !!options.showLoading;
  if (usedOverlay) beginOpsOverlay_();
  setOperationDataLoading(true, 'leads');

  function finishLoad() {
    if (usedOverlay) endOpsOverlay_();
    setOperationDataLoading(false, 'leads');
    if (typeof onDone === 'function') onDone();
  }

  var runner = google.script.run
    .withSuccessHandler(function(rawRes) {
      if (loadId !== OPS_DATA_LOAD_ID) {
        if (usedOverlay) endOpsOverlay_();
        return;
      }
      var res = unpackServerPayload(rawRes);
      if (res && res.success) {
        LEADS = normalizeLeadList(res.leads || []);
        DEPT_FOLDER_MAP = res.deptFolderMap || {};
        if (res.opsFolderCatalog) {
          Object.keys(res.opsFolderCatalog).forEach(function(pid) {
            var catalog = res.opsFolderCatalog[pid] || [];
            var map = {};
            catalog.forEach(function(folder) {
              if (folder && folder.id) map[folder.id] = folder.url;
            });
            storeOpsFolderCatalog(pid, catalog, map);
          });
        }
        OPS_DATA_READY = true;
        OPS_DATA_SERVER_FRESH = true;
        persistOpsDataCache(res);
        var now = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        updateOperationSyncInfo('Production Ops sinkron: ' + now);
      } else {
        updateOperationSyncInfo('Sync gagal · memakai data terakhir');
        showToast('Sync Data Gagal', (res && res.error) || 'Data Production Ops tidak bisa dimuat.', 'warning');
      }
      renderProductionOpsView();
      finishLoad();
    })
    .withFailureHandler(function(err) {
      if (loadId !== OPS_DATA_LOAD_ID) {
        if (usedOverlay) endOpsOverlay_();
        return;
      }
      updateOperationSyncInfo('Sync gagal · memakai data terakhir');
      renderProductionOpsView();
      finishLoad();
      showToast('Sync Error', (err && err.message) || 'Gagal memuat Production Ops.', 'warning');
    });
  if (options.force) runner.getProductionOpsDataFreshPacked(getInternalPayKey());
  else runner.getProductionOpsDataPacked(getInternalPayKey());
}

// true = data di memori berasal dari server pada sesi ini (bukan snapshot lama),
// jadi tidak perlu refresh ulang saat masuk dashboard.
var OPS_DATA_SERVER_FRESH = false;

function applyOperationDataPayload(res) {
  LEADS = normalizeLeadList(res.leads || []);
  LAST_PAYMENT_MAP = res.paymentMap || {};
  DEPT_FOLDER_MAP = res.deptFolderMap || {};
  if (res.opsFolderCatalog) {
    Object.keys(res.opsFolderCatalog).forEach(function(pid) {
      var catalog = res.opsFolderCatalog[pid] || [];
      var map = {};
      catalog.forEach(function(folder) {
        if (folder && folder.id) map[folder.id] = folder.url;
      });
      storeOpsFolderCatalog(pid, catalog, map);
    });
  }
  applyApprovalsFromServer(res);
  PAYMENT_CLIENTS = buildPaymentClientsFromLeads(LEADS, LAST_PAYMENT_MAP);
  OPS_DATA_READY = true;
}

function persistOpsDataCache(res) {
  try {
    sessionStorage.setItem(OPS_DATA_CACHE_KEY, JSON.stringify({
      email: _opsInternalEmail || '',
      savedAt: Date.now(),
      payload: {
        success: true,
        leads: res.leads || [],
        paymentMap: res.paymentMap || {},
        deptFolderMap: res.deptFolderMap || {},
        opsFolderCatalog: res.opsFolderCatalog || {},
        pendingApprovals: res.pendingApprovals || [],
        rejectedApprovals: res.rejectedApprovals || [],
        notifications: res.notifications || []
      }
    }));
  } catch (e) {}
}

function clearOpsDataCache() {
  try { sessionStorage.removeItem(OPS_DATA_CACHE_KEY); } catch (e) {}
}

/** Sinkronkan perubahan payment ke LAST_PAYMENT_MAP (sumber rebuild PAYMENT_CLIENTS). */
function patchLastPaymentMapEntry(projectId, patch) {
  projectId = String(projectId || '').trim();
  if (!projectId || !patch) return;
  LAST_PAYMENT_MAP = LAST_PAYMENT_MAP || {};
  var bare = projectId.replace(/^#/, '');
  [projectId, bare, '#' + bare].forEach(function(key) {
    if (!key) return;
    var prev = LAST_PAYMENT_MAP[key] || {};
    LAST_PAYMENT_MAP[key] = Object.assign({}, prev, patch);
  });
}

function persistCurrentOpsDataCache() {
  persistOpsDataCache({
    leads: LEADS,
    paymentMap: LAST_PAYMENT_MAP,
    deptFolderMap: DEPT_FOLDER_MAP,
    pendingApprovals: PENDING_APPROVALS,
    rejectedApprovals: REJECTED_APPROVALS,
    notifications: OPS_NOTIFICATIONS
  });
}

/** Terapkan hasil approve/invoice langsung ke memori + cache browser. */
function applyValidatedPaymentLocally(res, extras) {
  extras = extras || {};
  if (!res || !res.projectId) return;
  var projectId = res.projectId;
  var prev = lookupPaymentInMap(LAST_PAYMENT_MAP, projectId);
  var nextInvoiceCount = extras.invoiceCount != null
    ? Number(extras.invoiceCount)
    : (Number(prev.invoiceCount) || 0) + 1;
  patchLastPaymentMapEntry(projectId, {
    paymentId: res.paymentId || prev.paymentId || '',
    paymentStatus: res.paymentStatus || extras.paymentStatus || prev.paymentStatus || 'PAYMENT AWAL',
    amount: res.totalPaid,
    totalPaid: res.totalPaid,
    lastAmount: res.lastAmount,
    projectTotal: res.projectTotal !== undefined && res.projectTotal !== ''
      ? res.projectTotal
      : (prev.projectTotal || ''),
    remainingAmount: res.remainingAmount !== undefined ? res.remainingAmount : prev.remainingAmount,
    paymentMethod: extras.paymentMethod || prev.paymentMethod || '',
    invoiceNumber: res.invoiceNumber || prev.invoiceNumber || '',
    invoiceUrl: res.invoiceUrl || prev.invoiceUrl || '',
    invoiceCount: nextInvoiceCount
  });

  var approvalId = res.approvalId || extras.approvalId || '';
  PENDING_APPROVALS = (PENDING_APPROVALS || []).filter(function(a) {
    if (approvalId && a.approvalId === approvalId) return false;
    return !sameProjectIdClient(a.projectId, projectId);
  });
  REJECTED_APPROVALS = (REJECTED_APPROVALS || []).filter(function(a) {
    return !sameProjectIdClient(a.projectId, projectId);
  });

  PAYMENT_CLIENTS = buildPaymentClientsFromLeads(LEADS, LAST_PAYMENT_MAP);
  OPS_NOTIFICATIONS = buildLocalOpsNotifications();
  delete PROJECT_TIMELINES[projectId];
  delete PROJECT_TIMELINES[String(projectId).replace(/^#/, '')];
  delete PROJECT_TIMELINES['#' + String(projectId).replace(/^#/, '')];
  if (projectDetailId && sameProjectIdClient(projectDetailId, projectId)) {
    renderProjectDetail(projectDetailId, true);
    if (isActivityLogGateOpen(projectDetailId)) loadProjectTimeline(projectDetailId, true);
  }
  renderOperationDataViews();
  renderApprovalBell();
  persistCurrentOpsDataCache();
}

/** Render langsung dari snapshot terakhir supaya dashboard tidak kosong saat menunggu server. */
function hydrateOpsDataFromCache() {
  if (OPS_DATA_READY) return true;
  try {
    var raw = sessionStorage.getItem(OPS_DATA_CACHE_KEY);
    if (!raw) return false;
    var parsed = JSON.parse(raw);
    if (!parsed || !parsed.payload) return false;
    if (parsed.email && _opsInternalEmail && parsed.email !== _opsInternalEmail) {
      clearOpsDataCache();
      return false;
    }
    applyOperationDataPayload(parsed.payload);
    renderOperationDataViews();
    updateOperationSyncInfo('Menampilkan data terakhir · menyegarkan…');
    return true;
  } catch (e) {
    return false;
  }
}

function loadOperationData(options, onDone) {
  options = options || {};
  var source = options.source || 'all';
  var loadId = ++OPS_DATA_LOAD_ID;
  var scroller = document.querySelector('.ops-content');
  var prevScroll = scroller ? scroller.scrollTop : 0;
  var usedOverlay = !!options.showLoading;
  if (usedOverlay) beginOpsOverlay_();
  setOperationDataLoading(true, source);

  function finishLoad() {
    if (usedOverlay) endOpsOverlay_();
    setOperationDataLoading(false, source);
    if (scroller && !options.resetScroll) scroller.scrollTop = prevScroll;
    if (typeof onDone === 'function') onDone();
  }

  var fetchStartedAt = Date.now();
  var runner = google.script.run
    .withSuccessHandler(function(rawRes) {
      var res = unpackServerPayload(rawRes);
      try {
        console.log('[opsData] round-trip ' + (Date.now() - fetchStartedAt) + 'ms'
          + ' · server ' + (res && res.buildMs !== undefined ? res.buildMs + 'ms' : 'n/a')
          + ' · ' + (res && res.fromCache ? 'cache hit' : 'rebuild')
          + ' · ' + (typeof rawRes === 'string' ? Math.round(rawRes.length / 1024) + 'KB' : 'objek'));
      } catch (e) {}
      if (loadId !== OPS_DATA_LOAD_ID) {
        // Request supersede — tetap lepas overlay milik request ini.
        if (usedOverlay) endOpsOverlay_();
        return;
      }
      if (res && res.success) {
        applyOperationDataPayload(res);
        persistOpsDataCache(res);
        OPS_DATA_SERVER_FRESH = true;
        var now = new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
        updateOperationSyncInfo('Data sinkron: ' + now);
      } else {
        if (!PAYMENT_CLIENTS.length) PAYMENT_CLIENTS = buildPaymentClientsFromLeads(LEADS, {});
        updateOperationSyncInfo('Sync gagal · memakai data terakhir');
        var syncErr = (res && res.error) ? String(res.error)
          : (res ? 'Server menolak sync (success=false).' : 'Tidak ada respons dari server.');
        showToast('Sync Data Gagal', syncErr, 'warning');
        // Fallback ringan: tetap refresh antrean approval (penting untuk Direktur).
        try { refreshPendingApprovals(); } catch (e) {}
      }
      renderOperationDataViews();
      finishLoad();
    })
    .withFailureHandler(function(err) {
      if (loadId !== OPS_DATA_LOAD_ID) {
        if (usedOverlay) endOpsOverlay_();
        return;
      }
      updateOperationSyncInfo('Sync gagal · memakai data terakhir');
      renderOperationDataViews();
      finishLoad();
      var failMsg = (err && err.message) ? String(err.message) : 'Koneksi ke server gagal.';
      if (/timed out|timeout|exceeded/i.test(failMsg)) {
        failMsg = 'Sync timeout — data terlalu berat atau server sibuk. Coba Refresh lagi.';
      }
      showToast('Sync Error', failMsg, 'warning');
      try { refreshPendingApprovals(); } catch (e) {}
    });
  if (options.force) runner.getOperationDataFreshPacked(getInternalPayKey());
  else runner.getOperationDataPacked(getInternalPayKey());
}

// Pakai data yang sudah ada (render instan saat pindah menu),
// hanya fetch ke server bila belum pernah dimuat.
// Overlay penuh HANYA untuk first paint kosong (belum ada snapshot).
function ensureOperationData(options, onDone) {
  options = options || {};
  if (OPS_DATA_READY) {
    if (options.productionOpsOnly) renderProductionOpsView();
    else renderOperationDataViews();
    if (typeof onDone === 'function') onDone();
    return;
  }
  if (hydrateOpsDataFromCache()) {
    if (options.productionOpsOnly) renderProductionOpsView();
    if (typeof onDone === 'function') onDone();
    // Data lama sudah tampil → segarkan tanpa overlay.
    if (options.productionOpsOnly) loadProductionOpsData({ showLoading: false });
    else loadOperationData({ source: options.source || 'all', showLoading: false });
    return;
  }
  var opts = Object.assign({}, options);
  if (opts.showLoading == null) opts.showLoading = true;
  if (opts.productionOpsOnly) loadProductionOpsData(opts, onDone);
  else loadOperationData(opts, onDone);
}

function initLeadsView() {
  if (!OPS_DATA_READY) {
    ensureOperationData({ source: 'leads' });
    return;
  }
  
  renderOperationDataViews();
  // Booking baru mungkin sudah masuk sheet/notif tapi belum di memori lokal.
  loadOperationData({ source: 'leads', showLoading: false, force: true });
}

function getClientInitials(name) {
  var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length >= 2) {
    return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
  }
  return parts[0].slice(0, 2).toUpperCase();
}

function capitalizePicName(pic) {
  return String(pic || '—').trim().replace(/\b([a-zA-ZÀ-ÿ])/g, function(ch) {

function formatLeadShootingLabel(lead) {
  lead = lead || {};
  var label = String(lead.shootingDateLabel || '').trim();
  if (!label && lead.shootingStartDate && typeof formatShootingDateLabel === 'function') {
    var start = String(lead.shootingStartDate);
    if (start.length >= 10 && /^\d{4}-\d{2}-\d{2}/.test(start)) start = start.slice(0, 10);
    else if (typeof toIsoDateLocal === 'function') {
      var parsed = new Date(lead.shootingStartDate);
      start = isNaN(parsed.getTime()) ? '' : toIsoDateLocal(parsed);
    }
    if (start) label = formatShootingDateLabel(start, Number(lead.shootingDays || 1) || 1);
  }
  if (!label) return 'Belum diisi';
  if (lead.shootingReleasedAt) return label + ' · dilepas';
  return label;
}

function opsMotionEnabled() {
  try {
    return !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) {
    return true;
  }
}

function animateWidthBars(container, selector) {
  if (!container || !opsMotionEnabled()) return;
  var els = container.querySelectorAll(selector || '[data-target-width]');
  els.forEach(function(el, i) {
    var target = el.getAttribute('data-target-width') || '0%';
    el.style.width = '0%';
    requestAnimationFrame(function() {
      el.style.transition = 'width .85s cubic-bezier(.22,1,.36,1) ' + (0.1 + i * 0.08) + 's';
      el.style.width = target;
    });
  });
}

function animateDonutChart(container) {
  if (!container || !opsMotionEnabled()) return;
  container.querySelectorAll('.analytics-donut-seg').forEach(function(c, i) {
    var len = parseFloat(c.getAttribute('data-len') || '0');
    var gap = parseFloat(c.getAttribute('data-gap') || '0');
    var total = len + gap;
    c.style.strokeDasharray = '0 ' + total;
    requestAnimationFrame(function() {
      c.style.transition = 'stroke-dasharray .9s cubic-bezier(.22,1,.36,1) ' + (0.08 + i * 0.1) + 's';
      c.style.strokeDasharray = len + ' ' + gap;
    });
  });
  var center = container.querySelector('.analytics-donut-center');
  if (center) {
    center.style.opacity = '0';
    center.style.transform = 'scale(.9)';
    requestAnimationFrame(function() {
      center.style.transition = 'opacity .45s ease .32s, transform .45s cubic-bezier(.22,1,.36,1) .32s';
      center.style.opacity = '1';
      center.style.transform = 'scale(1)';
    });
  }
}

function replayProjectDetailAnimation(card, keepScroll) {
  if (!card) return;
  if (!keepScroll && opsMotionEnabled()) {
    card.classList.remove('pd-animate-in');
    void card.offsetWidth;
    card.classList.add('pd-animate-in');
    animateWidthBars(card, '.pd-progress-fill[data-target-width]');
    return;
  }
  card.querySelectorAll('.pd-progress-fill[data-target-width]').forEach(function(el) {
    el.style.width = el.getAttribute('data-target-width') || '0%';
  });
}

function renderTimelineItems(projectId) {
  var cached = PROJECT_TIMELINES[projectId];
  if (cached === undefined || cached === null) {
    return '<div class="pd-log-empty">Memuat activity log...</div>';
  }
  if (!cached.length) {
    return '<div class="pd-log-empty">Belum ada activity log untuk project ini.</div>';
  }
  return cached.map(function(item) {
    var meta = [];
    if (item.timestamp) meta.push(item.timestamp);
    if (item.actor) meta.push('oleh '+item.actor);
    return '<div class="timeline-item">'
      +'<div class="timeline-dot"></div>'
      +'<div class="timeline-title">'+escapeHtml(item.title || 'Activity')+'</div>'
      +'<div class="timeline-desc">'+escapeHtml(item.description || '—')+'</div>'
      +'<div class="timeline-meta">'+escapeHtml(meta.join(' · ') || item.type || '')+'</div>'
      +(item.notes ? '<div class="timeline-note">'+escapeHtml(item.notes)+'</div>' : '')
      +'</div>';
  }).join('');
}

var ACTIVITY_LOG_OPEN_ID = '';

function isActivityLogGateOpen(projectId) {
  var overlay = document.getElementById('pd-log-overlay');
  return !!(overlay && overlay.classList.contains('open') && sameProjectIdClient(ACTIVITY_LOG_OPEN_ID, projectId));
}

function renderActivityLogBody(projectId) {
  var body = document.getElementById('pd-log-body');
  if (!body) return;
  body.innerHTML = '<div class="project-timeline">'+renderTimelineItems(projectId)+'</div>';
}

function loadProjectTimeline(projectId, force) {
  if (!projectId) return;
  if (!force && Array.isArray(PROJECT_TIMELINES[projectId])) {
    if (isActivityLogGateOpen(projectId)) renderActivityLogBody(projectId);
    return;
  }
  PROJECT_TIMELINES[projectId] = null;
  if (isActivityLogGateOpen(projectId)) renderActivityLogBody(projectId);
  google.script.run
    .withSuccessHandler(function(res) {
      PROJECT_TIMELINES[projectId] = (res && res.success && res.timeline) ? res.timeline : [];
      if (isActivityLogGateOpen(projectId)) renderActivityLogBody(projectId);
    })
    .withFailureHandler(function() {
      PROJECT_TIMELINES[projectId] = [];
      if (isActivityLogGateOpen(projectId)) renderActivityLogBody(projectId);
    })
    .getProjectTimeline(getInternalPayKey(), projectId);
}

function openActivityLogGate(projectId) {
  ACTIVITY_LOG_OPEN_ID = projectId;
  var overlay = document.getElementById('pd-log-overlay');
  var title = document.getElementById('pd-log-title');
  var subtitle = document.getElementById('pd-log-subtitle');
  var lead = LEADS.find(function(l){ return sameProjectIdClient(l.id, projectId); });
  if (title) title.textContent = (lead && lead.client) ? lead.client : 'Riwayat project';
  if (subtitle) subtitle.textContent = String(projectId || '') + ' · dimuat saat gate dibuka';
  if (overlay) overlay.classList.add('open');
  renderActivityLogBody(projectId);
  loadProjectTimeline(projectId, !Array.isArray(PROJECT_TIMELINES[projectId]));
}

function closeActivityLogGate() {
  ACTIVITY_LOG_OPEN_ID = '';
  var overlay = document.getElementById('pd-log-overlay');
  if (overlay) overlay.classList.remove('open');
}

function openProjectDetail(projectId) {
  projectDetailId = projectId;
  closeActivityLogGate();
  renderLeads();
  renderProjectDetail(projectId);
  // Activity log tidak di-fetch di sini — hanya saat gate dibuka.

  var lead = LEADS.find(function(l) { return sameProjectIdClient(l.id, projectId); });
  if (!lead) {
    loadOperationData({ source: 'all', force: true, showLoading: false }, function() {
      if (projectDetailId !== projectId) return;
      renderLeads();
      renderProjectDetail(projectId, true);
    });
    return;
  }

  if (!OPS_DATA_READY || !PAYMENT_CLIENTS.length) {
    loadOperationData({ source: 'all' }, function() {
      if (projectDetailId === projectId) renderProjectDetail(projectId, true);
    });
  }
}

function renderProjectDetail(projectId, keepScroll) {

    card.classList.remove('show');

  var row = document.getElementById('row-'+leadId.replace('#',''));
  if (!row) return;

  if (!statusCell) return;
  var opts = ALL_STATUSES.map(function(s){
    return '<option value="'+escapeHtml(s)+'"'+(s===lead.status?' selected':'')+'>'+escapeHtml(s)+'</option>';
  }).join('');
  statusCell.innerHTML = '<select class="status-select" style="background:'+cfg.bg+';color:'+cfg.color+';border:1px solid '+cfg.border+'" onchange="saveStatus(\''+escapeJs(leadId)+'\',this.value)" onblur="if(!savingId)renderLeads()">'+opts+'</select>';
  statusCell.querySelector('select').focus();
}

function saveStatus(leadId, newStatus) {
  var lead = LEADS.find(function(l){ return l.id === leadId; });
  var prevStatus = lead ? lead.status : null;
  if (lead && String(lead.status || '') === String(newStatus || '')) {
    renderLeads();
    return;
  }

  // Optimistic UI: update lokal dulu agar tidak menunggu roundtrip Sheets
  if (lead) lead.status = newStatus;
  savingId = leadId;
  renderStatsBar();
  renderLeads();

  google.script.run
    .withSuccessHandler(function(res) {
      savingId = null;
      if (res && res.success) {
        if (lead) lead.status = res.newStatus || newStatus;
        delete PROJECT_TIMELINES[leadId];
        renderStatsBar();
        renderLeads();
        if (!res.unchanged) {
          showToast('Status Tersimpan', leadId+' → '+(res.newStatus || newStatus)+'.');
          // Folder Drive + email client dikerjakan setelah UI lepas, biar tidak menahan.
          finishLeadStatusChange(leadId, res.oldStatus, res.newStatus || newStatus);
        }
        if (projectDetailId === leadId) {
          renderProjectDetail(leadId, true);
          if (isActivityLogGateOpen(leadId)) loadProjectTimeline(leadId, true);
        }
      } else {
        if (lead && prevStatus !== null) lead.status = prevStatus;
        showToast('Error', (res && res.error) || 'Gagal menyimpan status.', 'warning');
        renderStatsBar();
        renderLeads();
      }
    })
    .withFailureHandler(function(err) {
      savingId = null;
      if (lead && prevStatus !== null) lead.status = prevStatus;
      showToast('Error', err.message, 'warning');
      renderStatsBar();
      renderLeads();
    })
    .updateLeadStatusWithHistory(getInternalPayKey(), leadId, newStatus, '', true);
}

// Efek samping status (buat folder Drive saat Deal + notifikasi email) berjalan di
// belakang layar; hasilnya cuma dipakai untuk update link Drive dan toast.
function finishLeadStatusChange(leadId, oldStatus, newStatus) {
  var isDeal = String(newStatus || '').toLowerCase() === 'deal';
  if (isDeal) showToast('Menyiapkan Drive', 'Folder Drive untuk '+leadId+' sedang dibuat di latar belakang.');
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) return;
      var lead = LEADS.find(function(l){ return l.id === leadId; });
      if (lead && res.folderUrl) {
        lead.driveUrl = res.folderUrl;
        lead.notes = 'Folder Drive dibuat: ' + res.folderUrl;
        renderLeads();
        if (projectDetailId === leadId) renderProjectDetail(leadId, true);
      }
      if (res.folderUrl) {
        var aclNote = res.folderAclOk === false
          ? ' Perhatian: ACL Drive gagal — cek setup folder.'
          : ' Akses klien dibuka setelah Production Ops 100% dan payment Lunas.';
        showToast('Folder Drive Siap', leadId+' punya folder Drive untuk tim FA.' + aclNote);
      } else if (res.clientEmailSent) {
        showToast('Email Terkirim', 'Update status '+leadId+' dikirim ke '+(res.clientEmail || 'client')+'.');
      }
    })
    .withFailureHandler(function() {})
    .finishLeadStatusChange(getInternalPayKey(), leadId, oldStatus || '', newStatus, '');
}
