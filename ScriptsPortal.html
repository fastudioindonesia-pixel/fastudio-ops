<script>
function selectOperationAccess(mode) {
  var login = document.getElementById('ops-login-panel');
  var client = document.getElementById('ops-client-access-panel');
  var gate = document.getElementById('ops-access-gate');
  if (login) login.classList.toggle('active', mode !== 'client');
  if (client) client.classList.toggle('active', mode === 'client');
  if (gate) gate.classList.toggle('is-client-shell', mode === 'client');
  if (mode !== 'client' && typeof syncAuthBrandLogos === 'function') syncAuthBrandLogos();
  if (mode === 'client') {
    showClientPortalDashboard(true);
    if (typeof renderClientPortalHome === 'function') renderClientPortalHome();
    else if (CLIENT_PORTAL_STATE.project) renderClientPortalDashboard(CLIENT_PORTAL_STATE.project);
  }
}

function normalizeClientProjectId(value) {
  var id = String(value || '').trim().replace(/\s+/g, '').toUpperCase();
  if (!id) return '';
  return id.charAt(0) === '#' ? id : '#'+id;
}

function setClientPortalStatus(message, ok) {
  var el = document.getElementById('cp-status');
  if (!el) return;
  el.textContent = message || '';
  el.className = 'client-portal-status ' + (ok ? 'ok' : 'warn');
}

function resetClientPortalOtpState() {
  CLIENT_PORTAL_STATE.otpSent = false;
  var otpEl = document.getElementById('cp-otp');
  if (otpEl) otpEl.value = '';
}

function showClientPortalDashboard(showDashboard) {
  var login = document.getElementById('cp-login-card');
  var dashboard = document.getElementById('cp-dashboard-card');
  if (login) login.style.display = showDashboard ? 'none' : '';
  if (dashboard) dashboard.classList.toggle('show', !!showDashboard);
}

function sendClientPortalOtpRequest() {
  var projectEl = document.getElementById('cp-project-id');
  var emailEl = document.getElementById('cp-email');
  if (!projectEl || !emailEl) return;
  var projectId = normalizeClientProjectId(projectEl.value);
  var email = String(emailEl.value || '').trim().toLowerCase();
  if (!projectId || !email) {
    setClientPortalStatus('Project ID dan email booking wajib diisi.', false);
    return;
  }
  showLoading();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res.success) {
        CLIENT_PORTAL_STATE.otpSent = true;
        setClientPortalStatus('OTP tracking dikirim ke '+email+'. Cek inbox atau spam.', true);
        showToast('OTP Terkirim', 'Kode tracking dikirim ke email booking.');
      } else {
        setClientPortalStatus(res.error || 'OTP gagal dikirim.', false);
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      setClientPortalStatus(err.message, false);
    })
    .sendClientPortalOtp(projectId, email);
}

function verifyClientPortalOtpSubmit() {
  var projectEl = document.getElementById('cp-project-id');
  var emailEl = document.getElementById('cp-email');
  var otpEl = document.getElementById('cp-otp');
  if (!projectEl || !emailEl || !otpEl) return;
  var projectId = normalizeClientProjectId(projectEl.value);
  var email = String(emailEl.value || '').trim().toLowerCase();
  var otp = String(otpEl.value || '').trim();
  if (!projectId || !email || !otp) {
    setClientPortalStatus('Project ID, email, dan OTP wajib diisi.', false);
    return;
  }
  showLoading();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res.success) {
        CLIENT_PORTAL_STATE.email = email;
        CLIENT_PORTAL_STATE.sessionToken = res.sessionToken || "";
        loadClientPortalProject(res.project);
        persistClientPortalSession();
        setClientPortalStatus('Akses diterima. Data tracking berhasil dimuat.', true);
        showToast('Portal Terbuka', 'Tracking project '+projectId+' berhasil dimuat.');
      } else {
        setClientPortalStatus(res.error || 'OTP tidak valid.', false);
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      setClientPortalStatus(err.message, false);
    })
    .verifyClientPortalOtp(projectId, email, otp);
}

function loadClientPortalProject(project) {
  CLIENT_PORTAL_STATE.project = project || null;
  showClientPortalDashboard(true);
  if (typeof renderClientPortalHome === 'function') renderClientPortalHome();
  else renderClientPortalDashboard(CLIENT_PORTAL_STATE.project);
}

function selectClientPortalProject(projectId) {
  var projects = CLIENT_PORTAL_STATE.projects || [];
  var found = null;
  for (var i = 0; i < projects.length; i++) {
    if (String(projects[i].projectId || '') === String(projectId || '')) {
      found = projects[i];
      break;
    }
  }
  CLIENT_PORTAL_STATE.project = found || projects[0] || null;
  renderClientPortalHome();
}

function getClientTimeGreeting() {
  var hour = new Date().getHours();
  if (hour < 11) return 'Selamat pagi';
  if (hour < 15) return 'Selamat siang';
  if (hour < 18) return 'Selamat sore';
  return 'Selamat malam';
}

function getClientWhatsAppHref(name, projectId, brandName) {
  var bits = ['Halo FA Studio, saya ' + String(name || 'client') + '.'];
  var brand = String(brandName || '').trim();
  var pid = String(projectId || '').trim();
  if (brand && pid) {
    bits.push('Mau follow-up dealing untuk project ' + brand + ' (' + pid + ').');
  } else if (brand) {
    bits.push('Mau follow-up dealing untuk project ' + brand + '.');
  } else if (pid) {
    bits.push('Mau follow-up dealing untuk project ' + pid + '.');
  } else {
    bits.push('Mau tanya soal booking project.');
  }
  return 'https://wa.me/6282174181369?text=' + encodeURIComponent(bits.join(' '));
}

function isClientNewLeadStatus(status) {
  var s = String(status || '').trim();
  return s === 'New Lead' || s === 'New Approach';
}

function getClientNextAction(project) {
  if (!project) {
    return 'Akun sudah aktif. Isi Booking Now, lalu project akan muncul di dashboard ini.';
  }
  var status = String(project.status || '');
  var drive = project.driveGate || {};
  if (project.driveUnlocked) return 'Folder Drive sudah terbuka. File project bisa diunduh dari tombol di bawah.';
  if (drive.productionReady && !drive.paymentReady) return 'Produksi sudah 100%. Drive terbuka setelah payment Lunas.';
  if (!drive.productionReady && drive.paymentReady) return 'Pembayaran sudah Lunas. Drive terbuka setelah produksi 100%.';
  if (status === 'On Hold') return 'Project sedang On Hold. Hubungi tim FA jika perlu update.';
  if (isClientNewLeadStatus(status)) {
    return 'Booking sudah diterima. Officer FA Studio akan menghubungi untuk dealing — biasanya dalam 1×24 jam kerja.';
  }
  if (status === 'Done') return 'Project selesai. Drive terbuka setelah produksi 100% dan payment Lunas.';
  return 'Pantau progress produksi dan sisa pembayaran di dashboard ini.';
}

        + '<li class="cp-wait-step"><span class="cp-wait-step-dot" aria-hidden="true"></span><div><strong>Status Deal</strong><em>Progress produksi &amp; pembayaran aktif di sini</em></div></li>'

      + '</div>'

}

function buildClientPortalShortcutsHtml(name) {
  return '';
}

/** Hitung ulang status jadwal shooting di sisi client — tanpa request tambahan. */
function getClientShootingCountdown(shooting) {
  shooting = shooting || {};
  if (shooting.released) {
    return { label: 'Dilepas', tone: 'is-tone-released', phase: 'released', done: true };
  }
  var today = (typeof todayIsoLocal === 'function')
    ? todayIsoLocal()
    : (function() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      })();
  var start = String(shooting.startDate || '');
  var end = String(shooting.endDate || start);
  if (!today || !start) return { label: 'Terjadwal', tone: 'is-tone-info', phase: 'upcoming', done: false };
  if (today > end) return { label: 'Selesai', tone: 'is-tone-done', phase: 'done', done: true };
  if (today >= start) return { label: 'Sedang berjalan', tone: 'is-tone-live', phase: 'live', done: false };
  var startDate = (typeof parseIsoDateLocal === 'function') ? parseIsoDateLocal(start) : null;
  var todayDate = (typeof parseIsoDateLocal === 'function') ? parseIsoDateLocal(today) : null;
  if (!startDate || !todayDate) return { label: 'Terjadwal', tone: 'is-tone-info', phase: 'upcoming', done: false };
  var diff = Math.round((startDate.getTime() - todayDate.getTime()) / 86400000);
  return {
    label: diff === 1 ? 'Besok' : 'H-' + diff,
    tone: 'is-tone-info',
    phase: 'upcoming',
    done: false,
    daysUntil: diff
  };
}

function getClientShootingPhase(project) {
  var shooting = (project && project.shooting) || {};
  if (!shooting.hasSchedule) return { phase: 'none', done: false, label: '', tone: '' };
  return getClientShootingCountdown(shooting);
}

function buildClientGlassProgressBar(progress, color) {
  progress = Math.max(0, Math.min(100, Number(progress) || 0));
  color = color || '#28b9d8';
  return '<div class="cp-glass-bar" role="progressbar" aria-valuenow="'+progress+'" aria-valuemin="0" aria-valuemax="100">'
    + '<span style="width:'+progress+'%;background:linear-gradient(90deg,'+color+'99,'+color+')"></span>'
  + '</div>';
}

function parseClientIsoParts(iso) {
  var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  var y = Number(m[1]);
  var mo = Number(m[2]) - 1;
  var d = Number(m[3]);
  var dt = new Date(y, mo, d);
  if (isNaN(dt.getTime())) return null;
  var months = ['JAN','FEB','MAR','APR','MEI','JUN','JUL','AGT','SEP','OKT','NOV','DES'];
  var days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  return { iso: m[0], dayNum: String(d), month: months[mo] || '', weekday: days[dt.getDay()] || '', date: dt };
}

function formatClientPortalDateShort(value) {
  var raw = String(value || '').trim();
  if (!raw) return '';
  var iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return Number(iso[3]) + '/' + Number(iso[2]) + '/' + iso[1];
  var dmy = raw.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if (dmy) return Number(dmy[1]) + '/' + Number(dmy[2]) + '/' + dmy[3];
  var parsed = (typeof parseOpsDate_ === 'function') ? parseOpsDate_(raw) : new Date(raw);
  if (parsed && !isNaN(parsed.getTime())) {
    return parsed.getDate() + '/' + (parsed.getMonth() + 1) + '/' + parsed.getFullYear();
  }
  return raw;
}

function buildClientShootTileHtml(parts) {
  if (!parts) return '';
  return ''
    + '<div class="cp-ov-cal-tile">'
      + '<div class="cp-ov-cal-band">'+escapeHtml(parts.month)+'</div>'
      + '<div class="cp-ov-cal-num">'+escapeHtml(parts.dayNum)+'</div>'
      + '<div class="cp-ov-cal-day">'+escapeHtml(parts.weekday)+'</div>'
    + '</div>';
}

function buildClientShootingScheduleHtml(project) {
  var shooting = (project && project.shooting) || {};
  if (!shooting.hasSchedule || !shooting.label) return '';
  var countdown = getClientShootingCountdown(shooting);
  var phase = countdown.phase || 'upcoming';
  var days = Number(shooting.days || 1);
  var start = parseClientIsoParts(shooting.startDate);
  var end = parseClientIsoParts(shooting.endDate || shooting.startDate);
  var meta = days + ' hari shooting · tanggal ini sudah dikunci untuk project kamu.';
  var note = 'Perubahan jadwal hanya bisa dilakukan lewat PIC FA Studio.';
  if (phase === 'released') {
    meta = days + ' hari shooting · tanggal ini sudah dilepas tim FA dan bisa dipakai project lain.';
    note = 'Hubungi PIC FA Studio untuk menjadwalkan ulang.';
  } else if (phase === 'done') {
    meta = 'Shooting sudah selesai. Tim FA sedang mengerjakan hasil production.';
    note = 'Pantau progress secara berkala di Production Tracker untuk update tahapan terbaru.';
  } else if (phase === 'live') {
    meta = 'Shooting sedang berlangsung · ' + days + ' hari dijadwalkan untuk project kamu.';
    note = 'Setelah shooting selesai, pantau Production Tracker untuk progress hasil.';
  }
  var statusPill = countdown.label || 'Terjadwal';
  if (statusPill === 'Sedang berjalan') statusPill = 'Sedang Berjalan';
  var tiles = '';
  if (start && end && start.iso !== end.iso) {
    tiles = ''
      + '<div class="cp-ov-cal-pair">'
        + buildClientShootTileHtml(start)
        + '<div class="cp-ov-cal-join"><span class="cp-ov-cal-dash" aria-hidden="true"></span><em>'+days+' hari</em><span class="cp-ov-cal-dash" aria-hidden="true"></span></div>'
        + buildClientShootTileHtml(end)
      + '</div>';
  } else if (start) {
    tiles = '<div class="cp-ov-cal-pair">'+buildClientShootTileHtml(start)+'</div>';
  }
  var cardMods = '';
  if (shooting.released) cardMods += ' is-released';
  if (phase === 'done') cardMods += ' is-done';
  if (phase === 'live') cardMods += ' is-live';
  return ''
    + '<section class="cp-ov-card cp-ov-glass-mid cp-ov-shoot-card cp-ov-enter cp-shoot-card'+cardMods+'" style="--enter-delay:.16s">'
      + '<div class="cp-ov-shoot">'
        + (tiles || '')
        + '<div class="cp-ov-shoot-copy">'
          + '<div class="cp-ov-shoot-top">'
            + '<span class="cp-ov-eyebrow">Jadwal Shooting</span>'
            + '<span class="cp-ov-pill cp-ov-pill-live '+countdown.tone+'"><i aria-hidden="true"></i>'+escapeHtml(statusPill)+'</span>'
          + '</div>'
          + '<h3 class="cp-ov-shoot-title">'+escapeHtml(shooting.label)+'</h3>'
          + '<p class="cp-ov-shoot-sub">'+escapeHtml(meta)+'</p>'
          + '<div class="cp-ov-note">'+escapeHtml(note)+'</div>'
        + '</div>'
      + '</div>'
    + '</section>';
}

function updateCpSidebarToggle() {
  var shell = document.getElementById('cp-dashboard-card');
  var btn = document.getElementById('cp-sidebar-toggle');
  if (!shell || !btn) return;
  var expanded = shell.classList.contains('cp-sidebar-expanded');
  btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
  btn.setAttribute('title', expanded ? 'Tutup sidebar' : 'Buka sidebar');
}

function toggleCpSidebar(forceExpanded, evt) {
  if (evt && evt.stopPropagation) evt.stopPropagation();
  var shell = document.getElementById('cp-dashboard-card');
  if (!shell) return;
  var expanded = typeof forceExpanded === 'boolean'
    ? forceExpanded
    : !shell.classList.contains('cp-sidebar-expanded');
  shell.classList.toggle('cp-sidebar-expanded', expanded);
  updateCpSidebarToggle();
}

function syncClientPortalSidebar() {
  var name = CLIENT_PORTAL_STATE.name || _opsInternalName || 'Client';
  var email = CLIENT_PORTAL_STATE.email || _opsInternalEmail || '';
  var view = CLIENT_PORTAL_STATE.view || 'overview';
  var user = document.getElementById('cp-sidebar-user');
  if (user) {
    var initial = String(name || 'C').trim().charAt(0).toUpperCase() || 'C';
    user.innerHTML = '<div class="cp-avatar" aria-hidden="true">'+escapeHtml(initial)+'</div>'
      + '<div class="cp-user-meta">'
      + '<strong title="'+escapeHtml(name)+'">'+escapeHtml(name)+'</strong>'
      + (email ? '<span title="'+escapeHtml(email)+'">'+escapeHtml(email)+'</span>' : '')
      + '</div>';
  }

  ['overview', 'payment', 'drive'].forEach(function(key) {
    var btn = document.getElementById('cp-nav-' + key);
    if (btn) btn.classList.toggle('active', view === key);
  });
}

function setClientPortalView(view) {
  var allowed = { overview: 1, payment: 1, drive: 1 };
  CLIENT_PORTAL_STATE.view = allowed[view] ? view : 'overview';

}

function copyClientProjectId(projectId) {
  var id = String(projectId || '').trim();
  if (!id) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(id).then(function() {
      showToast('Disalin', 'Project ID ' + id + ' sudah disalin.');
    }).catch(function() {
      showToast('Project ID', id);
    });
    return;
  }
  showToast('Project ID', id);
}

function buildClientPortalQuickLinks(activeView) {

    { id: 'overview', label: 'Production Tracker' },
    { id: 'payment', label: 'Pembayaran' },

function buildClientPortalGreetingBannerHtml(project) {
  project = project || {};
  var production = project.production || {};
  var ops = project.productionOps || {};
  var clientName = String(project.clientName || CLIENT_PORTAL_STATE.name || 'Client').trim();
  var statusLabel = String(project.status || 'New Lead').trim() || 'Deal';
  var stageLabel = buildProductionStageLabel(ops.stage || production.stage) || 'On Discuss';
  var picName = String(project.pic || production.pic || '').trim() || 'PIC FA Studio';
  var dealDateShort = formatClientPortalDateShort(project.timestamp || ops.updatedAt || '');
  var shootPhase = getClientShootingPhase(project);
  var title = 'Selamat datang, '+escapeHtml(clientName)+'!';
  var sub = 'Kami senang bisa berkolaborasi dengan kamu. Pantau progres project kamu di sini.';
  var extraPill = '';
  if (shootPhase.phase === 'done' || shootPhase.phase === 'released') {

function formatClientPortalDateLong(value) {
  var raw = String(value || '').trim();
  if (!raw) return '';
  var parts = null;
  var iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) parts = { y: Number(iso[1]), m: Number(iso[2]), d: Number(iso[3]) };
  else {
    var parsed = (typeof parseOpsDate_ === 'function') ? parseOpsDate_(raw) : new Date(raw);
    if (parsed && !isNaN(parsed.getTime())) {
      parts = { y: parsed.getFullYear(), m: parsed.getMonth() + 1, d: parsed.getDate() };
    }
  }
  if (!parts) return raw;
  var months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return parts.d + ' ' + (months[parts.m - 1] || '') + ' ' + parts.y;
}

/** Warna chart progress: 0% merah → 50% kuning → 100% hijau. */
function getProgressHeatColor(percent) {
  percent = Math.max(0, Math.min(100, Number(percent) || 0));
  function hexToRgb(hex) {
    return [
      parseInt(hex.slice(1, 3), 16),
      parseInt(hex.slice(3, 5), 16),
      parseInt(hex.slice(5, 7), 16)
    ];
  }
  function mix(a, b, t) {
    return Math.round(a + (b - a) * t);
  }
  var red = hexToRgb('#ef4444');
  var yellow = hexToRgb('#f59e0b');
  var green = hexToRgb('#22c55e');
  var from = red;
  var to = yellow;
  var t = percent / 50;
  if (percent >= 50) {
    from = yellow;
    to = green;
    t = (percent - 50) / 50;
  }
  var r = mix(from[0], to[0], t);
  var g = mix(from[1], to[1], t);
  var b = mix(from[2], to[2], t);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function parseOpsDate_(value) {
  if (!value) return null;
  if (value instanceof Date) return isNaN(value.getTime()) ? null : value;
  var text = String(value).trim();
  if (!text) return null;
  var direct = new Date(text);
  if (!isNaN(direct.getTime())) return direct;
  var idMatch = text.match(/(\d{1,2})\s+(\w+)\s+(\d{4})(?:[,\s]+(\d{1,2})[.:](\d{2}))?/i);
  if (idMatch) {
    var months = { jan:0, feb:1, mar:2, apr:3, mei:4, may:4, jun:5, jul:6, agu:7, aug:7, sep:8, okt:9, oct:9, nov:10, des:11, dec:11 };
    var mon = months[String(idMatch[2] || '').slice(0, 3).toLowerCase()];
    if (mon !== undefined) {
      var d = new Date(Number(idMatch[3]), mon, Number(idMatch[1]), Number(idMatch[4] || 0), Number(idMatch[5] || 0));
      if (!isNaN(d.getTime())) return d;
    }
  }
  return null;
}

function formatRelativeTimeId(value) {
  var date = parseOpsDate_(value);
  if (!date) return 'belum diupdate';
  var diffMs = Date.now() - date.getTime();
  if (diffMs < 0) return 'baru saja';
  var mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'baru saja';
  if (mins < 60) return mins + ' menit lalu';
  var hours = Math.floor(mins / 60);
  if (hours < 24) return hours + ' jam lalu';
  var days = Math.floor(hours / 24);
  if (days === 1) return 'kemarin';
  if (days < 30) return days + ' hari lalu';
  var months = Math.floor(days / 30);
  if (months < 12) return months + ' bulan lalu';
  return Math.floor(months / 12) + ' tahun lalu';
}

function getLeadProductionOpsItems(lead) {

  });

function getProductionOpsSummaryClient(items) {
  items = items || [];
  if (!items.length) return { overallPercent: 0, stage: 'On Discuss' };
  var total = items.reduce(function(sum, item) { return sum + Number(item.progress || 0); }, 0);
  var overallPercent = Math.round(total / items.length);
  var map = {};
  items.forEach(function(item) { map[item.id] = item; });
  var finalVideo = map['final-video'] || {};
  var shootStarted = items.some(function(item) {
    if (item.id === 'marketing') return false;
    return Number(item.progress || 0) > 0;
  });
  var allDone = items.every(function(item) {
    if (Number(item.progress || 0) < 100) return false;
    var approval = String(item.approvalStatus || '').toUpperCase();
    if (approval === 'APPROVED') return true;
    if (approval === 'PENDING' || approval === 'REJECTED' || approval === 'CANCELLED') return false;
    return item.status === 'Done';
  });
  var stage = 'On Discuss';
  if (allDone) stage = 'Project Selesai';
  else if (Number(finalVideo.progress || 0) > 0 || overallPercent >= 70) stage = 'Post Production';
  else if (shootStarted || overallPercent >= 25) stage = 'Production/Shooting';
  return { overallPercent: overallPercent, stage: stage };
}

function buildProdopsDonutHtml(percent, color, label, trackColor) {
  percent = Math.max(0, Math.min(100, Number(percent) || 0));
  color = color || getProgressHeatColor(percent);
  label = label || 'Akumulasi';
  var size = 168;
  var stroke = 22;
  var r = (size - stroke) / 2;
  var cx = size / 2;
  var cy = size / 2;
  var circ = 2 * Math.PI * r;
  var len = (percent / 100) * circ;
  var gap = circ - len;
  var motion = (typeof opsMotionEnabled === 'function') ? opsMotionEnabled() : true;
  try {
    if (motion && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      motion = false;
    }
  } catch (e) {}
  var dashInit = motion ? ('0 ' + circ.toFixed(2)) : (len.toFixed(2) + ' ' + gap.toFixed(2));
  var track = trackColor || 'var(--ops-bar-track, rgba(15,60,80,0.10))';
  return '<div class="prodops-donut" data-percent="' + percent + '">'
    + '<svg class="prodops-donut-svg" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">'
      + '<circle class="prodops-donut-track" cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + track + '" stroke-width="' + stroke + '"/>'
      + '<circle class="prodops-donut-seg" cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" data-len="' + len.toFixed(2) + '" data-gap="' + gap.toFixed(2) + '" stroke-dasharray="' + dashInit + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>'
    + '</svg>'
    + '<div class="prodops-donut-inner"' + (motion ? ' style="opacity:0;transform:scale(.9)"' : '') + '>'
      + '<strong>' + percent + '%</strong><span>' + escapeHtml(label) + '</span>'
    + '</div>'
  + '</div>';
}

function animateProdopsDonut(root) {
  if (!root) return;
  var motion = true;
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) motion = false;
  } catch (e) {}
  if (typeof opsMotionEnabled === 'function' && !opsMotionEnabled()) motion = false;
  if (!motion) {
    root.querySelectorAll('.prodops-donut-seg').forEach(function(c) {
      var len = c.getAttribute('data-len') || '0';
      var gap = c.getAttribute('data-gap') || '0';
      c.style.strokeDasharray = len + ' ' + gap;
    });
    root.querySelectorAll('.prodops-donut-inner').forEach(function(inner) {
      inner.style.opacity = '1';
      inner.style.transform = 'scale(1)';
    });
    return;
  }
  root.querySelectorAll('.prodops-donut-seg').forEach(function(c) {
    var len = parseFloat(c.getAttribute('data-len') || '0');
    var gap = parseFloat(c.getAttribute('data-gap') || '0');
    var total = len + gap;
    c.style.strokeDasharray = '0 ' + total;
    requestAnimationFrame(function() {
      c.style.transition = 'stroke-dasharray .95s cubic-bezier(.22,1,.36,1) .08s';
      c.style.strokeDasharray = len + ' ' + gap;
    });
  });
  root.querySelectorAll('.prodops-donut-inner').forEach(function(inner) {
    inner.style.opacity = '0';
    inner.style.transform = 'scale(.9)';
    requestAnimationFrame(function() {
      inner.style.transition = 'opacity .45s ease .28s, transform .45s cubic-bezier(.22,1,.36,1) .28s';
      inner.style.opacity = '1';
      inner.style.transform = 'scale(1)';
    });
  });
}

function saveProductionOpsDepartment(projectId, departmentId) {
  var lead = findProductionOpsLead(projectId);
  if (!lead) return;
  if (!getInternalPayKey()) {
    showToast('Sesi Habis', 'Silakan login ulang ke Operation System.', 'warning');
    return;
  }
  if (typeof canEditProductionOpsDepartment === 'function' && !canEditProductionOpsDepartment(departmentId)) {
    showToast('Akses ditolak', 'PIC hanya boleh mengubah departemen sendiri.', 'warning');
    return;
  }
  var sourceItems = getLeadProductionOpsItems(lead);
  var lockedDept = sourceItems.find(function(item) { return item.id === departmentId; });
  if (isProductionOpsDeptLockedClient(lockedDept)) {
    showDeptLockedAlert(lockedDept, lead);
    return;
  }
  if (lockedDept && String(lockedDept.approvalStatus || '').toUpperCase() === 'PENDING') {
    showToast('Menunggu Validasi', 'Departemen ini sedang menunggu review Direktur.', 'warning');
    return;
  }
  var items = sourceItems;
  var notes = [];
  items = items.map(function(item) {
    var statusEl = document.getElementById('prodops-status-' + item.id);
    var progressEl = document.getElementById('prodops-progress-' + item.id);
    var picEl = document.getElementById('prodops-pic-' + item.id);
    var noteEl = document.getElementById('prodops-note-' + item.id);
    if (!statusEl || !progressEl || !picEl || !noteEl) return item;
    var status = normalizeProductionOpsStatusClient(statusEl.value);
    var progress = normalizeProductionOpsProgressClient(progressEl.value, status);
    var nextItem = {
      id: item.id,
      label: item.label,
      icon: item.icon,
      pic: picEl.value.trim(),
      status: status,
      progress: progress,
      note: noteEl.value.trim(),
      updatedAt: item.id === departmentId ? new Date().toLocaleString('id-ID') : (item.updatedAt || ''),
      approvalStatus: item.approvalStatus || '',
      approvalId: item.approvalId || '',
      reviewNotes: item.reviewNotes || '',
      order: item.order
    };
    if (item.id === departmentId) {
      notes.push(item.label + ' ' + progress + '% (' + status + ')');
    }
    return nextItem;
  });

  PRODUCTION_OPS_SAVING_ID = projectId + ':' + departmentId;
  showLoading();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      PRODUCTION_OPS_SAVING_ID = '';
      if (res && res.success) {
        lead.productionOpsData = JSON.stringify(res.opsData || items);
        lead.productionOpsUpdatedAt = res.opsUpdatedAt || lead.productionOpsUpdatedAt;
        lead.productionOpsUpdatedBy = res.opsUpdatedBy || lead.productionOpsUpdatedBy;
        if (res.deptFolders || res.catalog) {
          storeOpsFolderCatalog(projectId, res.catalog || [], res.deptFolders || {});
        }
        if (res.production) {
          lead.productionStage = res.production.stage || lead.productionStage;
          lead.productionUpdatedAt = res.production.updatedAt || lead.productionUpdatedAt;
          lead.productionUpdatedBy = res.production.updatedBy || lead.productionUpdatedBy;
          lead.productionNotes = res.production.notes || lead.productionNotes;
        }
        delete PROJECT_TIMELINES[projectId];
        PRODUCTION_OPS_EDITING_ID = '';
        renderProductionOpsView();
        if (projectDetailId && sameProjectIdClient(projectId, projectDetailId)) renderProjectDetail(projectDetailId, true);
        if (typeof isDeptPicUser !== 'function' || !isDeptPicUser()) refreshPendingApprovals();
        var mailNote = res.notification && res.notification.sent
          ? ' Email client dikirim karena stage berubah.'
          : ((res.notification && res.notification.reason) ? ' ' + res.notification.reason : '');
        if (res.needsDirectorValidation && res.pendingDeptApproval) {
          showDeptPendingAlert(res.pendingDeptApproval);
        } else {
          showToast('Production Ops Tersimpan', (notes[0] || 'Update departemen disimpan.') + '.' + mailNote);
        }
      } else {
        renderProductionOpsView();
        showToast('Gagal Update', (res && res.error) || 'Production Ops gagal disimpan.', 'warning');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      PRODUCTION_OPS_SAVING_ID = '';
      renderProductionOpsView();
      showToast('Error', (err && err.message) || 'Gagal menghubungi server. Coba lagi atau refresh halaman.', 'warning');
    })
    .updateProductionOpsProgress(getInternalPayKey(), projectId, items, notes.join(' · '), departmentId);
}

function getClientPaymentSummary(project) {
  project = project || {};
  var driveGate = project.driveGate || {};
  var paymentLabel = project.paymentStatus || 'UNPAID';
  var paidRaw = Number(project.totalPaid || 0) || 0;
  var totalRaw = Number(project.projectTotal || 0) || 0;
  var remainingRaw = project.remainingAmount !== '' && project.remainingAmount != null
    ? Number(project.remainingAmount) || 0
    : (totalRaw > 0 ? Math.max(totalRaw - paidRaw, 0) : 0);
  var payPercent = 0;
  if (driveGate.paymentReady || String(paymentLabel).toUpperCase() === 'LUNAS') {
    payPercent = 100;
  } else if (totalRaw > 0) {
    payPercent = Math.max(0, Math.min(100, Math.round((paidRaw / totalRaw) * 100)));
  } else if (paidRaw > 0) {
    payPercent = 100;
  }
  return {
    paymentLabel: paymentLabel,
    payPercent: payPercent,
    paidRaw: paidRaw,
    totalRaw: totalRaw,
    remainingRaw: remainingRaw,
    totalPaid: project.totalPaid != null ? formatRupiahNumber(project.totalPaid) : 'Rp 0',
    projectTotal: project.projectTotal !== '' && project.projectTotal != null ? formatRupiahNumber(project.projectTotal) : '—',
    remaining: project.remainingAmount !== '' && project.remainingAmount != null
      ? formatRupiahNumber(project.remainingAmount)
      : (totalRaw > 0 ? formatRupiahNumber(remainingRaw) : '—'),
    invoiceNumber: String(project.invoiceNumber || '').trim(),
    invoiceLink: safeExternalUrl(project.invoiceUrl),
    invoiceSentAt: String(project.invoiceSentAt || '').trim(),
    paymentReady: !!driveGate.paymentReady
  };
}


function getClientDriveSummary(project) {
  project = project || {};
  var driveGate = project.driveGate || {};
  var driveUnlocked = project.driveUnlocked === true;
  var driveLink = driveUnlocked ? safeExternalUrl(project.driveUrl) : '';
  var driveGateNote = project.driveGateNote || 'Folder Google Drive dibuka setelah Production Ops 100% selesai dan payment Lunas.';
  var driveLockLabel = 'Drive terkunci';
  if (!driveUnlocked) {
    if (!driveGate.productionReady && !driveGate.paymentReady) {
      driveLockLabel = 'Drive terkunci · produksi 100% + Lunas';
    } else if (!driveGate.productionReady) {
      driveLockLabel = 'Drive terkunci · menunggu produksi 100%';
    } else if (!driveGate.paymentReady) {
      driveLockLabel = 'Drive terkunci · menunggu payment Lunas';
    }
  }
  var driveReadyCount = (driveGate.productionReady ? 1 : 0) + (driveGate.paymentReady ? 1 : 0);
  return {
    driveUnlocked: driveUnlocked,
    driveLink: driveLink,
    driveGate: driveGate,
    driveGateNote: driveGateNote,
    driveLockLabel: driveLockLabel,
    driveReadyCount: driveReadyCount,
    drivePercent: driveUnlocked ? 100 : Math.round((driveReadyCount / 2) * 100)
  };
}

  project = project || {};
